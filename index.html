/* ===== state ===== */
const S={lang:null,picks:[],stage:0,done:{},tests:{},tab:"home",ov:null,view:null,_ph:null};
const KEY="ih_v2";
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
S.ov=null;S.view=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang:S.lang,picks:S.picks,stage:S.stage,done:S.done,tests:S.tests}))}catch(e){}}
const t=k=>(T[S.lang]||T.uz)[k]||k;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function api(path,body){if(!API_URL)return Promise.resolve(null);
  return fetch(API_URL+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({initData:tg&&tg.initData||""},body))}).then(r=>r.json()).catch(()=>null)}
function alertx(m){try{tg&&tg.showAlert?tg.showAlert(m):alert(m)}catch(e){alert(m)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
/* ===== render ===== */
function render(){
  const app=$("#app");
  if(!S.lang){app.innerHTML=langScreen();return}
  let h=`<div class="top"><div class="logo">Interview<b>Hub</b></div><button class="chip" onclick="chLang()">🌐 ${S.lang.toUpperCase()}</button></div>`;
  h+=`<div class="wrap">`+({home:home,reels:reels,lessons:lessonsTab,me:meTab}[S.tab])()+`</div>`;
  h+=`<div class="tabs">`+[["home","🏠",t("home")],["reels","🎬",t("reels")],["lessons","📚",t("lessons")],["me","👤",t("me")]].map(x=>`<button class="${S.tab===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join("")+`</div>`;
  if(S.ov)h+=S.ov();
  app.innerHTML=h;
}
function go(tab){S.tab=tab;S.ov=null;S.view=null;render();scrollTo(0,0)}
function langScreen(){return `<div class="wrap" style="padding-top:60px;text-align:center"><div class="logo" style="font-size:26px">Interview<b>Hub</b></div><h2 style="margin-top:30px">${T.uz.choose} · Выберите язык · Choose language</h2>
${[["uz","O'zbekcha"],["ru","Русский"],["en","English"]].map(l=>`<button class="btn g" onclick="setLang('${l[0]}')">${l[1]}</button>`).join("")}</div>`}
function setLang(l){S.lang=l;save();render()}
function chLang(){S.ov=()=>`<div class="sheet" onclick="S.ov=null;render()"><div onclick="event.stopPropagation()"><h2 style="margin-top:0">${t("choose")}</h2>${[["uz","O'zbekcha"],["ru","Русский"],["en","English"]].map(l=>`<button class="btn ${S.lang===l[0]?'':'g'}" onclick="S.ov=null;setLang('${l[0]}')">${l[1]}</button>`).join("")}</div></div>`;render()}
/* ----- home ----- */
function home(){
  const user=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||"";
  let h=`<h1>${t("hello")}${user?", "+esc(user):""} 👋</h1><p class="mu">${t("tag")}</p><button class="btn" onclick="go('lessons')">📚 ${t("start")}</button>`;
  h+=`<h2>${t("pick")}</h2><p class="mu sm" style="margin-top:-4px">${t("pickh")} · ${S.picks.length}/3</p><div class="grid">`+POS.map(p=>`<button class="pos ${S.picks.includes(p[0])?'on':''}" onclick="togglePick('${p[0]}')"><i>${p[1]}</i>${p[2]}</button>`).join("")+`</div>`;
  h+=`<button class="btn" ${S.picks.length?"":"disabled"} onclick="askSave()">${t("save")}</button>`;
  if(S.stage>=1)h+=`<button class="btn g" onclick="openFlow()">➡️ ${t("cont")}</button>`;
  return h}
function togglePick(k){const i=S.picks.indexOf(k);if(i>=0)S.picks.splice(i,1);else if(S.picks.length<3)S.picks.push(k);else try{tg.HapticFeedback.notificationOccurred("warning")}catch(e){};render()}
function askSave(){S.ov=()=>`<div class="sheet"><div><h2 style="margin-top:0">${t("saved")}</h2><p class="mu">${t("conf")}</p>${S.picks.map(k=>`<div class="card" style="margin:6px 0">${pn(k)}</div>`).join("")}<button class="btn" onclick="confirmPicks()">${t("cont")}</button><button class="btn g" onclick="S.ov=null;render()">${t("edit")}</button></div></div>`;render()}
function confirmPicks(){if(S.stage<1)S.stage=1;save();api("/picks",{picks:S.picks});openFlow()}
/* ----- paid flow ----- */
function openFlow(){const st=Math.max(S.stage,1);S.ov=()=>flowScreen(st);if(S.stage>=5){go("me");return}render()}
function flowHead(n,title){return `<div class="top"><button class="back" onclick="S.ov=null;render()">← ${t("back")}</button><span class="chip">${n}/4</span></div><div class="wrap"><h1>${title}</h1>`}
let QUOTE=null;
function flowScreen(st){
  const stage=S.flowStep||1;
  if(stage===1){return `<div class="ov">${flowHead(1,t("price"))}<div class="card"><div class="mu sm">${S.picks.map(pn).join(" · ")}</div><div style="font-size:24px;font-weight:800;margin-top:8px" id="quote">${QUOTE?esc(QUOTE):t("pricesoon")}</div></div>
  <h2>${t("inc")}</h2><div class="card">✅ ${t("inc1")}<br>✅ ${t("inc2")}<br>✅ ${t("inc3")}<br>✅ ${t("inc4")}</div><button class="btn" onclick="S.flowStep=2;render()">${t("cont")}</button></div></div>`}
  if(stage===2){return `<div class="ov">${flowHead(2,t("terms"))}<div class="card">📌 ${t("t1")}</div><div class="card">📌 ${t("t2")}</div><div class="card">📌 ${t("t3")}</div><p class="mu sm">${t("t4")}</p><button class="btn" onclick="S.flowStep=3;render()">${t("cont")}</button></div></div>`}
  if(stage===3){return `<div class="ov">${flowHead(3,t("contract"))}<div class="card">${OFFER_URL?`<button class="btn g" style="margin:0" onclick="openUrl('${OFFER_URL}')">📄 ${t("openoffer")}</button>`:`<span class="mu">${t("offersoon")}</span>`}</div>
  <label class="chk"><input type="checkbox" id="acc" onchange="$('#accb').disabled=!this.checked"><span>${t("accept")}</span></label><button class="btn" id="accb" disabled onclick="acceptOffer()">${t("cont")}</button></div></div>`}
  return `<div class="ov">${flowHead(4,t("paytitle"))}${["Payme","Click","Uzum","Rahmat"].map(p=>`<button class="pay" onclick="payWith('${p}')">💳 ${p}</button>`).join("")}${PAYMENT_LIVE||DEMO?"":`<p class="mu sm">${t("paysoon")}</p>`}</div></div>`}
function acceptOffer(){api("/accept",{picks:S.picks,ts:Date.now()});S.flowStep=4;render()}
async function payWith(p){
  if(DEMO){S.stage=5;S.flowStep=1;save();S.ov=()=>paidScreen();render();return}
  if(!PAYMENT_LIVE||!API_URL){alertx(t("paysoon"));return}
  const r=await api("/pay",{provider:p,picks:S.picks});if(r&&r.url)openUrl(r.url);else alertx(t("paysoon"))}
function paidScreen(){return `<div class="ov"><div class="wrap" style="padding-top:80px;text-align:center"><div class="big">✅</div><h1>${t("paid")}</h1><p class="mu">${t("paidtxt")}</p><button class="btn" onclick="go('me')">${t("me")}</button></div></div>`}
function openUrl(u){try{/t\.me\//.test(u)&&tg.openTelegramLink?tg.openTelegramLink(u):tg.openLink?tg.openLink(u):window.open(u)}catch(e){window.open(u)}}
Object.defineProperty(S,"flowStep",{value:1,writable:true,enumerable:false});
/* ----- me / reels ----- */
function meTab(){
  if(S.stage>=5)return `<h1>${t("me")}</h1><div class="card"><div class="row"><span style="font-size:26px">🚀</span><div class="grow"><b>${t("mep")}</b><div class="mu sm">${t("mepd")}</div></div></div></div>`+S.picks.map(k=>`<div class="card row"><div class="grow">${pn(k)}</div><span class="tag ok">✓</span></div>`).join("");
  const fake=[1,2,3].map(()=>`<div class="card row"><span style="font-size:26px">🏢</span><div class="grow"><div style="height:12px;width:70%;background:#444;border-radius:6px"></div><div style="height:10px;width:45%;background:#333;border-radius:6px;margin-top:8px"></div></div></div>`).join("");
  return `<h1>${t("me")}</h1><div class="lockw"><div class="blur">${fake}</div><div class="lk"><div class="big" style="font-size:38px">🔒</div><b style="font-size:17px">${t("melock")}</b><p class="mu sm">${t("melockt")}</p><button class="btn" style="width:auto;padding:12px 22px" onclick="${S.picks.length?'S.stage=Math.max(S.stage,1);openFlow()':"go('home')"}">${t("mego")}</button></div></div>`}
function reels(){return `<div class="wrap" style="text-align:center;padding-top:80px"><div class="big">🎬</div><h2>${t("reelst")}</h2></div>`}
/* ----- lessons ----- */
function lessonsTab(){
  if(S.view&&S.view.t==="chapters")return chapters(S.view.k);
  if(S.view&&S.view.t==="read")return reader();
  if(S.view&&S.view.t==="test")return testView();
  return `<h1>${t("lessons")} <span class="tag ok">${t("free")}</span></h1>`+POS.map(p=>{const b=BOOKS[p[0]];
    if(!b)return `<div class="card row" style="opacity:.6"><span style="font-size:24px">${p[1]}</span><div class="grow">${p[2]}</div><span class="tag">${t("soon")}</span></div>`;
    const dn=(S.done[p[0]]||[]).length,tot=b.ch.length,pass=(S.tests[p[0]]||{}).pass;
    return `<button class="card row" style="width:100%;text-align:left" onclick="openBook('${p[0]}')"><span style="font-size:24px">${p[1]}</span><div class="grow"><b>${p[2]}</b><div class="bar" style="margin-top:8px"><i style="width:${dn/tot*100}%"></i></div><div class="mu sm">${dn}/${tot} ${t("ch")}</div></div>${pass?'<span class="tag ok">✓ test</span>':''}</button>`}).join("")}
function openBook(k){S.view={t:"chapters",k};render();scrollTo(0,0)}
function chapters(k){const b=BOOKS[k],dn=S.done[k]||[];
  let h=`<button class="back" onclick="S.view=null;render()">← ${t("lessons")}</button><h1>${pn(k)}</h1><p class="mu sm">${esc(b.intro)}</p>`;
  h+=b.ch.map((c,i)=>`<button class="card row" style="width:100%;text-align:left" onclick="openCh('${k}',${i})"><b style="color:var(--red2)">${i+1}</b><div class="grow">${esc(c.t)}</div>${dn.includes(i)?'<span class="tag ok">✓</span>':''}</button>`).join("");
  if(TESTS_ON&&TESTS[k])h+=`<button class="btn" onclick="startTest('${k}')">📝 ${t("test")}</button>`;else h+=`<p class="mu sm">${t("tests_off")}</p>`;
  return h}
function openCh(k,i){S.view={t:"read",k,i};render();scrollTo(0,0)}
function blk(b){
  if(b.t==="table")return `<table>${b.rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table>`;
  if(b.t==="quote")return `<div class="q">${esc(b.x)}</div>`;
  if(b.t==="tip")return `<div class="tip">💡 ${esc(b.x)}</div>`;
  if(b.t==="who")return `<div class="${/BAD/.test(b.x)?'bad':'good'}" style="margin-top:10px">${/BAD/.test(b.x)?"❌":"✅"} ${esc(b.x)}</div>`;
  if(b.t==="lines")return `<ul style="margin:6px 0;padding-left:20px">${b.x.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
  if(b.t==="h")return `<div style="font-weight:700;margin-top:10px">${esc(b.x)}</div>`;
  return `<p style="margin:4px 0">${esc(b.x)}</p>`}
function reader(){const {k,i}=S.view,c=BOOKS[k].ch[i],n=BOOKS[k].ch.length;
  let h=`<button class="back" onclick="openBook('${k}')">← ${pn(k)}</button><div class="mu sm">${i+1} ${t("of")} ${n}</div><div class="bar"><i style="width:${(i+1)/n*100}%"></i></div><h1 style="margin-top:14px">${esc(c.t)}</h1>`;
  c.s.forEach(s=>{h+=`<div class="card"><div class="mu sm" style="letter-spacing:.5px">${esc(s.k)}</div><h2 style="margin-top:2px">${esc(s.h)}</h2>${s.b.map(blk).join("")}</div>`});
  h+=`<button class="btn" onclick="finishCh('${k}',${i})">${i<n-1?t("next"):t("done")}</button>`;
  if(i>0)h+=`<button class="btn g" onclick="openCh('${k}',${i-1})">${t("prev")}</button>`;
  return h}
function finishCh(k,i){const d=S.done[k]=S.done[k]||[];if(!d.includes(i))d.push(i);save();if(i<BOOKS[k].ch.length-1)openCh(k,i+1);else openBook(k)}
/* ----- test ----- */
function startTest(k){
  const tr=S.tests[k]||{};
  if(!DEMO&&tr.lock&&Date.now()<tr.lock){S.view={t:"test",k,wait:tr.lock};render();return}
  S.view={t:"test",k,qs:shuffle(TESTS[k]).map(q=>({q:q.q,c:q.a[0],o:shuffle(q.a)})),i:0,sc:0,pick:null};render();scrollTo(0,0)}
function testView(){const v=S.view,k=v.k;
  if(v.wait)return `<button class="back" onclick="openBook('${k}')">←</button><div class="card" style="text-align:center"><div class="big">⏳</div><p>${t("wait")}<br><b>${new Date(v.wait).toLocaleString()}</b></p></div>`;
  if(v.end){const ok=v.sc>=PASS_MIN;
    let h=`<div style="text-align:center;padding-top:30px"><div class="big">${ok?"🎉":"💪"}</div><h1>${ok?t("pass"):t("fail")}</h1><div style="font-size:40px;font-weight:800;color:${ok?'var(--ok)':'var(--red2)'}">${v.sc}/10</div>${ok?"":`<p class="mu">${t("need")} ${PASS_MIN}/10</p>`}</div>`;
    if(ok){const nk=nextLesson(k);h+=nk?`<button class="btn" onclick="openBook('${nk}')">${t("nextles")} →</button>`:`<div class="card" style="text-align:center"><b>${t("allok")}</b><p class="mu sm">${t("allokt")}</p></div>`}
    else h+=`<button class="btn" onclick="startTest('${k}')">${t("retry")}</button>`;
    return h+`<button class="btn g" onclick="openBook('${k}')">${pn(k)}</button>`}
  const q=v.qs[v.i];
  let h=`<div class="mu sm">${t("q")} ${v.i+1} ${t("of")} 10</div><div class="bar"><i style="width:${v.i/10*100}%"></i></div><h2>${esc(q.q)}</h2>`;
  h+=q.o.map((o,j)=>{let c="";if(v.pick!==null){if(o===q.c)c="ok";else if(j===v.pick)c="no"}return `<button class="opt ${c}" ${v.pick!==null?"disabled":""} onclick="answer(${j})">${esc(o)}</button>`}).join("");
  return h}
function answer(j){const v=S.view,q=v.qs[v.i];v.pick=j;if(q.o[j]===q.c)v.sc++;render();
  setTimeout(()=>{if(!S.view||S.view!==v)return;v.pick=null;v.i++;if(v.i>=10)endTest();render()},900)}
function endTest(){const v=S.view,k=v.k,ok=v.sc>=PASS_MIN;v.end=true;
  const tr=S.tests[k]=S.tests[k]||{};tr.score=v.sc;if(ok){tr.pass=true;tr.lock=0}else tr.lock=Date.now()+LOCK_H*3600e3;save();
  api("/result",{position:k,score:v.sc,pass:ok})}
function nextLesson(k){const ks=(S.picks.length?S.picks:POS.map(p=>p[0])).filter(x=>BOOKS[x]);const i=ks.indexOf(k);
  const rest=i>=0?ks.slice(i+1).concat(ks.slice(0,i)):ks;return rest.find(x=>!(S.tests[x]||{}).pass)||null}
/* quote: from server only */
if(API_URL)api("/quote",{}).then(r=>{if(r&&r.text){QUOTE=r.text}});
render();
</script></body></html>
