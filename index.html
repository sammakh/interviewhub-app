<title>Interview Hub</title>

<style>
:root{--bg:#0B0B0F;--card:#17171C;--card2:#1F1F26;--red:#CF3637;--red2:#FF6B6C;--ok:#3DDC97;--am:#F2B84B;--tx:#fff;--mu:#9A9AA6;--ln:#2a2a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Plus Jakarta Sans",Inter,system-ui,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln)}
.logo{font:700 17px Poppins,system-ui,sans-serif}.logo b{color:var(--red)}
.chip{background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.wrap{padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 6px}h2{font-size:17px;margin:18px 0 8px}
.mu{color:var(--mu)}.sm{font-size:13px}
.btn{display:block;width:100%;background:var(--red);padding:14px;border-radius:14px;font-weight:700;text-align:center;margin-top:12px}
.btn.g{background:var(--card2)}.btn[disabled]{opacity:.4}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pos{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px 10px;text-align:center;font-weight:600;font-size:14px}
.pos.on{border-color:var(--red);background:#2a1517}
.pos i{display:block;font-size:22px;font-style:normal;margin-bottom:4px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101015;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;background:none;padding:10px 0 8px;font-size:11px;color:var(--mu)}
.tabs button.on{color:var(--red2)}.tabs i{display:block;font-size:20px;font-style:normal}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding-bottom:40px}
.sheet{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.opt{display:block;width:100%;text-align:left;background:var(--card);padding:14px;border-radius:12px;margin:8px 0;border:2px solid transparent}
.opt.ok{border-color:var(--ok);background:#12281f}.opt.no{border-color:var(--red);background:#2a1517}
.back{background:none;color:var(--red2);padding:6px 0;font-weight:600}
.blur{filter:blur(7px);opacity:.55;pointer-events:none}
.lockw{position:relative}.lockw .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--mu);margin-left:6px}
.tag.ok{background:#12281f;color:var(--ok)}
.q{background:var(--card2);border-left:3px solid var(--red);padding:10px 12px;border-radius:8px;margin:8px 0}
.tip{background:#2a2412;border-left:3px solid var(--am);padding:10px 12px;border-radius:8px;margin:8px 0}
.bad{color:var(--red2);font-weight:700}.good{color:var(--ok);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}td,th{border-bottom:1px solid var(--ln);padding:6px 4px;text-align:left;vertical-align:top}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.chk input{width:22px;height:22px;accent-color:var(--red);flex:none}
.pay{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px;margin:8px 0;width:100%;text-align:left;font-weight:700}
.big{font-size:56px;text-align:center}
</style></head><body>

<script>
const BOOKS={"dispatch":{"intro":"DISPATCH\nBOX TRUCK","ch":[{"t":"The role & the logistics chain","s":[{"k":"THE ROLE","h":"The air traffic controller of trucking","b":[{"t":"p","x":"Dispatchers don’t drive — they make sure everything moves smoothly. Three main jobs:"},{"t":"h","x":"Find loads"},{"t":"p","x":"Search load boards and brokers for freight that fits the truck."},{"t":"h","x":"Negotiate"},{"t":"p","x":"Get a fair rate from the broker — every extra dollar is profit."},{"t":"h","x":"Keep trucks moving"},{"t":"p","x":"Send load info to drivers, watch pickups and deliveries, solve problems."},{"t":"tip","x":"Key idea: good dispatchers keep trucks moving and reduce empty miles."}]},{"k":"LOGISTICS CHAIN","h":"How freight moves in the US","b":[{"t":"h","x":"Shipper"},{"t":"h","x":"Owns the cargo"},{"t":"h","x":"Broker"},{"t":"h","x":"Finds trucks"},{"t":"h","x":"Carrier"},{"t":"h","x":"Owns the truck"},{"t":"h","x":"Dispatcher"},{"t":"h","x":"Manages truck & driver"},{"t":"h","x":"Driver"},{"t":"h","x":"Moves the freight"},{"t":"h","x":"Receiver"},{"t":"h","x":"Gets the cargo"},{"t":"p","x":"Example: a warehouse in Ohio sends products to New Jersey. The broker finds a carrier, the dispatcher accepts the load and sends the driver to pickup."}]}]},{"t":"The box truck","s":[{"k":"THE TRUCK","h":"What is a box truck?","b":[{"t":"h","x":"26 ft"},{"t":"h","x":"Size"},{"t":"p","x":"A straight truck with a cargo box — usually up to 26 feet long, about 8 feet wide and high."},{"t":"h","x":"10,000 lbs"},{"t":"h","x":"Payload"},{"t":"p","x":"Can carry up to about 10,000 lbs. Always check each truck’s real limit."},{"t":"h","x":"~12"},{"t":"h","x":"Pallets"},{"t":"p","x":"A 26-foot box fits about 12 standard pallets (two rows)."},{"t":"h","x":"≤ 26,000"},{"t":"h","x":"No CDL (usually)"},{"t":"p","x":"Most are rated up to 26,000 lbs GVWR, so many drivers don’t need a CDL."},{"t":"h","x":"Liftgate"},{"t":"h","x":"Liftgate"},{"t":"p","x":"Many have a power liftgate to load and unload without a dock."},{"t":"h","x":"Partial"},{"t":"h","x":"Typical loads"},{"t":"p","x":"Partial and LTL loads, local and regional runs, expedited freight."},{"t":"p","x":"Specs from a typical 26-ft non-CDL rental box truck (Penske). Trucks vary — always check yours."}]},{"k":"BOX TRUCK VS SEMI","h":"How a box truck is different from a semi","b":[{"t":"table","rows":[["","Box truck (26 ft)","Semi with 53-ft dry van"],["Max cargo","Up to about 10,000 lbs","Up to about 46,000 lbs"],["Pallets","About 12","About 26"],["License","Usually no CDL","CDL Class A"],["Typical loads","Partial / LTL, local, expedited","Full truckload, long haul"],["Loading","Liftgate + pallet jack, docks too","Dock-high loading"],["Trailer swap","No — the box is part of the truck","Yes — drop & hook possible"]]},{"t":"p","x":"Before booking, always ask: does this load fit MY truck — weight, pallets, liftgate, appointment?"}]}]},{"t":"Load boards","s":[{"k":"LOAD BOARDS","h":"Where dispatchers find freight","b":[{"t":"h","x":"DAT"},{"t":"p","x":"The biggest load board: loads, rates and market conditions by lane."},{"t":"h","x":"Truckstop"},{"t":"p","x":"Another major load board — filter by equipment type (box truck / straight truck)."},{"t":"h","x":"Amazon Relay"},{"t":"p","x":"Amazon’s own load board (mostly for semi trucks)."},{"t":"h","x":"Brokers you know"},{"t":"p","x":"Repeat brokers often call good carriers first."},{"t":"h","x":"EXAMPLE BOX TRUCK LOAD"},{"t":"h","x":"Atlanta, GA → Charlotte, NC"},{"t":"p","x":"245 miles · 6 pallets · 6,000 lbs · liftgate at delivery · rate $650"},{"t":"h","x":"6 pallets — fits (about 12 max)"},{"t":"h","x":"6,000 lbs — under the payload"},{"t":"h","x":"Liftgate needed — truck has one?"},{"t":"h","x":"Appointment time works?"}]}]},{"t":"Rate per mile & deadhead","s":[{"k":"RATE PER MILE","h":"Rate per mile (RPM) — is the load profitable?","b":[{"t":"h","x":"$650"},{"t":"p","x":"Total rate the broker pays."},{"t":"h","x":"245 miles"},{"t":"p","x":"Loaded miles from pickup to delivery."},{"t":"h","x":"$2.65 / mile"},{"t":"p","x":"$650 ÷ 245 miles = rate per mile."},{"t":"p","x":"Formula: Rate ÷ Miles = Rate per mile. Then compare RPM with:"},{"t":"lines","x":["Fuel costs and tolls","Driver pay","Empty miles to get to the pickup (deadhead) — next slide"]}]},{"k":"DEADHEAD","h":"The truck is 55 empty miles from pickup","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"p","x":"Books the load right away without counting deadhead."},{"t":"p","x":"245 + 55 = 300 total miles → $650 ÷ 300 = only $2.17 per mile."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"p","x":"Counts deadhead first, then asks: “Can you do $750?”"},{"t":"p","x":"$750 ÷ 300 miles = $2.50 per mile — the load becomes profitable."}]}]},{"t":"Negotiation & rates","s":[{"k":"NEGOTIATION","h":"A real negotiation — dispatcher vs broker","b":[{"t":"h","x":"Broker"},{"t":"p","x":"This load from Houston to Atlanta is paying $1,800."},{"t":"h","x":"Dispatcher"},{"t":"p","x":"That’s about 790 miles — around $2.27 per mile. With fuel at $4/gal and 120 miles deadhead, we’d need at least $2,000. Can you meet me there?"},{"t":"h","x":"Broker"},{"t":"p","x":"Let me check. I can do $1,950."},{"t":"h","x":"Dispatcher"},{"t":"p","x":"If you can cover $1,950 and include detention pay, we’ll lock it in now."},{"t":"h","x":"Negotiate smart"},{"t":"lines","x":["Know the market rate (DAT) before you call.","Explain WHY: fuel, deadhead, urgency.","Highlight value: on time, tracking, good equipment.","Stay polite — never just say “too low”.","Ask for extras: detention, return loads."]}]},{"k":"RATES","h":"What makes a rate go up or down","b":[{"t":"h","x":"Lane"},{"t":"p","x":"Popular lanes may pay less; remote lanes pay more."},{"t":"h","x":"Season"},{"t":"p","x":"Holidays, produce and storm season → higher demand, higher rates."},{"t":"h","x":"Fuel prices"},{"t":"p","x":"Diesel goes up → carriers ask for more."},{"t":"h","x":"Deadhead"},{"t":"p","x":"Long empty miles to pickup → the rate should be higher."},{"t":"h","x":"Urgency"},{"t":"p","x":"Last-minute or time-critical loads pay more."},{"t":"h","x":"Truck capacity"},{"t":"p","x":"Few trucks in the area → carriers can ask for more."}]}]},{"t":"Documents & accessorial charges","s":[{"k":"DOCUMENTS","h":"The three documents in every load","b":[{"t":"h","x":"Rate Confirmation"},{"t":"h","x":"Broker → carrier: price & details"},{"t":"h","x":"Pickup → BOL"},{"t":"h","x":"Cargo details, signed"},{"t":"h","x":"Delivery → POD"},{"t":"h","x":"Receiver signs"},{"t":"h","x":"Payment"},{"t":"h","x":"Invoice + RC, BOL, POD"},{"t":"p","x":"Without a signed POD, brokers may refuse to pay. The dispatcher makes sure the driver sends clear photos of every document."}]},{"k":"ACCESSORIAL CHARGES","h":"Extra money the dispatcher must ask for","b":[{"t":"table","rows":[["Charge","What it means","What the dispatcher does"],["Detention","Driver waits too long (usually after 2 hours)","Send check-in/out times, request detention pay"],["Layover","Driver must stay overnight","Ask the broker for layover pay"],["TONU","Load cancelled after the truck was dispatched","Request TONU — typically $150–$300"],["Lumper","Warehouse workers unload the freight","Get approval and the receipt"],["Driver assist","Driver helps load or unload","Confirm the extra pay on the RC"],["Liftgate","Driver uses the liftgate (no dock)","Ask if the broker pays extra — confirm on the RC"]]}]}]},{"t":"Load types & cancellations","s":[{"k":"LOAD TYPES","h":"Types of loads — and what changes for a box truck","b":[{"t":"h","x":"Live load"},{"t":"p","x":"Driver waits while the truck is loaded (or unloaded). Most box truck loads work this way."},{"t":"h","x":"Drop & hook"},{"t":"p","x":"Driver drops an empty trailer and takes a loaded one. Not possible with a box truck — the box is part of the truck."},{"t":"h","x":"Preloaded trailer"},{"t":"p","x":"Trailer is loaded before the driver arrives. Also a semi-trailer setup."},{"t":"p","x":"Box truck tip: ask the broker about the dock — no dock means the liftgate and a pallet jack are needed."}]},{"k":"CANCELLATIONS","h":"When a load is cancelled","b":[{"t":"h","x":"Before dispatch"},{"t":"p","x":"No driver assigned yet → usually no penalty."},{"t":"h","x":"After dispatch"},{"t":"p","x":"Truck is already on the way → TONU fee, typically $150–$300."},{"t":"h","x":"After pickup"},{"t":"p","x":"Very rare. Freight may be returned or rebooked; costs are negotiated."},{"t":"h","x":"Example"},{"t":"lines","x":["The driver is dispatched for a 10:00 AM pickup. At 8:30 AM the broker cancels.","The truck was already assigned and dispatched, so the carrier can charge TONU.","Good dispatchers always have a backup load ready."]}]}]},{"t":"Problems on the road & the dispatch board","s":[{"k":"PROBLEMS ON THE ROAD","h":"Common dispatch problems — and what to do","b":[{"t":"table","rows":[["Problem","What the dispatcher does"],["Truck breakdown","Tell the broker immediately and arrange the repair with Fleet"],["Driver not responding","Call the driver and check the GPS location"],["Wrong pickup address","Contact the broker and get the correct address"],["Overweight load","Driver stays at the facility until the weight issue is fixed"],["No dock at delivery","Use the liftgate and pallet jack — confirm before booking"],["Delay (traffic, weather)","Update the broker with a new ETA and reschedule if needed"]]}]},{"k":"DISPATCH BOARD","h":"The dispatch board — the control center","b":[{"t":"h","x":"What it shows"},{"t":"p","x":"Which drivers are free · truck locations · pickup and delivery schedules · status (en route, at shipper, loaded, delivered)"},{"t":"h","x":"Key functions"},{"t":"p","x":"Assign loads by location and equipment · track progress in real time · communication hub · reroute when there is a problem"},{"t":"h","x":"Types"},{"t":"p","x":"Manual (whiteboard) · digital (McLeod, Samsara, DAT, TMS) · mobile apps for drivers"},{"t":"h","x":"Why it matters"},{"t":"p","x":"Keeps work organized, reduces empty miles and shows who has which load"}]}]},{"t":"Never do this, a scenario & the golden rule","s":[{"k":"NEVER DO THIS","h":"Double brokering is illegal","b":[{"t":"h","x":"Blacklisted"},{"t":"p","x":"Brokers stop working with the carrier."},{"t":"h","x":"Money lost"},{"t":"p","x":"Unpaid loads and claims."},{"t":"h","x":"Legal trouble"},{"t":"p","x":"Fines and lawsuits."},{"t":"h","x":"What is double brokering?"},{"t":"lines","x":["A carrier gives a load to another carrier without the broker’s permission.","The rate confirmation says the carrier must haul the load itself — no third parties."]}]},{"k":"SCENARIO","h":"The driver has waited 4 hours at the warehouse","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"p","x":"Does nothing."},{"t":"p","x":"The company loses detention money it earned."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"p","x":"Contacts the broker and requests detention pay."},{"t":"p","x":"Sends check-in and check-out times as proof — the company gets paid for the waiting time."}]},{"k":"THE GOLDEN RULE OF DISPATCH","h":"CALCULATE BEFORE YOU BOOK.","b":[{"t":"p","x":"Count the deadhead, check the truck fits, know the market rate — then negotiate."}]}]},{"t":"Interview questions","s":[{"k":"INTERVIEW QUESTIONS (1/4)","h":"Core questions — model answers","b":[{"t":"h","x":"Q1"},{"t":"h","x":"What is rate per mile?"},{"t":"quote","x":"“Rate divided by miles. For example, $650 for 245 miles is about $2.65 per mile. I include deadhead miles to see the real rate.”"},{"t":"h","x":"Q2"},{"t":"h","x":"What is deadhead?"},{"t":"quote","x":"“Empty miles without freight — for example, driving to the pickup. I always add them when I calculate the rate per mile.”"},{"t":"h","x":"Q3"},{"t":"h","x":"What is detention?"},{"t":"quote","x":"“Payment when the driver waits too long at pickup or delivery, usually after 2 hours. I request it with check-in and check-out times.”"}]},{"k":"INTERVIEW QUESTIONS (2/4)","h":"Core questions — model answers","b":[{"t":"h","x":"Q4"},{"t":"h","x":"What is TONU?"},{"t":"quote","x":"“Truck Ordered, Not Used — a fee when the broker cancels after the truck was dispatched. Typically $150–$300.”"},{"t":"h","x":"Q5"},{"t":"h","x":"What are a BOL and a POD?"},{"t":"quote","x":"“The BOL is the document from pickup that describes the freight. The POD is signed by the receiver and proves delivery — we need it to get paid.”"},{"t":"h","x":"Q6"},{"t":"h","x":"What is drop and hook?"},{"t":"quote","x":"“The driver drops one trailer and hooks a loaded one. With a box truck that’s not possible — the box is part of the truck, so loads are live.”"}]},{"k":"INTERVIEW QUESTIONS (3/4)","h":"Core questions — model answers","b":[{"t":"h","x":"Q7"},{"t":"h","x":"What is double brokering?"},{"t":"quote","x":"“Giving a load to another carrier without the broker’s permission. It’s illegal and leads to blacklisting, money loss and legal problems.”"},{"t":"h","x":"Q8"},{"t":"h","x":"How is a box truck different from a semi?"},{"t":"quote","x":"“A box truck is smaller: up to about 10,000 lbs and 12 pallets, usually no CDL, often a liftgate — good for partial, local and expedited loads.”"},{"t":"h","x":"Q9"},{"t":"h","x":"How do you negotiate with a broker?"},{"t":"quote","x":"“I check the market rate on DAT, count deadhead and fuel, explain why I need more, stay polite, and ask for extras like detention.”"}]},{"k":"INTERVIEW QUESTIONS (4/4)","h":"Situation and personal questions","b":[{"t":"h","x":"Q10"},{"t":"p","x":"The truck breaks down on the way. What do you do?"},{"t":"quote","x":"“I make sure the driver is safe, tell the broker immediately with a new plan, and work with Fleet to arrange the repair.”"},{"t":"h","x":"Q11"},{"t":"h","x":"What do you check before booking a load?"},{"t":"quote","x":"“Pickup and delivery, weight and pallets for my truck, liftgate, rate per mile with deadhead, appointment times and broker reliability.”"},{"t":"h","x":"Q12"},{"t":"h","x":"Why do you want to be a dispatcher?"},{"t":"quote","x":"“I like solving problems and negotiating, and dispatch is the heart of a trucking company. I want to grow in US logistics.” [add your own reason]"}]}]},{"t":"Vocabulary & checklists","s":[{"k":"VOCABULARY","h":"Words to use in the interview","b":[{"t":"table","rows":[["Term","Meaning"],["RPM","Rate per mile"],["Deadhead","Empty miles without freight"],["Load board","Website to find loads (DAT)"],["Broker","Middleman who finds trucks"],["Carrier","Company that owns the truck"],["Shipper / Receiver","Sends / gets the cargo"],["RC","Rate Confirmation"],["BOL","Bill of Lading"],["POD","Proof of Delivery"],["Lane","Route from city A to city B"]]},{"t":"table","rows":[["Term","Meaning"],["Detention","Paid waiting time"],["Layover","Overnight stay"],["TONU","Truck Ordered, Not Used"],["Lumper","Paid unloading labor"],["Driver assist","Driver helps load/unload"],["Liftgate","Platform that lifts pallets"],["Live load","Driver waits while loading"],["Drop & hook","Swap trailers (semi only)"],["Double brokering","Illegal re-brokering"],["Partial / LTL","Load smaller than a full truck"]]}]},{"k":"CHECKLISTS","h":"Two checklists to remember","b":[{"t":"h","x":"Before booking a load"},{"t":"h","x":"Pickup and delivery location"},{"t":"h","x":"Weight and pallets fit the truck"},{"t":"h","x":"Liftgate or dock needed?"},{"t":"h","x":"Rate per mile with deadhead"},{"t":"h","x":"Appointment times"},{"t":"h","x":"Broker reliability"},{"t":"h","x":"Accessorials on the RC"},{"t":"h","x":"Before your interview"},{"t":"h","x":"Calculate RPM with deadhead"},{"t":"h","x":"Explain box truck vs semi"},{"t":"h","x":"Practice the negotiation"},{"t":"h","x":"Answer Q1–Q12 out loud"},{"t":"h","x":"60-second “Tell me about yourself”"}]}]}]},"update":{"intro":"UPDATER\nINTERVIEW PREP","ch":[{"t":"The role & where the updater sits","s":[{"k":"THE ROLE","h":"What the update department does","b":[{"t":"p","x":"The updater manages the information about the shipment. Three main jobs:"},{"t":"h","x":"Track"},{"t":"p","x":"Know where every truck is — using GPS, ELD and calls to drivers."},{"t":"h","x":"Update"},{"t":"p","x":"Send clear status updates and ETAs to brokers and customers."},{"t":"h","x":"Support"},{"t":"p","x":"Keep Dispatch, Accounting, Safety and Fleet up to date."},{"t":"tip","x":"Key idea: make sure everyone knows where the truck is and when it will arrive."}]},{"k":"LOGISTICS CHAIN","h":"Where the updater sits","b":[{"t":"h","x":"Shipper"},{"t":"h","x":"Owns the cargo"},{"t":"h","x":"Broker"},{"t":"h","x":"Finds trucks"},{"t":"h","x":"Carrier"},{"t":"h","x":"Owns the truck"},{"t":"h","x":"Dispatcher"},{"t":"h","x":"Manages load & driver"},{"t":"h","x":"Updater"},{"t":"h","x":"Manages information"},{"t":"h","x":"Driver"},{"t":"h","x":"Moves the freight"},{"t":"h","x":"Receiver"},{"t":"h","x":"Gets the cargo"},{"t":"p","x":"Dispatcher manages the load and the driver. Updater manages the information about the shipment."}]}]},{"t":"Load statuses","s":[{"k":"LOAD STATUSES","h":"Types of updates — with example messages","b":[{"t":"p","x":"Status order in the TMS: Dispatched → At shipper → Loaded → In transit → At receiver → Delivered → POD received"},{"t":"table","rows":[["Status","Example message to the broker"],["Arrived at pickup","Driver arrived at pickup at 09:15 and is waiting for loading."],["Loaded","Driver loaded at 10:30 and departed the facility."],["In transit","Driver in transit. ETA 16:00."],["Arrived at delivery","Driver arrived at delivery at 14:50 and is waiting for unloading."],["Delivered","Load delivered at 16:30. POD will be sent shortly."]]},{"t":"p","x":"Every update answers three questions: Where is the truck?  What is the status?  When will it arrive?"}]}]},{"t":"From pickup to delivery","s":[{"k":"WORKFLOW","h":"Pickup to delivery — what the updater does","b":[{"t":"h","x":"1 · Load assigned"},{"t":"p","x":"Check dispatch info: addresses, pickup and delivery times, reference numbers. Log it in the system."},{"t":"h","x":"2 · Before pickup"},{"t":"p","x":"Call the driver to confirm they are on the way. Tell the broker if the ETA changes. Record check-in at the shipper."},{"t":"h","x":"3 · Pickup"},{"t":"p","x":"Status: “At shipper – loading.” After loading, record check-out and send the broker the seal #, BOL #, weight and commodity."},{"t":"h","x":"4 · In transit"},{"t":"p","x":"Watch the truck on GPS/ELD or with check-in calls. Delay? Tell the broker immediately with a new ETA."},{"t":"h","x":"5 · Delivery"},{"t":"p","x":"Record check-in and check-out. Collect the POD from the driver: “Load delivered at [time], POD available.”"},{"t":"h","x":"6 · After delivery"},{"t":"p","x":"Upload BOL and POD. Tell Accounting the load is ready to bill (and about detention). Close the load with notes."}]},{"k":"AT THE SHIPPER","h":"Photos the updater asks the driver for","b":[{"t":"h","x":"Trailer at the dock"},{"t":"p","x":"Proof the truck arrived and when."},{"t":"h","x":"Loaded trailer"},{"t":"p","x":"Shows how the freight was loaded."},{"t":"h","x":"Seal picture"},{"t":"p","x":"Seal number goes to the broker."},{"t":"h","x":"Reefer temperature"},{"t":"p","x":"Proves the correct temperature."}]}]},{"t":"ETA & broker rules","s":[{"k":"ETA","h":"How to calculate an ETA","b":[{"t":"h","x":"miles left"},{"t":"h","x":"mph average"},{"t":"h","x":"hours"},{"t":"h","x":"ETA = Estimated Time of Arrival"},{"t":"h","x":"Now 10:00 AM + 4 hours = arrives 2:00 PM"},{"t":"p","x":"Add time for fuel stops and required breaks. Brokers plan around your ETA — accuracy matters."}]},{"k":"REAL BROKER RULES","h":"When a real rate confirmation asks for updates","b":[{"t":"h","x":"Pickup"},{"t":"p","x":"Send a status update when the driver picks up the load."},{"t":"h","x":"Delivery"},{"t":"p","x":"Send a status update when the load is delivered."},{"t":"h","x":"Late?"},{"t":"p","x":"If a pickup or delivery appointment will be missed, tell the broker as soon as it is safe."},{"t":"h","x":"Also in the same rate confirmation"},{"t":"lines","x":["Seals must stay intact for the whole trip.","The broker prefers updates through carrier dispatch, not from the driver.","If the driver calls the broker, never while driving."]}]}]},{"t":"Tools & a daily routine","s":[{"k":"TOOLS","h":"Tools the updater uses every day","b":[{"t":"p","x":"Samsara fleet tracking (GPS/ELD) · updater handout"},{"t":"h","x":"TMS"},{"t":"p","x":"McLeod, Ascend, TruckMate — where load statuses are updated."},{"t":"h","x":"GPS / ELD"},{"t":"p","x":"Samsara and similar: live truck location and driver hours."},{"t":"h","x":"Google Sheet"},{"t":"p","x":"Many companies track loads on a shared sheet dashboard."},{"t":"h","x":"Phone, SMS, email"},{"t":"p","x":"Calls and messages with drivers, brokers and other departments."}]},{"k":"DAILY ROUTINE","h":"A typical day for an updater","b":[{"t":"table","rows":[["Time","Task"],["08:00","Check all active loads in the TMS"],["09:00","Call drivers and collect status updates"],["All day","Update statuses in the system in real time"],["10:00+","Upload documents from completed loads"],["After 14:00","Confirm delivered loads with PODs"],["15:00–17:00","Tell Accounting which loads are ready to bill"],["Anytime","Answer calls from Dispatch and Safety"]]}]}]},{"t":"Weight limits","s":[{"k":"WEIGHT LIMITS","h":"Truck weight — when a load is too heavy","b":[{"t":"h","x":"80,000 lbs"},{"t":"p","x":"Maximum gross weight on the Interstate: truck + trailer + cargo + fuel + driver."},{"t":"h","x":"12,000 lbs"},{"t":"p","x":"Steer axle (front) — as given in the course material."},{"t":"h","x":"34,000 lbs"},{"t":"p","x":"Drive axles. The trailer tandem also takes 34,000 lbs."},{"t":"h","x":"If any weight is over the limit"},{"t":"lines","x":["The driver slides the trailer tandems to move weight between axles.","If that does not fix it, the driver goes back to the shipper to rework the load.","A CAT scale ticket proves the weight — keep it with the load documents."]}]}]},{"t":"Teamwork","s":[{"k":"TEAMWORK","h":"Who the updater works with","b":[{"t":"h","x":"Dispatch"},{"t":"p","x":"Report any change or incident: delays, route changes, problems on the road."},{"t":"h","x":"Accounting"},{"t":"p","x":"Make sure completed loads have correct dates, times and charges (detention, layover, TONU) and all documents: BOL, POD, lumper, fuel and toll receipts."},{"t":"h","x":"Safety"},{"t":"p","x":"Report accidents, breakdowns and violations. Flag red flags such as DOT issues."},{"t":"h","x":"Fleet"},{"t":"p","x":"Update truck and trailer status: in use, empty, at yard, in repair. Report breakdowns, reefer temps and ELD problems."}]}]},{"t":"Scenarios & the golden rule","s":[{"k":"SCENARIO","h":"The driver is stuck in traffic. What do you do?","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"p","x":"Waits until the broker asks for an update."},{"t":"p","x":"Broker hears about the delay too late → loses trust → may not give the next load."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"p","x":"Tells the broker immediately with a new ETA."},{"t":"quote","x":"“Driver delayed due to traffic. New ETA 15:30.” Early communication prevents problems."}]},{"k":"SCENARIO","h":"A broker calls asking for an update. What do you say?","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"quote","x":"“I don’t know. I’ll check with the driver.”"},{"t":"p","x":"Sounds unprepared. The broker loses confidence in the company."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"quote","x":"“Driver loaded at 11:00. Current location Columbus, OH. ETA to delivery 16:30.”"},{"t":"p","x":"Prepared answers build broker confidence."}]},{"k":"WHAT GOES WRONG","h":"Common problems and beginner mistakes","b":[{"t":"h","x":"Typical problems"},{"t":"lines","x":["Driver not answering the phone","Driver forgot to report loading","Driver delayed by traffic","Driver lost at the facility"]},{"t":"h","x":"Beginner mistakes"},{"t":"lines","x":["Sending updates only when the broker asks","Forgetting pickup confirmation","Wrong ETA calculation","Late updates"]},{"t":"p","x":"Driver not answering? Call again → send a message → check GPS/ELD → tell the dispatcher."}]},{"k":"THE GOLDEN RULE OF UPDATING","h":"UPDATE BEFORE THEY ASK.","b":[{"t":"p","x":"Early, clear updates make the company look reliable and organized."}]}]},{"t":"Interview questions","s":[{"k":"INTERVIEW QUESTIONS (1/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q1"},{"t":"h","x":"What is ETA?"},{"t":"quote","x":"“Estimated Time of Arrival — when the truck will arrive. For example, 200 miles left at 50 mph is 4 hours, so at 10:00 AM the ETA is 2:00 PM.”"},{"t":"h","x":"Q2"},{"t":"h","x":"Why are updates important?"},{"t":"quote","x":"“Brokers and customers plan around our truck. Updates show where the truck is and build trust. Without updates, brokers stop giving us loads.”"},{"t":"h","x":"Q3"},{"t":"h","x":"What should you do if a driver is delayed?"},{"t":"quote","x":"“I tell the broker immediately with the reason and a new ETA, inform dispatch, and keep updating until the truck arrives.”"}]},{"k":"INTERVIEW QUESTIONS (2/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q4"},{"t":"h","x":"How often should updates be sent?"},{"t":"quote","x":"“At every status change — arrived, loaded, delivered — and every few hours in transit, or as often as the broker asks.”"},{"t":"h","x":"Q5"},{"t":"h","x":"What information must be in an update?"},{"t":"quote","x":"“Driver location, load status, ETA, and any delays or problems.”"},{"t":"h","x":"Q6"},{"t":"h","x":"What do you send the broker after loading?"},{"t":"quote","x":"“Loaded time, seal number, BOL number, weight, commodity and the ETA to delivery.”"}]},{"k":"INTERVIEW QUESTIONS (3/3)","h":"Situation and personal questions","b":[{"t":"h","x":"Q7"},{"t":"h","x":"The driver is not answering. What do you do?"},{"t":"quote","x":"“I call again, send a message, check the truck on GPS/ELD, and tell the dispatcher if I still can’t reach the driver.”"},{"t":"h","x":"Q8"},{"t":"p","x":"When do you collect the POD and what do you do with it?"},{"t":"quote","x":"“Right after unloading. I check the signature, upload it, and tell Accounting the load is ready to bill.”"},{"t":"h","x":"Q9"},{"t":"h","x":"Why do you want to work as an updater?"},{"t":"quote","x":"“I’m organized and I like communication. The updater sees the whole load from pickup to delivery — a great start in US logistics.” [add your own reason]"}]}]},{"t":"Vocabulary & checklists","s":[{"k":"VOCABULARY","h":"Words to use in the interview","b":[{"t":"table","rows":[["Term","Meaning"],["ETA","Estimated Time of Arrival"],["TMS","System where loads are managed"],["ELD","Device that logs driving hours"],["GPS","Shows the truck’s location"],["Check-in / out","Arrival / departure time at a facility"],["Seal number","Number on the trailer door seal"],["BOL","Bill of Lading — cargo details"],["POD","Proof of Delivery — signed"],["Lumper receipt","Proof of paid unloading labor"]]},{"t":"table","rows":[["Term","Meaning"],["Detention","Paid waiting time (after 2 hours)"],["Layover","Overnight or day-long delay"],["TONU","Truck Ordered, Not Used"],["Live unload","Driver waits while trailer is unloaded"],["Drop & hook","Drop one trailer, take another"],["Reefer","Refrigerated trailer"],["CAT scale","Truck scale that gives a weight ticket"],["Gross weight","Total weight of truck + load"],["Proactive","Acting before someone asks"]]}]},{"k":"CHECKLISTS","h":"Two checklists to remember","b":[{"t":"h","x":"Before sending any update"},{"t":"h","x":"Driver location"},{"t":"h","x":"Pickup status"},{"t":"h","x":"Loading status"},{"t":"h","x":"Delivery ETA"},{"t":"h","x":"Any delays or problems"},{"t":"h","x":"Before your interview"},{"t":"h","x":"Say the load statuses in order"},{"t":"h","x":"Calculate an ETA in your head"},{"t":"h","x":"Write a delay message"},{"t":"h","x":"Answer Q1–Q9 out loud"},{"t":"h","x":"60-second “Tell me about yourself”"}]}]}]},"safety":{"intro":"SAFETY\nINTERVIEW PREP","ch":[{"t":"The role & daily tasks","s":[{"k":"THE ROLE","h":"What the safety department does","b":[{"t":"p","x":"Safety protects drivers, cargo and the company from legal and financial risks. Three main goals:"},{"t":"h","x":"Prevent accidents"},{"t":"p","x":"Monitor driver behavior, fatigue and equipment before something goes wrong."},{"t":"h","x":"Reduce violations"},{"t":"p","x":"Follow FMCSA rules: Hours of Service, inspections, driver qualifications."},{"t":"h","x":"Protect the company"},{"t":"p","x":"Avoid fines, high insurance costs and lost broker trust."},{"t":"tip","x":"Key idea: zero accidents, minimal violations and a strong safety culture."}]},{"k":"DAILY TASKS","h":"What safety specialists do","b":[{"t":"h","x":"Monitor HOS"},{"t":"p","x":"Check driver hours every day in the ELD system."},{"t":"h","x":"Review DOT inspections"},{"t":"p","x":"Read every roadside inspection report and record violations."},{"t":"h","x":"Track violations & CSA"},{"t":"p","x":"Watch the company’s CSA scores and fix problem areas."},{"t":"h","x":"Keep driver files"},{"t":"p","x":"Driver Qualification (DQ) files: CDL, medical card, records."},{"t":"h","x":"Investigate accidents"},{"t":"p","x":"Collect facts, report to insurance, find the cause."},{"t":"h","x":"Drug & alcohol tests"},{"t":"p","x":"Run the testing program and train drivers on safety rules."}]}]},{"t":"After a DOT inspection","s":[{"k":"WORKFLOW","h":"What happens after a DOT inspection","b":[{"t":"h","x":"Driver gets inspected"},{"t":"h","x":"Roadside"},{"t":"h","x":"Safety reviews the report"},{"t":"h","x":"Same day"},{"t":"h","x":"Violations recorded"},{"t":"h","x":"In the system"},{"t":"h","x":"Corrective action"},{"t":"h","x":"Coaching, training, repair"},{"t":"h","x":"Records updated"},{"t":"h","x":"Ready for audits"},{"t":"p","x":"Small violations today become a high CSA score tomorrow — never skip a report."}]}]},{"t":"Hours of Service & ELD monitoring","s":[{"k":"HOURS OF SERVICE","h":"HOS limits every safety specialist must know","b":[{"t":"h","x":"11 hours"},{"t":"h","x":"Driving limit"},{"t":"p","x":"Maximum driving after 10 hours off duty."},{"t":"h","x":"14 hours"},{"t":"h","x":"On-duty window"},{"t":"p","x":"No driving after the 14th hour on duty."},{"t":"h","x":"30 minutes"},{"t":"h","x":"Break"},{"t":"p","x":"Required after 8 hours of driving."},{"t":"h","x":"10 hours"},{"t":"h","x":"Off duty"},{"t":"p","x":"Off-duty time before a new shift."},{"t":"h","x":"60 / 70 hrs"},{"t":"h","x":"Weekly limit"},{"t":"p","x":"On duty in 7 or 8 days — then no driving."},{"t":"h","x":"34 hours"},{"t":"h","x":"Restart"},{"t":"p","x":"Off duty to reset the weekly limit."},{"t":"p","x":"Rules for property-carrying drivers · Source: FMCSA summary of Hours of Service regulations"}]},{"k":"ELD MONITORING","h":"Why safety checks ELD logs every day","b":[{"t":"h","x":"Catch violations early"},{"t":"p","x":"For example, driving over the 11-hour limit or missing the 30-minute break."},{"t":"h","x":"Prevent fatigued driving"},{"t":"p","x":"Tired drivers are a top cause of accidents."},{"t":"h","x":"Be ready for DOT audits"},{"t":"p","x":"Clean, complete logs pass audits."},{"t":"h","x":"Avoid penalties"},{"t":"p","x":"Violations can mean citations, fines or even a company shutdown."},{"t":"h","x":"COMMON HOS VIOLATIONS"},{"t":"h","x":"Driving beyond the 11 / 14-hour limits"},{"t":"h","x":"Missed 30-minute break"},{"t":"h","x":"Log falsification or ELD manipulation"},{"t":"h","x":"Driving over the 60 / 70-hour limit"}]}]},{"t":"DOT inspection levels","s":[{"k":"DOT INSPECTIONS","h":"The three main DOT inspection levels","b":[{"t":"h","x":"Level I"},{"t":"h","x":"Full inspection"},{"t":"p","x":"The most thorough. Driver: CDL, medical card, HOS logs, drug/alcohol status, seatbelt. Vehicle: brakes, tires, lights, suspension, coupling, cargo securement and more."},{"t":"h","x":"Level II"},{"t":"h","x":"Walk-around"},{"t":"p","x":"Inspector walks around the truck for visible defects and checks the driver’s documents. Usually no crawling under the truck."},{"t":"h","x":"Level III"},{"t":"h","x":"Driver-only"},{"t":"p","x":"Only the driver: CDL, endorsements, medical card, ELD logs, seatbelt, BOL and hazmat papers."},{"t":"p","x":"Inspections are done by FMCSA and state inspectors. Safety reviews every report — clean inspections help the CSA score."}]}]},{"t":"CSA & common violations","s":[{"k":"CSA SCORE","h":"CSA — how the government measures safety","b":[{"t":"p","x":"CSA = Compliance, Safety, Accountability. FMCSA groups violations into 7 categories called BASICs:"},{"t":"h","x":"Unsafe Driving"},{"t":"h","x":"Speeding, phone use"},{"t":"h","x":"HOS Compliance"},{"t":"h","x":"Hours of Service"},{"t":"h","x":"Driver Fitness"},{"t":"h","x":"CDL, medical card"},{"t":"h","x":"Drugs & Alcohol"},{"t":"h","x":"Controlled substances"},{"t":"h","x":"Vehicle Maintenance"},{"t":"h","x":"Brakes, tires, lights"},{"t":"h","x":"Hazmat Compliance"},{"t":"h","x":"Dangerous goods"},{"t":"h","x":"Crash Indicator"},{"t":"h","x":"Crash history"},{"t":"h","x":"High score = bad"},{"t":"p","x":"More inspections, higher insurance, brokers lose trust"}]},{"k":"VIOLATION ANALYSIS","h":"Common violations by category","b":[{"t":"table","rows":[["Category","Common violations"],["Hours of Service","Driving beyond 11 / 14-hour limits · missed 30-minute break · log falsification"],["Vehicle maintenance","Brake defects · tire problems (flat, low tread) · broken lights · missing safety equipment"],["Driver fitness","No valid CDL · expired medical card · suspended license"],["Drugs & alcohol","Positive test · refusal to test (counts as positive) · Clearinghouse violations"],["Unsafe driving","Speeding 15+ mph over · following too close · hand-held phone or texting"],["Hazardous materials","Missing placards · bad cargo securement · wrong shipping papers"]]}]}]},{"t":"Driver documents","s":[{"k":"DRIVER DOCUMENTS","h":"Documents a driver must have in the truck","b":[{"t":"h","x":"CDL"},{"t":"h","x":"Commercial Driver’s License"},{"t":"h","x":"DOT medical card"},{"t":"h","x":"Proves the driver is fit"},{"t":"h","x":"ELD logs"},{"t":"h","x":"Hours of Service records"},{"t":"h","x":"Proof of insurance"},{"t":"h","x":"Truck insurance papers"},{"t":"h","x":"Registration & lease"},{"t":"h","x":"Truck registration, lease agreement"},{"t":"h","x":"BOL"},{"t":"h","x":"Bill of Lading for the load"},{"t":"h","x":"IFTA license & decals"},{"t":"h","x":"Fuel tax sticker"},{"t":"h","x":"IRP cab card"},{"t":"h","x":"Apportioned registration"},{"t":"h","x":"Permit book"},{"t":"h","x":"Special permits"},{"t":"h","x":"Personal ID"},{"t":"h","x":"Driver identification"}]}]},{"t":"Drug tests & accidents","s":[{"k":"DRUG & ALCOHOL TESTING","h":"When drivers must be tested","b":[{"t":"h","x":"Pre-employment — before the first trip"},{"t":"h","x":"Random — drugs and alcohol, unannounced"},{"t":"h","x":"Post-accident — when FMCSA criteria are met"},{"t":"p","x":"Reasonable suspicion — signs of drug or alcohol use"},{"t":"h","x":"Return-to-duty and follow-up — after a violation"},{"t":"h","x":"RULES TO REMEMBER"},{"t":"h","x":"Refusing a test = a positive test"},{"t":"h","x":"Violations go to the Clearinghouse"},{"t":"p","x":"After an accident the driver cannot drive himself to the clinic"},{"t":"p","x":"Alcohol test within 2–8 hours, depending on the case"},{"t":"h","x":"Keep chain-of-custody forms ready"}]},{"k":"ACCIDENT MANAGEMENT","h":"What safety does after an accident","b":[{"t":"h","x":"Collect information"},{"t":"h","x":"Time, place, photos"},{"t":"h","x":"Contact the driver"},{"t":"h","x":"Calm instructions"},{"t":"h","x":"Document it"},{"t":"h","x":"Accident report"},{"t":"h","x":"Report to insurance"},{"t":"h","x":"Same day"},{"t":"h","x":"Find the cause"},{"t":"h","x":"Prevent it again"},{"t":"p","x":"Driver at the scene: warning triangles and flashers → call 911 if needed → tell dispatch and safety → photos and witness info. Keep accident records for 3 years."}]},{"k":"POST-ACCIDENT TESTING","h":"When a post-accident drug & alcohol test is required","b":[{"t":"h","x":"Fatality"},{"t":"p","x":"Someone died — always test the driver."},{"t":"h","x":"Injury + citation"},{"t":"p","x":"Someone needed medical treatment and the driver got a ticket."},{"t":"h","x":"Tow + citation"},{"t":"p","x":"A vehicle was towed away and the driver got a ticket."},{"t":"h","x":"Root cause analysis after an accident"},{"t":"lines","x":["Find the cause: driver error, equipment, weather or another party.","Fix it: retraining, maintenance, route changes, safety meeting.","Update policies so it does not happen again."]}]}]},{"t":"FMCSA audits","s":[{"k":"FMCSA AUDITS","h":"Audits — and what FMCSA checks","b":[{"t":"h","x":"New entrant audit"},{"t":"p","x":"Within 12 months of starting operations."},{"t":"h","x":"Compliance review"},{"t":"p","x":"After crashes, high CSA scores, or random selection."},{"t":"h","x":"Focused audit"},{"t":"p","x":"One area only, like HOS or drug testing."},{"t":"h","x":"DQ files"},{"t":"h","x":"Driver qualification files"},{"t":"h","x":"HOS & maintenance"},{"t":"h","x":"Logs, inspections, repairs"},{"t":"h","x":"Drug & alcohol, accidents, insurance"},{"t":"h","x":"Testing program, accident register, records"}]}]},{"t":"Mistakes, a scenario & the golden rule","s":[{"k":"WHAT GOES WRONG","h":"Common problems and beginner mistakes","b":[{"t":"h","x":"Typical safety problems"},{"t":"lines","x":["Driver exceeding HOS limits","Vehicle equipment violations","Improper cargo securement","Driver fatigue"]},{"t":"h","x":"Beginner mistakes"},{"t":"lines","x":["Ignoring small violations","Not reviewing inspection reports carefully","Poor communication with drivers"]},{"t":"p","x":"Even small safety issues can create large problems for the company."}]},{"k":"SCENARIO","h":"A minor inspection violation — what do you do?","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"p","x":"Ignores it and does not record it."},{"t":"p","x":"Violations add up → CSA score rises → more inspections and higher insurance."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"p","x":"Reviews it, documents it and educates the driver."},{"t":"p","x":"The driver learns, the record is complete, the same violation does not happen again."}]},{"k":"THE GOLDEN RULE OF SAFETY","h":"NO VIOLATION IS TOO SMALL.","b":[{"t":"p","x":"Record it, fix it, teach it — strong safety management protects the company and the drivers."}]}]},{"t":"Interview questions","s":[{"k":"INTERVIEW QUESTIONS (1/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q1"},{"t":"h","x":"What is HOS?"},{"t":"quote","x":"“Hours of Service — FMCSA rules that limit driving time to prevent fatigue: 11 hours driving, a 14-hour window, a 30-minute break after 8 hours, and 10 hours off.”"},{"t":"h","x":"Q2"},{"t":"h","x":"Why are DOT inspections important?"},{"t":"quote","x":"“They check that the driver and truck are safe and legal. Every violation affects our CSA score, so safety reviews every report.”"},{"t":"h","x":"Q3"},{"t":"h","x":"What is a CSA score?"},{"t":"quote","x":"“Compliance, Safety, Accountability — FMCSA’s system that measures how safe a carrier is. A high score means more inspections and higher insurance.”"}]},{"k":"INTERVIEW QUESTIONS (2/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q4"},{"t":"h","x":"Why does safety compliance matter?"},{"t":"quote","x":"“It prevents accidents and protects drivers. It also protects the company from fines, high insurance costs and losing brokers.”"},{"t":"h","x":"Q5"},{"t":"h","x":"A driver violates HOS. What do you do?"},{"t":"quote","x":"“I contact the driver and make sure he stops and rests legally, record the violation, coach him, and check with dispatch if the plan caused it.”"},{"t":"h","x":"Q6"},{"t":"h","x":"What are the DOT inspection levels?"},{"t":"quote","x":"“Level I is a full inspection of driver and truck, Level II is a walk-around, and Level III checks only the driver and documents.”"}]},{"k":"INTERVIEW QUESTIONS (3/3)","h":"Situation and personal questions","b":[{"t":"h","x":"Q7"},{"t":"h","x":"What do you do after an accident?"},{"t":"quote","x":"“Make sure everyone is safe, collect the facts and photos, document everything, report to insurance the same day, arrange testing if required, and find the cause.”"},{"t":"h","x":"Q8"},{"t":"h","x":"When is a post-accident drug test required?"},{"t":"quote","x":"“After a fatality, or when there is an injury or a towed vehicle and the driver got a citation.”"},{"t":"h","x":"Q9"},{"t":"h","x":"Why do you want to work in safety?"},{"t":"quote","x":"“I am careful with details and rules, and I want to protect drivers and the company. Safety is a key part of every trucking company.” [add your own reason]"}]}]},{"t":"Vocabulary & checklists","s":[{"k":"VOCABULARY","h":"Words to use in the interview","b":[{"t":"table","rows":[["Term","Meaning"],["HOS","Hours of Service — driving limits"],["ELD","Electronic Logging Device"],["FMCSA","Federal truck safety agency"],["DOT","Department of Transportation"],["CSA","Compliance, Safety, Accountability"],["BASICs","The 7 CSA categories"],["DQ file","Driver Qualification file"],["DVIR","Driver Vehicle Inspection Report"],["Out of service","Not allowed to drive until fixed"]]},{"t":"table","rows":[["Term","Meaning"],["Clearinghouse","Database of drug & alcohol violations"],["PSP","Driver crash & inspection history"],["MVR","Motor Vehicle Record"],["Level I","Full DOT inspection"],["Citation","Ticket from the police or inspector"],["Accident register","Record of crashes, kept 3 years"],["Cargo securement","Tying down freight correctly"],["Fatigue","Being too tired to drive safely"],["Corrective action","Steps to fix a problem"]]}]},{"k":"CHECKLISTS","h":"Two checklists to remember","b":[{"t":"h","x":"Before closing any safety review"},{"t":"h","x":"Inspection reports reviewed"},{"t":"h","x":"Violations recorded"},{"t":"h","x":"Driver notified"},{"t":"h","x":"Safety documentation updated"},{"t":"h","x":"Corrective actions completed"},{"t":"h","x":"Before your interview"},{"t":"h","x":"Say the 6 HOS numbers from memory"},{"t":"h","x":"Explain inspection Levels I–III"},{"t":"h","x":"Name the CSA categories"},{"t":"h","x":"Answer Q1–Q9 out loud"},{"t":"h","x":"60-second “Tell me about yourself”"}]}]}]},"fleet":{"intro":"FLEET\nINTERVIEW PREP","ch":[{"t":"The role & daily tasks","s":[{"k":"THE ROLE","h":"What fleet management does","b":[{"t":"p","x":"Fleet maintains trucks, trailers and equipment so they run safely and efficiently. Three main goals:"},{"t":"h","x":"Keep trucks running"},{"t":"p","x":"Trucks are operational, inspected and ready for loads."},{"t":"h","x":"Plan maintenance"},{"t":"p","x":"Oil changes, brakes, tires and repairs happen on schedule."},{"t":"h","x":"Fix breakdowns fast"},{"t":"p","x":"React quickly so downtime is short and loads are not lost."},{"t":"tip","x":"Key idea: if trucks are not maintained, loads are delayed and the company loses money."}]},{"k":"DAILY TASKS","h":"What fleet specialists do","b":[{"t":"h","x":"Monitor truck condition"},{"t":"p","x":"Follow reports from drivers and inspections."},{"t":"h","x":"Schedule preventive maintenance"},{"t":"p","x":"Oil, brakes, tires, engine checks — before problems start."},{"t":"h","x":"Handle breakdowns"},{"t":"p","x":"Find help fast and get the truck back on the road."},{"t":"h","x":"Work with repair shops"},{"t":"p","x":"Get quotes, approve repairs, track progress."},{"t":"h","x":"Track equipment"},{"t":"p","x":"Trucks, trailers, GPS and ELD devices; registrations and permits."},{"t":"h","x":"Monitor fuel"},{"t":"p","x":"Fuel use, fuel cards and wasteful driving."}]}]},{"t":"Workflow & preventive maintenance","s":[{"k":"WORKFLOW","h":"From a problem to back in service","b":[{"t":"h","x":"Driver reports an issue"},{"t":"h","x":"Call, message, DVIR"},{"t":"h","x":"Fleet evaluates"},{"t":"h","x":"How serious? Safe to drive?"},{"t":"h","x":"Contact repair shop"},{"t":"h","x":"Nearest, approved"},{"t":"h","x":"Truck is repaired"},{"t":"h","x":"Track time & cost"},{"t":"h","x":"Back in service"},{"t":"h","x":"Dispatch informed"},{"t":"p","x":"Fleet works closely with dispatch and drivers — every hour a truck is down, it is not earning money."}]},{"k":"PREVENTIVE MAINTENANCE","h":"Fix it before it breaks","b":[{"t":"h","x":"Oil changes"},{"t":"p","x":"Regular oil and filter service keeps the engine healthy."},{"t":"h","x":"Brakes & tires"},{"t":"p","x":"Brake inspections and tire checks prevent the most common failures."},{"t":"h","x":"Engine diagnostics"},{"t":"p","x":"Find small problems before they become big repairs."},{"t":"h","x":"Why it matters"},{"t":"lines","x":["Prevents major breakdowns and makes trucks last longer.","Preventive maintenance is always cheaper than major repairs.","Fleet measures: maintenance cost per mile · fuel consumption · equipment downtime."]}]}]},{"t":"Pre-trip inspection","s":[{"k":"PRE-TRIP INSPECTION","h":"What the driver checks before driving","b":[{"t":"h","x":"Lights & reflectors"},{"t":"p","x":"Headlights, turn signals, brake and clearance lights"},{"t":"h","x":"Brakes"},{"t":"p","x":"Air pressure, brake chambers, hoses, slack adjusters"},{"t":"h","x":"Steering"},{"t":"h","x":"Steering wheel play, power steering fluid, hoses"},{"t":"h","x":"Suspension"},{"t":"h","x":"Leaf springs, shocks, airbags"},{"t":"h","x":"Tires & wheels"},{"t":"h","x":"Tread depth, inflation, condition, lug nuts"},{"t":"h","x":"Coupling"},{"t":"h","x":"Fifth wheel, kingpin, locking jaws, air lines"},{"t":"h","x":"Emergency equipment"},{"t":"p","x":"Fire extinguisher, reflective triangles, spare fuses"},{"t":"h","x":"Post-trip: DVIR"},{"t":"h","x":"Driver writes a DVIR when defects are found"}]}]},{"t":"Breakdowns","s":[{"k":"BREAKDOWNS","h":"What causes most truck breakdowns","b":[{"t":"h","x":"≈ 50%"},{"t":"p","x":"of roadside breakdowns are tire-related: under/over-inflation, worn tread, blowouts."},{"t":"h","x":"30–35%"},{"t":"p","x":"are electrical and brake problems: dead batteries, alternators, air leaks, worn brakes."},{"t":"h","x":"The rest"},{"t":"p","x":"cooling, engine, fuel system and transmission problems."},{"t":"h","x":"What this means for fleet"},{"t":"lines","x":["Check tires and brakes most often — that prevents most breakdowns.","Watch warning signs: strange noises, low air pressure, coolant or oil leaks."]}]},{"k":"BREAKDOWN MANAGEMENT","h":"A truck broke down — what fleet does","b":[{"t":"h","x":"Driver reports the breakdown"},{"t":"p","x":"Make sure the driver is safe first."},{"t":"h","x":"Collect location and problem details"},{"t":"p","x":"Where exactly? What happened? Photos, warning lights."},{"t":"h","x":"Find a nearby repair shop or roadside service"},{"t":"p","x":"Choose a shop that can fix it fast."},{"t":"h","x":"Schedule the repair"},{"t":"p","x":"Approve the work, track time and cost."},{"t":"h","x":"Dispatcher adjusts the delivery plan"},{"t":"p","x":"Tell the broker, reschedule or move the load."},{"t":"h","x":"INFO TO GIVE THE REPAIR SHOP"},{"t":"h","x":"Driver name and phone"},{"t":"h","x":"Truck number (plate)"},{"t":"h","x":"Trailer number"},{"t":"h","x":"Exact location"},{"t":"h","x":"What is wrong"}]},{"k":"FINDING HELP","h":"Where fleet finds a tow truck or repair shop","b":[{"t":"h","x":"Tow411"},{"t":"p","x":"Online tow truck directory."},{"t":"h","x":"Google Maps"},{"t":"p","x":"Search “tow truck near me” or “truck repair near me”."},{"t":"h","x":"Trucker Path"},{"t":"p","x":"Truck stop and service app."},{"t":"h","x":"Pilot Flying J"},{"t":"p","x":"Truck stop network with services."},{"t":"h","x":"Love’s Connect"},{"t":"p","x":"Love’s truck stop app."},{"t":"h","x":"Roadside assistance"},{"t":"p","x":"Preferred vendor list or a roadside number (e.g. TA, Penske, FleetNet)."},{"t":"p","x":"Delays in response increase downtime and costs — keep a list of trusted shops ready."}]}]},{"t":"Equipment tracking & fuel","s":[{"k":"EQUIPMENT TRACKING","h":"Fleet knows where every piece of equipment is","b":[{"t":"p","x":"Top row: what fleet tracks. Bottom row: the four equipment statuses used in the system."},{"t":"h","x":"Trucks"},{"t":"h","x":"Assigned or available?"},{"t":"h","x":"Trailers"},{"t":"h","x":"Location and condition"},{"t":"h","x":"GPS devices"},{"t":"h","x":"Working and reporting?"},{"t":"h","x":"ELD systems"},{"t":"h","x":"Logging correctly?"},{"t":"h","x":"In use"},{"t":"h","x":"On a load"},{"t":"h","x":"Empty"},{"t":"h","x":"Ready for a load"},{"t":"h","x":"At yard"},{"t":"h","x":"Parked at the yard"},{"t":"h","x":"In repair"},{"t":"h","x":"At the shop"}]},{"k":"FUEL MANAGEMENT","h":"Fuel — one of the biggest costs in trucking","b":[{"t":"h","x":"Fuel use"},{"t":"p","x":"Monitor fuel consumption for every truck."},{"t":"h","x":"Fuel cards"},{"t":"p","x":"Check fuel card use — right truck, right amount."},{"t":"h","x":"Driving habits"},{"t":"p","x":"Spot wasteful driving patterns and coach drivers."},{"t":"h","x":"IFTA — fuel tax"},{"t":"lines","x":["IFTA lets carriers report fuel tax for all states with one license, through their base state.","Fuel and miles are reported by state every quarter; every truck needs an IFTA sticker."]}]}]},{"t":"Mistakes, a scenario & the golden rule","s":[{"k":"WHAT GOES WRONG","h":"Common problems and beginner mistakes","b":[{"t":"h","x":"Common fleet problems"},{"t":"lines","x":["Engine failure","Tire damage","Brake problems","Trailer defects"]},{"t":"h","x":"Beginner mistakes"},{"t":"lines","x":["Ignoring early warning signs","Delaying maintenance","Poor communication with drivers"]},{"t":"p","x":"Preventive maintenance is always cheaper than major repairs."}]},{"k":"SCENARIO","h":"The driver reports an unusual engine noise","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"p","x":"Tells the driver to keep driving."},{"t":"p","x":"The engine fails on the highway → expensive repair, lost load, angry broker."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"p","x":"Stops the truck and schedules an inspection."},{"t":"p","x":"A small problem is fixed early — engine failure prevented."}]},{"k":"THE GOLDEN RULE OF FLEET","h":"FIX IT BEFORE IT BREAKS.","b":[{"t":"p","x":"Good fleet management keeps trucks running safely and efficiently."}]}]},{"t":"Interview questions","s":[{"k":"INTERVIEW QUESTIONS (1/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q1"},{"t":"h","x":"What is fleet management?"},{"t":"quote","x":"“Taking care of trucks, trailers and equipment — maintenance, repairs, tracking and fuel — so they are safe and earning money.”"},{"t":"h","x":"Q2"},{"t":"h","x":"Why is preventive maintenance important?"},{"t":"quote","x":"“It fixes small problems before they become breakdowns. It is always cheaper than major repairs and keeps trucks on the road.”"},{"t":"h","x":"Q3"},{"t":"h","x":"What do you do if a truck breaks down?"},{"t":"quote","x":"“Make sure the driver is safe, get the location and problem details, find a nearby shop, schedule the repair, and tell dispatch.”"}]},{"k":"INTERVIEW QUESTIONS (2/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q4"},{"t":"h","x":"Why is fuel management important?"},{"t":"quote","x":"“Fuel is one of the biggest costs. Watching fuel use, fuel cards and driving habits saves the company a lot of money.”"},{"t":"h","x":"Q5"},{"t":"h","x":"What is a DVIR?"},{"t":"quote","x":"“Driver Vehicle Inspection Report. The driver writes it when he finds a defect, and fleet must fix it before the truck goes out again.”"},{"t":"h","x":"Q6"},{"t":"h","x":"What causes most breakdowns?"},{"t":"quote","x":"“Tires — about half of roadside breakdowns. Electrical and brake problems are next. So we check tires and brakes most often.”"}]},{"k":"INTERVIEW QUESTIONS (3/3)","h":"Situation and personal questions","b":[{"t":"h","x":"Q7"},{"t":"p","x":"A driver hears a strange engine noise. What do you do?"},{"t":"quote","x":"“I tell him to stop safely and schedule an inspection right away. Driving on could destroy the engine.”"},{"t":"h","x":"Q8"},{"t":"h","x":"What information do you give a repair shop?"},{"t":"quote","x":"“Driver name and phone, truck and trailer numbers, exact location, and a clear description of the problem.”"},{"t":"h","x":"Q9"},{"t":"h","x":"Why do you want to work in fleet?"},{"t":"quote","x":"“I like solving technical problems and planning ahead. Fleet keeps the whole company moving.” [add your own reason]"}]}]},{"t":"Vocabulary & checklists","s":[{"k":"VOCABULARY","h":"Words to use in the interview","b":[{"t":"table","rows":[["Term","Meaning"],["PM","Preventive maintenance"],["DVIR","Driver Vehicle Inspection Report"],["Pre-trip","Inspection before driving"],["Downtime","Time a truck can’t work"],["Roadside assistance","Help on the road"],["Fifth wheel","Coupling plate on the truck"],["Kingpin","Pin on the trailer that locks in"],["Slack adjuster","Part that adjusts the brakes"],["Tread depth","How deep tire grooves are"]]},{"t":"table","rows":[["Term","Meaning"],["Fuel card","Card drivers use to buy fuel"],["IFTA","Fuel tax agreement (quarterly)"],["IRP","Registration for many states"],["ELD","Electronic Logging Device"],["GPS","Location tracking"],["Telematics","Data from the truck’s systems"],["Out of service","Not allowed to drive until fixed"],["Cost per mile","Cost divided by miles driven"],["Blowout","Sudden tire failure"]]}]},{"k":"CHECKLISTS","h":"Two checklists to remember","b":[{"t":"h","x":"Before a truck goes out"},{"t":"h","x":"Maintenance schedule updated"},{"t":"h","x":"No unresolved mechanical issues"},{"t":"h","x":"Equipment inspection completed"},{"t":"h","x":"Driver notified of any issues"},{"t":"h","x":"Before your interview"},{"t":"h","x":"Explain preventive maintenance"},{"t":"h","x":"Walk through a breakdown call"},{"t":"h","x":"Name the pre-trip check areas"},{"t":"h","x":"Answer Q1–Q9 out loud"},{"t":"h","x":"60-second “Tell me about yourself”"}]}]}]},"eld":{"intro":"ELD\nINTERVIEW PREP","ch":[{"t":"The device & the role","s":[{"k":"THE DEVICE","h":"What is an ELD?","b":[{"t":"h","x":"ELD device · ELD service training material"},{"t":"h","x":"Electronic Logging Device"},{"t":"p","x":"Records driving time automatically — no paper logs."},{"t":"h","x":"Connected to the engine"},{"t":"p","x":"The device plugs into the truck’s ECM (engine computer)."},{"t":"h","x":"Tablet or phone app"},{"t":"p","x":"The driver’s app connects to the device by Bluetooth."},{"t":"h","x":"Required by FMCSA"},{"t":"p","x":"Federal rules require ELDs to track Hours of Service."}]},{"k":"THE ROLE","h":"What an ELD specialist does","b":[{"t":"p","x":"ELD specialists support drivers and carriers with their electronic logs, usually in shifts, 24/7. Three main jobs:"},{"t":"h","x":"Answer requests"},{"t":"p","x":"Take driver calls and texts and solve log questions fast."},{"t":"h","x":"Check companies"},{"t":"p","x":"Review the logbooks of every company on your list for errors and violations."},{"t":"h","x":"Keep logs legal"},{"t":"p","x":"Make sure every log matches what the driver really did."},{"t":"tip","x":"Key idea: duty status must match activity — the log must show what really happened."}]}]},{"t":"An ELD specialist's shift","s":[{"k":"YOUR SHIFT","h":"An ELD specialist’s shift","b":[{"t":"h","x":"Take the shift"},{"t":"h","x":"From the previous specialist"},{"t":"h","x":"Answer requests"},{"t":"h","x":"Calls and texts first"},{"t":"h","x":"Check your companies"},{"t":"h","x":"When you are free"},{"t":"h","x":"Keep doing requests"},{"t":"h","x":"While checking"},{"t":"h","x":"Finish checking"},{"t":"h","x":"By end of shift"},{"t":"h","x":"Pass the shift"},{"t":"h","x":"To the next specialist"},{"t":"p","x":"Driver requests always come first — a driver waiting on the road cannot drive until his log is right."}]}]},{"t":"HOS numbers & duty statuses","s":[{"k":"HOURS OF SERVICE","h":"The HOS numbers you must know","b":[{"t":"h","x":"11 hours"},{"t":"h","x":"Driving limit"},{"t":"p","x":"Maximum driving after 10 hours off duty."},{"t":"h","x":"14 hours"},{"t":"h","x":"Shift (on-duty window)"},{"t":"p","x":"No driving after the 14th hour on duty."},{"t":"h","x":"30 minutes"},{"t":"h","x":"Break"},{"t":"p","x":"Required after 8 hours of driving."},{"t":"h","x":"10 hours"},{"t":"h","x":"New shift"},{"t":"p","x":"Off duty needed before a new shift."},{"t":"h","x":"70 hours"},{"t":"h","x":"Cycle"},{"t":"p","x":"Maximum on duty in 8 days."},{"t":"h","x":"34 hours"},{"t":"h","x":"New cycle (restart)"},{"t":"p","x":"Off duty needed to restart the 70-hour cycle."},{"t":"p","x":"Property-carrying drivers · FMCSA. After a new shift, the driver must do a pre-trip inspection (PTI) before driving."}]},{"k":"DUTY STATUSES","h":"The duty statuses in every ELD","b":[{"t":"p","x":"Top row: the 4 main statuses. Bottom row: special statuses and events."},{"t":"h","x":"Off Duty"},{"t":"h","x":"Driver is resting, not working"},{"t":"h","x":"Sleeper Berth"},{"t":"h","x":"Resting in the truck’s sleeper"},{"t":"h","x":"Driving"},{"t":"h","x":"Recorded automatically when the truck moves"},{"t":"h","x":"On Duty – Not Driving"},{"t":"h","x":"Working but not driving: fueling, loading, PTI"},{"t":"h","x":"Personal Conveyance (PC)"},{"t":"p","x":"Moving the truck off duty for personal reasons, e.g. to a safe place to rest"},{"t":"h","x":"Yard Move (YM)"},{"t":"p","x":"Moving the truck inside a yard — counts as on duty"},{"t":"h","x":"Minor events"},{"t":"p","x":"Certifications, login / logout, engine power up / shut down"},{"t":"h","x":"Intermediate logs"},{"t":"h","x":"Automatic location points while driving"}]}]},{"t":"The logbook & compliance rules","s":[{"k":"THE PLATFORM","h":"Reading a driver’s logbook","b":[{"t":"p","x":"ELD platform logbook (TruckX) · ELD service training material"},{"t":"h","x":"Driver and date"},{"t":"p","x":"Whose log and which day you are looking at."},{"t":"h","x":"The graph"},{"t":"p","x":"Four lines: Off, Sleeper, Driving, On duty — the day hour by hour."},{"t":"h","x":"Event list"},{"t":"p","x":"Each status with time, location, odometer and notes."},{"t":"h","x":"Hours available"},{"t":"p","x":"Time left to drive, in the shift and in the cycle."}]},{"k":"COMPLIANCE","h":"Other ELD rules to know","b":[{"t":"h","x":"Daily certification"},{"t":"p","x":"The driver certifies his log every day — that he checked it and it is true."},{"t":"h","x":"Status must match activity"},{"t":"p","x":"Every status must show what the driver really did. Fake logs are falsification — a serious violation."},{"t":"h","x":"Edits"},{"t":"p","x":"Edits fix real mistakes only. The original stays saved, a note explains why, and the driver must approve."},{"t":"h","x":"ELD malfunction"},{"t":"p","x":"The driver notes it, tells the carrier within 24 hours and keeps paper logs until it is fixed."},{"t":"h","x":"Unassigned driving"},{"t":"p","x":"Driving with no driver logged in must be checked and assigned to the right driver."},{"t":"h","x":"Roadside inspection"},{"t":"p","x":"The driver shows the log on screen or sends it to the officer (data transfer)."}]}]},{"t":"Handling driver requests","s":[{"k":"REQUEST WORKFLOW","h":"How to handle a driver request","b":[{"t":"h","x":"Answer fast"},{"t":"p","x":"Use the script, or text “Hello sir, okay, checking.”"},{"t":"h","x":"Multitask"},{"t":"p","x":"While talking, already open the driver’s logbook."},{"t":"h","x":"Understand and act fast"},{"t":"p","x":"Get the request and work on it right away."},{"t":"h","x":"Tell the driver it’s done"},{"t":"p","x":"By text, an update in the app, or a call."},{"t":"h","x":"Double-check and record"},{"t":"p","x":"Check the logbook again and type the request into the Google table."},{"t":"h","x":"EXAMPLE CALL (SCRIPT)"},{"t":"quote","x":"“Hey boss, how are you?” — “Going great, how can I help you?” — “I need a new shift.” — “Got it, I’ll check your log and text you.”"},{"t":"h","x":"Friendly"},{"t":"h","x":"Short"},{"t":"h","x":"Fast"}]},{"k":"COMMON REQUESTS","h":"Typical driver requests — and the right reaction","b":[{"t":"table","rows":[["Driver says","What the ELD specialist does"],["“I need a new shift.”","Check that he really had 10 hours off. If yes and the status is wrong, correct it with a note. If not, tell him how long is left."],["“Make me a 30-minute break.”","Check the log: if he really stopped 30 minutes, fix the status. If not, tell him to take the break now."],["“I just got pulled over.”","Stay calm, check his log is correct, help him show or send it to the officer."],["“My ELD isn’t working.”","Malfunction: note it, tell the carrier, and the driver uses paper logs until it is fixed."],["“How many hours do I have?”","Read drive, shift and cycle time left and tell him clearly."]]}]}]},{"t":"Scenarios & the golden rule","s":[{"k":"SCENARIO","h":"The driver asks for a 30-minute break he didn’t take","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"p","x":"Edits the log to show a break that never happened."},{"t":"p","x":"That is log falsification: out-of-service orders, fines, CSA points — for the driver and the company."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"p","x":"Checks the log and tells the driver honestly."},{"t":"quote","x":"“I see you drove 8 hours without a break. Please stop now for 30 minutes — then you can drive 3 more hours.”"}]},{"k":"SCENARIO","h":"The driver calls: “I just got pulled over”","b":[{"t":"who","x":"BAD SPECIALIST"},{"t":"p","x":"Panics or doesn’t answer."},{"t":"p","x":"The driver can’t show his logs → violation and maybe out of service."},{"t":"who","x":"GOOD SPECIALIST"},{"t":"p","x":"Answers right away and checks the log is correct."},{"t":"p","x":"Helps the driver show the log on screen or send it to the officer, then follows up after the inspection."}]},{"k":"THE GOLDEN RULE OF ELD","h":"THE LOG MUST MATCH REALITY.","b":[{"t":"p","x":"Be fast, be friendly — and keep every log legal."}]}]},{"t":"Interview questions","s":[{"k":"INTERVIEW QUESTIONS (1/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q1"},{"t":"h","x":"What is an ELD?"},{"t":"quote","x":"“An Electronic Logging Device. It connects to the truck’s engine and records driving time automatically. FMCSA requires it to track Hours of Service.”"},{"t":"h","x":"Q2"},{"t":"h","x":"What are the main HOS rules?"},{"t":"quote","x":"“11 hours driving, a 14-hour shift, a 30-minute break after 8 hours of driving, 10 hours off for a new shift, a 70-hour cycle and a 34-hour restart.”"},{"t":"h","x":"Q3"},{"t":"h","x":"What are the duty statuses?"},{"t":"quote","x":"“Off Duty, Sleeper Berth, Driving and On Duty – Not Driving. Special ones are Personal Conveyance and Yard Move.”"}]},{"k":"INTERVIEW QUESTIONS (2/3)","h":"Core questions — model answers","b":[{"t":"h","x":"Q4"},{"t":"h","x":"What is Personal Conveyance?"},{"t":"quote","x":"“Moving the truck off duty for personal reasons — for example, to a safe place to rest. It can’t be used to move a load for the company.”"},{"t":"h","x":"Q5"},{"t":"p","x":"What do you do when a driver asks for a new shift?"},{"t":"quote","x":"“I check his log. If he had 10 hours off and only the status is wrong, I correct it with a note. If not, I tell him how long he still needs.”"},{"t":"h","x":"Q6"},{"t":"h","x":"What does a driver do if the ELD stops working?"},{"t":"quote","x":"“He notes the malfunction, tells the carrier within 24 hours, and uses paper logs until the ELD is fixed.”"}]},{"k":"INTERVIEW QUESTIONS (3/3)","h":"Situation and personal questions","b":[{"t":"h","x":"Q7"},{"t":"p","x":"A driver calls while you are checking companies. What do you do?"},{"t":"quote","x":"“I answer right away — requests come first. I open his logbook while we talk, solve it, then go back to checking.”"},{"t":"h","x":"Q8"},{"t":"h","x":"A driver got pulled over. How do you help?"},{"t":"quote","x":"“I stay calm, check his log is correct, and help him show it on screen or send it to the officer.”"},{"t":"h","x":"Q9"},{"t":"h","x":"Why do you want to ch job boards, social media and referrals for good candidates."},{"t":"h","x":"Check them"},{"t":"p","x":"Verify documents and safety history before hiring."},{"t":"h","x":"Keep them"},{"t":"p","x":"Stay in touch so good drivers stay — and bring friends."},{"t":"tip","x":"Key idea: driver turnover in the US is very high (60–90% per year in the course material), so recruiting never stops."}]},{"k":"RECRUITING = SALES","h":"Recruiting works like a sales process","b":[{"t":"h","x":"The product: the company"},{"t":"p","x":"Competitive pay, benefits (fuel cards, bonuses, miles), reputation, culture and working conditions."},{"t":"h","x":"The clients: drivers"},{"t":"p","x":"They want fair treatment, clear communication, reliable equipment and good routes."},{"t":"h","x":"The offer"},{"t":"p","x":"Tailored to the driver: highlight pay and benefits, new equipment, consistent loads, flexible schedules."}]},{"k":"RECRUITMENT FUNNEL","h":"Moving a driver from first contact to hired","b":[{"t":"h","x":"Awareness"},{"t":"h","x":"Ads and outreach get attention"},{"t":"h","x":"Interest"},{"t":"h","x":"Explain the company’s benefits"},{"t":"h","x":"Consideration"},{"t":"h","x":"Answer questions, check credentials"},{"t":"h","x":"Conversion"},{"t":"h","x":"Driver accepts and onboards"},{"t":"h","x":"Retention"},{"t":"h","x":"Keep in touch, get referrals"},{"t":"p","x":"A satisfied driver is likely to refer others — that reduces future recruiting costs."}]}]},{"t":"Hiring workflow & driver types","s":[{"k":"HIRING WORKFLOW","h":"The hiring process step by step","b":[{"t":"h","x":"Recruiter finds candidate"},{"t":"h","x":"Job boards, referrals"},{"t":"h","x":"Interview"},{"t":"h","x":"Experience, equipment, record"},{"t":"h","x":"Documents & checks"},{"t":"h","x":"PSP, MVR, drug test"},{"t":"h","x":"Approved"},{"t":"h","x":"With Safety"},{"t":"h","x":"Onboarding"},{"t":"h","x":"Orientation, first load"},{"t":"p","x":"The recruiter collects documents, adds the driver to the CRM and works with Safety to check the background."}]},{"k":"WHO RECRUITERS HIRE","h":"Three types of drivers","b":[{"t":"h","x":"Company driver"},{"t":"p","x":"Has a CDL but no truck. Paid a fixed rate, for example $0.65 per mile or 30% of the gross. The company provides the truck and pays fuel and maintenance."},{"t":"h","x":"Lease operator"},{"t":"p","x":"Has a CDL, wants to become an owner-operator. Leases a truck from the company, pays weekly rent and all truck costs. Higher dispatch fee — around 18%."},{"t":"h","x":"Owner-operator"},{"t":"p","x":"Owns the truck, maybe has an own MC. Under the company’s MC pays a dispatch fee — market rate about 12%. Pays fuel and maintenance; company gives insurance and devices."},{"t":"p","x":"Pay numbers are examples from the course material — every company is different."}]}]},{"t":"Sources, documents & background checks","s":[{"k":"SOURCES","h":"Where recruiters find drivers","b":[{"t":"h","x":"Indeed"},{"t":"h","x":"Free or paid job posts"},{"t":"h","x":"Facebook"},{"t":"h","x":"Ads and free posts in driver groups"},{"t":"h","x":"Instagram"},{"t":"h","x":"Ads to get leads"},{"t":"h","x":"LinkedIn"},{"t":"h","x":"Professional profiles"},{"t":"h","x":"Referral program"},{"t":"h","x":"Drivers bring drivers for a bonus"},{"t":"h","x":"YouTube & influencers"},{"t":"h","x":"Bloggers and brand ambassadors"},{"t":"h","x":"Driver job websites"},{"t":"h","x":"Paid subscriptions with leads"},{"t":"h","x":"Recruiting agencies"},{"t":"h","x":"Bring ready-to-go drivers"}]},{"k":"APPLICATION PACKAGE","h":"Documents a driver must give before hiring","b":[{"t":"h","x":"CDL"},{"t":"p","x":"Commercial Driver’s License — valid, right class and endorsements."},{"t":"h","x":"Medical card"},{"t":"p","x":"DOT medical certificate — not expired."},{"t":"h","x":"Application form"},{"t":"p","x":"The company’s driver application."},{"t":"h","x":"Employment history"},{"t":"p","x":"Previous jobs and driving experience."},{"t":"h","x":"Drug test results"},{"t":"p","x":"Pre-employment drug test."},{"t":"h","x":"Then: checks"},{"t":"p","x":"PSP, MVR and the drug & alcohol checks — next slide."}]},{"k":"BACKGROUND CHECKS","h":"The three checks before hiring","b":[{"t":"h","x":"PSP"},{"t":"h","x":"Pre-Employment Screening Program"},{"t":"p","x":"From FMCSA: crashes from the last 5 years and roadside inspections from the last 3 years. Drivers can order their own for about $10."},{"t":"h","x":"MVR"},{"t":"h","x":"Motor Vehicle Record"},{"t":"p","x":"Shows license status and traffic violations."},{"t":"h","x":"Test"},{"t":"h","x":"Drug & alcohol"},{"t":"p","x":"Pre-employment test — makes sure the driver follows safety rules."},{"t":"p","x":"A clean PSP helps drivers get better jobs; repeated violations hurt their chances."}]}]},{"t":"Interviewing a driver","s":[{"k":"DRIVER INTERVIEW","h":"Talking to a driver candidate","b":[{"t":"h","x":"Driving experience"},{"t":"h","x":"How many years? What kind of routes?"},{"t":"h","x":"Equipment type"},{"t":"h","x":"Dry van, reefer, flatbed, box truck?"},{"t":"h","x":"Accident history"},{"t":"h","x":"Any accidents or violations?"},{"t":"h","x":"HOS knowledge"},{"t":"h","x":"Does the driver know the Hours of Service rules?"},{"t":"h","x":"EXAMPLE OPENING"},{"t":"quote","x":"“Hello, my name is Alex from ABC Logistics. I saw your profile and wanted to ask about your driving experience.”"},{"t":"h","x":"Clear"},{"t":"h","x":"Friendly and professional"},{"t":"h","x":"Builds trust"}]}]},{"t":"Mistakes, a scenario, retention & the golden rule","s":[{"k":"WHAT GOES WRONG","h":"Common problems and beginner mistakes","b":[{"t":"h","x":"Common recruiting problems"},{"t":"lines","x":["Incomplete driver applications","Candidates with poor driving history","Drivers not answering calls","Candidates failing drug tests"]},{"t":"h","x":"Beginner mistakes"},{"t":"lines","x":["Hiring drivers too quickly","Not verifying documents","Ignoring safety history"]},{"t":"p","x":"Hiring the wrong driver can create safet
