  const u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||"";
  let h=`<h1>${t("hello")}${u?", "+esc(u):""}!</h1><button class="btn" style="margin-top:12px" onclick="go('lessons')">${t("start")}</button><div class="hint c" style="margin:8px 0 18px">${t("startn")}</div>`;
  h+=`<h2 style="margin-top:6px">${t("pick")}</h2><div class="hint" style="margin-bottom:12px">${t("pickh")}</div><div class="grid">`+POS.map(k=>{const on=S.picks.includes(k);return `<button class="pos ${on?'on':''}" onclick="togglePick('${k}')"><span class="ck">${on?'✓':''}</span><b>${pn(k)}</b><span class="d">${t("d")[k]}</span><span class="pr">${money(PRICES[k]||0)} ${t("cur")}</span></button>`}).join("")+`</div>`;
  h+=`<div style="display:flex;justify-content:space-between;margin:14px 0 0;font-size:14px" class="hint"><span>${t("picked")} <b style="color:#fff">${S.picks.length} / 3</b></span><button style="color:#FF6B6C;font-weight:800" onclick="S.picks=[];render()">${t("clear")}</button></div>`;
  h+=`<button class="btn ${S.picks.length?'':'off'}" ${S.picks.length?"":"disabled"} onclick="UI.sheet='save';render()">${t("save")}</button>`;
  if(S.stage>=1&&S.stage<5)h+=`<button class="btn g" onclick="UI.flow=1;render()">${t("cont")}</button>`;
  h+=`<h2 style="margin-top:22px">${t("rules")}</h2><div class="card" style="font-size:14px;line-height:1.6;color:#cfcfd6">• ${t("r1")}<br>• ${t("r2")}<br>• ${t("r3")}</div>`;
  return h}
function togglePick(k){if(S.stage>=5)return;const i=S.picks.indexOf(k);if(i>=0)S.picks.splice(i,1);else if(S.picks.length<3)S.picks.push(k);save();render()}
function confirmPicks(){if(S.stage<1)S.stage=1;save();api("/picks",{picks:S.picks});UI.sheet=null;UI.flow=1;render();scrollTo(0,0)}
function readiness(){const ks=S.picks.filter(k=>BOOKS[k]);return [ks.filter(k=>(S.tests[k]||{}).pass).length,ks.length]}
function flow(){const f=UI.flow;
  if(f===1){const [a,b]=readiness();return `<a class="back" onclick="go('home')">${t("bpos")}</a><h1>${t("price")}</h1><div class="hint">${t("chosen")}</div><div style="margin:10px 0 4px">${S.picks.map(k=>`<span class="chip">${pn(k)}</span>`).join("")}</div>
  <div class="tot"><small>${S.picks.length} ${t("totl")}</small><div>${priceHtml()}</div></div>
  <div class="card"><b style="font-size:14px">${t("inc")}</b><div class="li"><i>✓</i>${t("inc1")}</div><div class="li"><i>✓</i>${t("inc2")}</div><div class="li"><i>✓</i>${t("inc3")}</div></div>
  ${b?`<div class="card" style="background:#2a2412;border-color:#4a3d18;display:flex;gap:12px;align-items:center"><span style="font-size:22px">📘</span><div style="font-size:12px;line-height:1.4;flex:1"><b style="color:#F2B84B;font-size:13px">${t("ready")} ${a} / ${b}</b><br>${t("readyt")}</div><button style="color:#F2B84B;font-weight:800;font-size:13px" onclick="go('lessons')">${t("lessons")} ›</button></div>`:""}
  <button class="btn" onclick="UI.flow=2;render();scrollTo(0,0)">${t("cont")}</button>`}
  if(f===2)return `<a class="back" onclick="UI.flow=1;render()">${t("bprice")}</a><h1>${t("terms")}</h1><div class="card" style="font-size:14px;line-height:1.6;color:#cfcfd6">• ${t("t1")}<br>• ${t("t2")}<br>• ${t("t3")}<br>• ${t("t4")}</div><div class="hint" style="font-size:12px">${t("tn")}</div>
  <label class="chk"><input type="checkbox" ${UI.acc?"checked":""} onchange="UI.acc=this.checked;render()"><span>${t("tacc")}</span></label><button class="btn ${UI.acc?'':'off'}" ${UI.acc?"":"disabled"} onclick="UI.acc=false;UI.flow=3;render();scrollTo(0,0)">${t("tnext")}</button>`;
  if(f===3)return `<a class="back" onclick="UI.flow=2;render()">${t("bterms")}</a><h1>${t("contract")}</h1><div class="card"><div class="bk" style="margin:0;border:0;padding:0;background:none" ${OFFER_URL?`onclick="openUrl('${OFFER_URL}')"`:""}><span class="bi" style="width:40px;height:40px;font-size:11px;border-radius:8px">DOC</span><div><b>${t("cdoc")}</b><small>${t("cdocs")}</small></div><span class="gt">›</span></div><div class="hint" style="font-size:12px;margin-top:10px">${t("cdesc")}</div>${OFFER_URL?"":`<div class="hint" style="font-size:12px;margin-top:6px;color:#F2B84B">${t("offersoon")}</div>`}</div>
  <label class="chk"><input type="checkbox" ${UI.acc?"checked":""} onchange="UI.acc=this.checked;render()"><span>${t("cacc")}</span></label><button class="btn ${UI.acc?'':'off'}" ${UI.acc?"":"disabled"} onclick="acceptOffer()">${t("cnext")}</button>`;
  if(f===4)return `<a class="back" onclick="UI.flow=3;render()">${t("bcon")}</a><h1>${t("paytitle")}</h1><div class="card" style="display:flex;justify-content:space-between;font-size:14px"><span class="hint">${t("amount")}</span><b>${esc(priceTxt())}</b></div><div class="hint" style="margin:14px 0 10px;font-size:13px">${t("method")}</div>
  ${["Payme","Click","Uzum","Rahmat"].map(p=>`<button class="pm ${UI.pm===p?'on':''}" onclick="UI.pm='${p}';render()"><span class="lt"><img src="pay/${p.toLowerCase()}.svg" alt="${p}" onerror="this.replaceWith('${p[0]}')"></span><b>${p}</b><span class="r">${UI.pm===p?'✓':''}</span></button>`).join("")}
  <button class="btn" onclick="payWith()">${UI.pm} ${t("payvia")}</button><div class="hint c" style="font-size:11px;margin-top:8px">${t("paynote")}</div>`;
  if(f===5)return `<div class="c"><div class="bigc" style="background:#2a2412;color:#F2B84B">⏳</div><h1 style="font-size:22px">${t("pend")}</h1><div class="hint">${t("pendt")}</div><button class="btn g" onclick="checkPay()">${t("refresh")}</button></div>`;
  if(f===6)return `<div class="c"><div class="bigc okb">✓</div><h1 style="font-size:22px">${t("paid")}</h1><div class="hint">${t("paidt")}</div><button class="btn" onclick="go('me')">${t("paidb")}</button></div>`}
function acceptOffer(){api("/accept",{picks:S.picks,ts:Date.now()});UI.flow=4;render();scrollTo(0,0)}
async function payWith(){
  if(DEMO){UI.flow=5;render();setTimeout(()=>{S.stage=5;save();UI.flow=6;render()},1500);return}
  if(!PAYMENT_LIVE||!API_URL){api("/pay",{provider:UI.pm,picks:S.picks});alertx(t("paysoon"));return}
  const r=await api("/pay",{provider:UI.pm,picks:S.picks});if(r&&r.url){UI.flow=5;render();openUrl(r.url)}else alertx(t("paysoon"))}
async function checkPay(){const r=await api("/status",{});if(r&&r.paid){S.stage=5;save();UI.flow=6;render()}}
function meTab(){
  const sett=`<h2 style="font-size:14px;color:#cfcfd6">${t("sett")}</h2><div class="card"><button class="st" style="width:100%" onclick="UI.sheet='lang';render()"><span>${t("lang")}</span><span class="hint">${FL[S.lang][1]} ›</span></button></div>`;
  if(S.stage>=5){const row=(a,b,c)=>`<div class="st"><span>${a}</span><span class="tag ${c||''}">${b}</span></div>`;
    return `<h1>${t("me")}</h1><div class="card"><b style="font-size:13px">${t("steps")}</b>${row(t("sp"),t("spd"),"ok")}${row(t("scv"),t("scvd"),"am")}${row(t("scall"),t("scalld"),"am")}${row(t("sint"),t("sintd"))}</div>
    <h2 style="font-size:14px;color:#cfcfd6">${t("myint")}</h2>`+S.picks.map((k,i)=>`<div class="card" style="display:flex;gap:12px;align-items:center"><span class="n">${i+1}</span><div style="flex:1"><b style="font-size:14px">${pn(k)}</b><br><small class="hint">${t("wait")}</small></div><span class="tag">…</span></div>`).join("")+sett}
  const fk=[1,2,3].map(i=>`<div class="card" style="display:flex;gap:12px;align-items:center"><span class="n">${i}</span><div style="flex:1"><b style="font-size:14px">${t("nm")}</b><br><small class="hint">${t("nmp")}</small><div style="height:8px;background:#333;border-radius:4px;margin-top:8px"></div></div><span class="tag am">…</span></div>`).join("");
  return `<h1>${t("me")}</h1><h2 style="font-size:14px;color:#cfcfd6;margin-top:4px">${t("myint")}</h2><div class="blur">${fk}</div>${sett}
  <div class="lockcard"><div class="lkic">🔒</div><div class="lkt">${t("mylock")}</div><div class="lks">${t("mylocks")}</div><button class="btn lkb" onclick="${S.picks.length?"UI.flow=1;render()":"go('home')"}">${t("mygo")}</button></div>`}
function reels(){return `<div class="c" style="padding-top:80px"><div style="font-size:54px">🎬</div><h2>${t("reelst")}</h2></div>`}
function lessonsTab(){
  const v=UI.view;if(v){if(v.t==="ch")return chapters(v.k);if(v.t==="read")return reader();if(v.t==="test")return testView()}
  return `<h1>${t("ls")}</h1>`+POS.filter(k=>k!=="sales").map(k=>{const b=BOOKS[k];
    if(!b)return `<div class="bk" style="opacity:.55"><span class="bi" style="background:#333">${pn(k).slice(0,3)}</span><div><b>${pn(k)}</b></div><span class="tag">${t("soon")}</span></div>`;
    const dn=(S.done[k]||[]).length,tot=b.ch.length,ps=(S.tests[k]||{}).pass;
    return `<button class="bk" onclick="openBook('${k}')"><span class="bi">${pn(k).slice(0,3)}</span><div style="flex:1"><b>${pn(k)}</b><small>${dn}/${tot} ${t("ch")}</small><div class="bar" style="margin:6px 0 0;height:5px"><i style="width:${dn/tot*100}%;height:5px"></i></div></div>${ps?'<span class="tag ok">✓</span>':'<span class="gt">›</span>'}</button>`}).join("")}
function openBook(k){UI.view={t:"ch",k};render();scrollTo(0,0)}
function chapters(k){const b=BOOKS[k],dn=S.done[k]||[];
  let h=`<a class="back" onclick="UI.view=null;render()">← ${t("ls")}</a><h1>${pn(k)}</h1><div class="hint" style="margin-bottom:14px">${esc(b.intro)}</div>`;
  h+=b.ch.map((c,i)=>`<button class="bk" onclick="openCh('${k}',${i})"><span class="n">${i+1}</span><div style="flex:1"><b>${esc(c.t)}</b></div>${dn.includes(i)?'<span class="tag ok">✓</span>':'<span class="gt">›</span>'}</button>`).join("");
  h+=TESTS_ON&&TESTS[k]?`<button class="btn" onclick="startTest('${k}')">${t("test")}</button>`:`<div class="hint c" style="margin-top:14px">${t("testoff")}</div>`;return h}
function openCh(k,i){UI.view={t:"read",k,i};render();scrollTo(0,0)}
function blk(b){
  if(b.t==="table")return `<table>${b.rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table>`;
  if(b.t==="quote")return `<div class="qt">${esc(b.x)}</div>`;
  if(b.t==="tip")return `<div class="tip">💡 ${esc(b.x)}</div>`;
  if(b.t==="who")return `<div class="${/BAD/.test(b.x)?'bad':'good'}">${/BAD/.test(b.x)?"❌":"✅"} ${esc(b.x)}</div>`;
  if(b.t==="lines")return `<ul style="margin:6px 0;padding-left:20px;font-size:14px">${b.x.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
  if(b.t==="h")return `<div style="font-weight:800;margin-top:10px">${esc(b.x)}</div>`;
  return `<p style="margin:4px 0;font-size:14px;line-height:1.5;color:#cfcfd6">${esc(b.x)}</p>`}
function zoomImg(u){UI.zoom=u;render()}
function reader(){const {k,i}=UI.view,c=BOOKS[k].ch[i],n=BOOKS[k].ch.length;
  let h=`<a class="back" onclick="openBook('${k}')">← ${pn(k)}</a><div class="hint">${i+1} ${t("of")} ${n}</div><div class="bar" style="margin-bottom:12px"><i style="width:${(i+1)/n*100}%"></i></div><h1 style="font-size:22px">${esc(c.t)}</h1>`;
  c.n.forEach(x=>{h+=`<img class="sl" loading="lazy" alt="" onerror="this.outerHTML='<div class=card style=color:#F2B84B>⚠️ Slayd topilmadi. GitHub\'da <b>slides</b> papkasi yuklanganini tekshiring.</div>'" onclick="zoomImg(this.src)" src="slides/${k}/s-${String(x).padStart(2,'0')}.jpg">`});
  h+=`<button class="btn" onclick="finishCh('${k}',${i})">${i<n-1?t("nextc"):t("done")}</button>`;if(i>0)h+=`<button class="btn g" onclick="openCh('${k}',${i-1})">${t("prevc")}</button>`;return h}
function finishCh(k,i){const d=S.done[k]=S.done[k]||[];if(!d.includes(i))d.push(i);save();sync();if(i<BOOKS[k].ch.length-1)openCh(k,i+1);else openBook(k)}
function startTest(k){const tr=S.tests[k]||{};
  if(!DEMO&&tr.lock&&Date.now()<tr.lock){UI.view={t:"test",k,wait:tr.lock};render();return}
  UI.view={t:"test",k,qs:shuffle(TESTS[k]).map(q=>({q:q.q,c:q.a[0],o:shuffle(q.a)})),i:0,sc:0,pick:null};render();scrollTo(0,0)}
function testView(){const v=UI.view,k=v.k;
  if(v.wait)return `<a class="back" onclick="openBook('${k}')">← ${pn(k)}</a><div class="c"><div class="bigc" style="background:#2a2412">⏳</div><div class="hint">${t("waitr")}</div><b>${new Date(v.wait).toLocaleString()}</b></div>`;
  if(v.end){const ok=v.sc>=PASS_MIN;
    let h=`<div class="c"><div class="bigc ${ok?'okb':'nob'}">${ok?"✓":"✕"}</div><h1 style="font-size:24px">${ok?t("res"):t("fail")}</h1><div class="hint">${ok?t("resp"):t("need")+" "+PASS_MIN+" / 10"}</div><div class="sc" style="color:${ok?'#3DDC97':'#FF6B6C'};margin-top:10px">${v.sc}/10</div></div>`;
    if(ok){const nk=nextLesson(k);h+=nk?`<button class="btn" onclick="openBook('${nk}')">${t("nextles")}</button>`:`<div class="card c" style="margin-top:16px"><b>${t("allok")}</b><div class="hint" style="margin-top:4px">${t("allokt")}</div></div>`}
    else h+=`<button class="btn" onclick="startTest('${k}')">${t("retry")}</button>`;
    return h+`<button class="btn g" onclick="openBook('${k}')">${pn(k)}</button>`}
  const q=v.qs[v.i];
  return `<div class="hint">${t("q")} ${v.i+1} ${t("of")} 10</div><div class="bar"><i style="width:${v.i/10*100}%"></i></div><div class="qq">${esc(q.q)}</div>`+q.o.map((o,j)=>{let c="";if(v.pick!==null){if(o===q.c)c="ok";else if(j===v.pick)c="no"}return `<button class="o ${c}" ${v.pick!==null?"disabled":""} onclick="answer(${j})"><i></i>${esc(o)}</button>`}).join("")}
function answer(j){const v=UI.view,q=v.qs[v.i];v.pick=j;if(q.o[j]===q.c)v.sc++;render();
  setTimeout(()=>{if(UI.view!==v)return;v.pick=null;v.i++;if(v.i>=10)endTest();render()},900)}
function endTest(){const v=UI.view,k=v.k,ok=v.sc>=PASS_MIN;v.end=true;const tr=S.tests[k]=S.tests[k]||{};tr.score=v.sc;if(ok){tr.pass=true;tr.lock=0}else tr.lock=Date.now()+LOCK_H*3600e3;save();api("/result",{position:k,score:v.sc,pass:ok})}
function nextLesson(k){const ks=(S.picks.length?S.picks:POS).filter(x=>BOOKS[x]);const i=ks.indexOf(k);const rest=i>=0?ks.slice(i+1).concat(ks.slice(0,i)):ks;return rest.find(x=>!(S.tests[x]||{}).pass)||null}
if(API_URL)api("/quote",{picks:S.picks}).then(r=>{if(r&&r.text){QUOTE=r.text;render()}});
/* ===== Kuzatuv: dashboard uchun (vaqt, darslar, testlar, to'lov holati) ===== */
function sync(){if(DEMO)return;const tot={},ts={};Object.keys(BOOKS).forEach(k=>tot[k]=BOOKS[k].ch.length);
  Object.keys(S.tests).forEach(k=>{const v=S.tests[k];if(v&&typeof v.score==="number")ts[k]={score:v.score,pass:!!v.pass}});
  api("/sync",{picks:S.picks,done:S.done,totals:tot,tests:ts,lang:S.lang})}
function hb(){if(!DEMO&&document.visibilityState==="visible")api("/hb",{})}
if(API_URL&&!DEMO){sync();hb();setInterval(hb,30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")hb()});
  if(S.stage<5)api("/status",{}).then(r=>{if(r&&r.paid){S.stage=5;save();render()}})}
render();
</script></body></html>
