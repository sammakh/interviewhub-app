, and find the cause.”"]]],[[["p","Q8"]],[["h","When is a post-accident drug test required?"],["p","“After a fatality, or when there is an injury or a towed vehicle and the driver got a citation.”"]]],[[["p","Q9"]],[["h","Why do you want to work in safety?"],["p","“I am careful with details and rules, and I want to protect drivers and the company. Safety is a key part of every trucking company.” [add your own reason]"]]]]},"21":{"k":"VOCABULARY","t":"Words to use in the interview","r":[[[["table",[["Term","Meaning"],["HOS","Hours of Service — driving limits"],["ELD","Electronic Logging Device"],["FMCSA","Federal truck safety agency"],["DOT","Department of Transportation"],["CSA","Compliance, Safety, Accountability"],["BASICs","The 7 CSA categories"],["DQ file","Driver Qualification file"],["DVIR","Driver Vehicle Inspection Report"],["Out of service","Not allowed to drive until fixed"]]]],[["table",[["Term","Meaning"],["Clearinghouse","Database of drug & alcohol violations"],["PSP","Driver crash & inspection history"],["MVR","Motor Vehicle Record"],["Level I","Full DOT inspection"],["Citation","Ticket from the police or inspector"],["Accident register","Record of crashes, kept 3 years"],["Cargo securement","Tying down freight correctly"],["Fatigue","Being too tired to drive safely"],["Corrective action","Steps to fix a problem"]]]]]]},"22":{"k":"CHECKLISTS","t":"Two checklists to remember","r":[[[["h","Before closing any safety review"]],[["p","Inspection reports reviewed"],["p","Violations recorded"],["p","Driver notified"],["p","Safety documentation updated"],["p","Corrective actions completed"]],[["h","Before your interview"]],[["p","Say the 6 HOS numbers from memory"],["p","Explain inspection Levels I–III"],["p","Name the CSA categories"],["p","Answer Q1–Q9 out loud"],["p","60-second “Tell me about yourself”"]]]]},"23":{"k":"","t":"YOU ARE READY FOR THE INTERVIEW.","r":[[[["p","Prevent → Record → Correct. No violation is too small."]]],[[["h","Next in the series: Dispatch (box truck)"]]]]}},"update":{"2":{"k":"THE ROLE","t":"What the update department does","r":[[[["p","The updater manages the information about the shipment. Three main jobs:"]]],[[["h","Track"],["p","Know where every truck is — using GPS, ELD and calls to drivers."]],[["h","Update"],["p","Send clear status updates and ETAs to brokers and customers."]],[["h","Support"],["p","Keep Dispatch, Accounting, Safety and Fleet up to date."]]],[[["tip","Key idea: make sure everyone knows where the truck is and when it will arrive."]]]]},"3":{"k":"LOGISTICS CHAIN","t":"Where the updater sits","r":[[[["h","Shipper"],["note","Owns the cargo"]],[["h","Broker"],["note","Finds trucks"]],[["h","Carrier"],["note","Owns the truck"]],[["h","Dispatcher"],["note","Manages load & driver"]],[["h","Updater"],["note","Manages information"]],[["h","Driver"],["note","Moves the freight"]],[["h","Receiver"],["note","Gets the cargo"]]],[[["p","Dispatcher manages the load and the driver. Updater manages the information about the shipment."]]]]},"4":{"k":"LOAD STATUSES","t":"Types of updates — with example messages","r":[[[["p","Status order in the TMS: Dispatched → At shipper → Loaded → In transit → At receiver → Delivered → POD received"],["table",[["Status","Example message to the broker"],["Arrived at pickup","Driver arrived at pickup at 09:15 and is waiting for loading."],["Loaded","Driver loaded at 10:30 and departed the facility."],["In transit","Driver in transit. ETA 16:00."],["Arrived at delivery","Driver arrived at delivery at 14:50 and is waiting for unloading."],["Delivered","Load delivered at 16:30. POD will be sent shortly."]]]]],[[["p","Every update answers three questions: Where is the truck?  What is the status?  When will it arrive?"]]]]},"5":{"k":"WORKFLOW","t":"Pickup to delivery — what the updater does","r":[[[["h","1 · Load assigned"],["p","Check dispatch info: addresses, pickup and delivery times, reference numbers. Log it in the system."]],[["h","2 · Before pickup"],["p","Call the driver to confirm they are on the way. Tell the broker if the ETA changes. Record check-in at the shipper."]],[["h","3 · Pickup"],["p","Status: “At shipper – loading.” After loading, record check-out and send the broker the seal #, BOL #, weight and commodity."]]],[[["h","4 · In transit"],["p","Watch the truck on GPS/ELD or with check-in calls. Delay? Tell the broker immediately with a new ETA."]],[["h","5 · Delivery"],["p","Record check-in and check-out. Collect the POD from the driver: “Load delivered at [time], POD available.”"]],[["h","6 · After delivery"],["p","Upload BOL and POD. Tell Accounting the load is ready to bill (and about detention). Close the load with notes."]]]]},"6":{"k":"AT THE SHIPPER","t":"Photos the updater asks the driver for","r":[[[["h","Trailer at the dock"],["note","Proof the truck arrived and when."]],[["h","Loaded trailer"],["note","Shows how the freight was loaded."]],[["h","Seal picture"],["note","Seal number goes to the broker."]],[["h","Reefer temperature"],["note","Proves the correct temperature."]]]]},"7":{"k":"ETA","t":"How to calculate an ETA","r":[[[["stat","200"],["p","miles left"]],[["stat","÷"]],[["stat","50"],["p","mph average"]],[["stat","="]],[["stat","4"],["p","hours"]]],[[["h","ETA = Estimated Time of Arrival"],["stat","Now 10:00 AM + 4 hours = arrives 2:00 PM"],["p","Add time for fuel stops and required breaks. Brokers plan around your ETA — accuracy matters."]]]]},"8":{"k":"REAL BROKER RULES","t":"When a real rate confirmation asks for updates","r":[[[["stat","Pickup"],["p","Send a status update when the driver picks up the load."]],[["stat","Delivery"],["p","Send a status update when the load is delivered."]],[["stat","Late?"],["p","If a pickup or delivery appointment will be missed, tell the broker as soon as it is safe."]]],[[["h","Also in the same rate confirmation"],["p","Seals must stay intact for the whole trip.\nThe broker prefers updates through carrier dispatch, not from the driver.\nIf the driver calls the broker, never while driving."]]]]},"9":{"k":"TOOLS","t":"Tools the updater uses every day","r":[[[["note","Samsara fleet tracking (GPS/ELD) · updater handout"]],[["h","TMS"],["p","McLeod, Ascend, TruckMate — where load statuses are updated."],["h","GPS / ELD"],["p","Samsara and similar: live truck location and driver hours."],["h","Google Sheet"],["p","Many companies track loads on a shared sheet dashboard."],["h","Phone, SMS, email"],["p","Calls and messages with drivers, brokers and other departments."]]]]},"10":{"k":"DAILY ROUTINE","t":"A typical day for an updater","r":[[[["table",[["Time","Task"],["08:00","Check all active loads in the TMS"],["09:00","Call drivers and collect status updates"],["All day","Update statuses in the system in real time"],["10:00+","Upload documents from completed loads"],["After 14:00","Confirm delivered loads with PODs"],["15:00–17:00","Tell Accounting which loads are ready to bill"],["Anytime","Answer calls from Dispatch and Safety"]]]]]]},"11":{"k":"WEIGHT LIMITS","t":"Truck weight — when a load is too heavy","r":[[[["stat","80,000 lbs"],["p","Maximum gross weight on the Interstate: truck + trailer + cargo + fuel + driver."]],[["stat","12,000 lbs"],["p","Steer axle (front) — as given in the course material."]],[["stat","34,000 lbs"],["p","Drive axles. The trailer tandem also takes 34,000 lbs."]]],[[["h","If any weight is over the limit"],["p","The driver slides the trailer tandems to move weight between axles.\nIf that does not fix it, the driver goes back to the shipper to rework the load.\nA CAT scale ticket proves the weight — keep it with the load documents."]]]]},"12":{"k":"TEAMWORK","t":"Who the updater works with","r":[[[["h","Dispatch"],["p","Report any change or incident: delays, route changes, problems on the road."]],[["h","Accounting"],["p","Make sure completed loads have correct dates, times and charges (detention, layover, TONU) and all documents: BOL, POD, lumper, fuel and toll receipts."]]],[[["h","Safety"],["p","Report accidents, breakdowns and violations. Flag red flags such as DOT issues."]],[["h","Fleet"],["p","Update truck and trailer status: in use, empty, at yard, in repair. Report breakdowns, reefer temps and ELD problems."]]]]},"13":{"k":"SCENARIO","t":"The driver is stuck in traffic. What do you do?","r":[[[["stat","Waits until the broker asks for an update."]],[["lab","BAD SPECIALIST"]],[["stat","Tells the broker immediately with a new ETA."]],[["lab","GOOD SPECIALIST"]]],[[["p","Broker hears about the delay too late → loses trust → may not give the next load."]],[["p","“Driver delayed due to traffic. New ETA 15:30.” Early communication prevents problems."]]]]},"14":{"k":"SCENARIO","t":"A broker calls asking for an update. What do you say?","r":[[[["stat","“I don’t know. I’ll check with the driver.”"]],[["lab","BAD SPECIALIST"]],[["h","“Driver loaded at 11:00. Current location Columbus, OH. ETA to delivery 16:30.”"]],[["lab","GOOD SPECIALIST"]]],[[["p","Sounds unprepared. The broker loses confidence in the company."]],[["p","Prepared answers build broker confidence."]]]]},"15":{"k":"WHAT GOES WRONG","t":"Common problems and beginner mistakes","r":[[[["p","Driver not answering the phone\nDriver forgot to report loading\nDriver delayed by traffic\nDriver lost at the facility"]],[["h","Typical problems"]],[["p","Sending updates only when the broker asks\nForgetting pickup confirmation\nWrong ETA calculation\nLate updates"]],[["h","Beginner mistakes"]]],[[["p","Driver not answering? Call again → send a message → check GPS/ELD → tell the dispatcher."]]]]},"16":{"k":"","t":"UPDATE BEFORE THEY ASK.","r":[[[["h","THE GOLDEN RULE OF UPDATING"]]],[[["p","Early, clear updates make the company look reliable and organized."]]]]},"17":{"k":"INTERVIEW QUESTIONS (1/3)","t":"Core questions — model answers","r":[[[["p","Q1"]],[["h","What is ETA?"],["p","“Estimated Time of Arrival — when the truck will arrive. For example, 200 miles left at 50 mph is 4 hours, so at 10:00 AM the ETA is 2:00 PM.”"]]],[[["p","Q2"]],[["h","Why are updates important?"],["p","“Brokers and customers plan around our truck. Updates show where the truck is and build trust. Without updates, brokers stop giving us loads.”"]]],[[["p","Q3"]],[["h","What should you do if a driver is delayed?"],["p","“I tell the broker immediately with the reason and a new ETA, inform dispatch, and keep updating until the truck arrives.”"]]]]},"18":{"k":"INTERVIEW QUESTIONS (2/3)","t":"Core questions — model answers","r":[[[["p","Q4"]],[["h","How often should updates be sent?"],["p","“At every status change — arrived, loaded, delivered — and every few hours in transit, or as often as the broker asks.”"]]],[[["p","Q5"]],[["h","What information must be in an update?"],["p","“Driver location, load status, ETA, and any delays or problems.”"]]],[[["p","Q6"]],[["h","What do you send the broker after loading?"],["p","“Loaded time, seal number, BOL number, weight, commodity and the ETA to delivery.”"]]]]},"19":{"k":"INTERVIEW QUESTIONS (3/3)","t":"Situation and personal questions","r":[[[["p","Q7"]],[["h","The driver is not answering. What do you do?"],["p","“I call again, send a message, check the truck on GPS/ELD, and tell the dispatcher if I still can’t reach the driver.”"]]],[[["p","Q8"]],[["h","When do you collect the POD and what do you do with it?"],["p","“Right after unloading. I check the signature, upload it, and tell Accounting the load is ready to bill.”"]]],[[["p","Q9"]],[["h","Why do you want to work as an updater?"],["p","“I’m organized and I like communication. The updater sees the whole load from pickup to delivery — a great start in US logistics.” [add your own reason]"]]]]},"20":{"k":"VOCABULARY","t":"Words to use in the interview","r":[[[["table",[["Term","Meaning"],["ETA","Estimated Time of Arrival"],["TMS","System where loads are managed"],["ELD","Device that logs driving hours"],["GPS","Shows the truck’s location"],["Check-in / out","Arrival / departure time at   if(v.end){const ok=v.sc>=PASS_MIN;

    if(ok){const nk=nextLesson(k);h+=nk?`<button class="btn" onclick="openBook('${nk}')">${t("nextles")}</button>`:`<div class="card c" style="margin-top:16px"><b>${t("allok")}</b><div class="hint" style="margin-top:4px">${t("allokt")}</div></div>`}
    else h+=`<button class="btn" onclick="startTest('${k}')">${t("retry")}</button>`;
    return h+`<button class="btn g" onclick="openBook('${k}')">${pn(k)}</button>`}
  const q=v.qs[v.i];
  return `<div class="hint">${t("q")} ${v.i+1} ${t("of")} 10</div><div class="bar"><i style="width:${v.i/10*100}%"></i></div><div class="qq">${esc(q.q)}</div>`+q.o.map((o,j)=>{let c="";if(v.pick!==null){if(o===q.c)c="ok";else if(j===v.pick)c="no"}return `<button class="o ${c}" ${v.pick!==null?"disabled":""} onclick="answer(${j})"><i></i>${esc(o)}</button>`}).join("")}
function answer(j){const v=UI.view,q=v.qs[v.i];v.pick=j;if(q.o[j]===q.c)v.sc++;render();
  setTimeout(()=>{if(UI.view!==v)return;v.pick=null;v.i++;if(v.i>=10)endTest();render()},900)}
function endTest(){const v=UI.view,k=v.k,ok=v.sc>=PASS_MIN;v.end=true;const tr=S.tests[k]=S.tests[k]||{};tr.score=v.sc;if(ok){tr.pass=true;tr.lock=0}else tr.lock=Date.now()+LOCK_H*3600e3;save();api("/result",{position:k,score:v.sc,pass:ok})}
function nextLesson(k){const ks=(S.picks.length?S.picks:POS).filter(x=>BOOKS[x]);const i=ks.indexOf(k);const rest=i>=0?ks.slice(i+1).concat(ks.slice(0,i)):ks;return rest.find(x=>!(S.tests[x]||{}).pass)||null}
if(API_URL)api("/quote",{picks:S.picks}).then(r=>{if(r&&r.text){QUOTE=r.text;render()}});
/* ===== Kuzatuv: dashboard uchun (vaqt, darslar, testlar, to'lov holati) ===== */
function sync(){if(DEMO)return;const tot={},ts={};Object.keys(BOOKS).forEach(k=>tot[k]=BOOKS[k].ch.length);
  Object.keys(S.tests).forEach(k=>{const v=S.tests[k];if(v&&typeof v.score==="number")ts[k]={score:v.score,pass:!!v.pass}});
  api("/sync",{picks:S.picks,done:S.done,totals:tot,tests:ts,lang:S.lang})}
function hb(){if(!DEMO&&document.visibilityState==="visible")api("/hb",{})}
if(API_URL&&!DEMO&&tg&&tg.initData&&!sessionStorage.getItem("ihdiag")){try{sessionStorage.setItem("ihdiag","1")}catch(e){}
  __ihErr("boot-ok","diag",JSON.stringify({p:tg.platform,v:tg.version,coarse:matchMedia("(pointer:coarse)").matches,hover:matchMedia("(hover:none)").matches,w:innerWidth,h:innerHeight}))}
if(API_URL&&!DEMO){sync();hb();setInterval(hb,30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")hb()});
  if(S.stage<5)api("/status",{}).then(r=>{if(r&&r.paid){S.stage=5;save();render()}})}
render();
</script></body></html>
