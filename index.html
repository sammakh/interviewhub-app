<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

background:linear-gradient(160deg,rgba(207,54,55,.22),rgba(23,23,28,.45) 55%);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
border:1px solid rgba(255,255,255,.10);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(207,54,55,.25);animation:lkin .5s cubic-bezier(.2,.8,.2,1)}

/* ===== Dizayn qatlami ===== */
:root{--bg:#0B0B0F;--s1:#16161B;--s2:#1C1C23;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#F5F5F7;--mu:#9C9CA8;--br:#D23F40;--br2:#B83233;--brs:rgba(210,63,64,.14);--ok:#3DDC97;--r:18px;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:26px;letter-spacing:-.4px;line-height:1.2}h2{font-size:17px;letter-spacing:-.2px}
.hint{color:var(--mu)}
.top{box-shadow:0 6px 24px rgba(0,0,0,.25)}
/* kartochkalar */
.card,.tot,.bk,.pos,.pm,.lg,.o{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--ln);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.card,.tot{border-radius:var(--r)}
.bk,.pos,.pm,.lg,.o{transition:transform .15s var(--ease),border-color .2s,background .2s,box-shadow .2s}
.bk:active,.pos:active,.pm:active,.lg:active,.o:active,.btn:active,.chip:active{transform:scale(.97)}
.pos.on,.pm.on,.lg.on{background:linear-gradient(180deg,rgba(210,63,64,.20),rgba(210,63,64,.08));border-color:var(--br);box-shadow:0 0 0 3px var(--brs),0 8px 24px rgba(210,63,64,.18)}
/* tugmalar */
.btn{background:linear-gradient(135deg,#E14A4B,var(--br2));box-shadow:0 8px 22px rgba(210,63,64,.30),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s var(--ease),box-shadow .2s,opacity .2s;letter-spacing:.1px}
.btn.g{background:var(--s2);border:1px solid var(--ln2);box-shadow:none}
.btn[disabled],.btn.off{background:#24242B;color:#6E6E78;box-shadow:none}
.back{background:var(--s2);border-color:var(--ln2)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;margin:4px 0 22px;border:1px solid rgba(210,63,64,.35);
background:radial-gradient(120% 90% at 100% 0%,rgba(210,63,64,.45),transparent 60%),linear-gradient(160deg,#241416,#141418 70%)}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.10),transparent 70%)}
.hero h1{margin-bottom:6px}.hero .hint{font-size:13px;color:rgba(255,255,255,.7);max-width:300px}.hero .btn{margin-top:16px}
/* pozitsiyalar */
.grid{gap:12px}
.pos{border-radius:var(--r);padding:14px 12px 12px}
.pos b{padding-right:26px;line-height:1.25}
.pos .ck{transition:background .2s,border-color .2s,transform .2s var(--ease)}.pos.on .ck{transform:scale(1.08)}
.pos .pr{margin-top:10px;font-size:13px;color:var(--tx);opacity:.92}
/* darslar */
.bi{width:48px;height:48px;border-radius:14px;font-size:24px;background:linear-gradient(145deg,rgba(210,63,64,.35),rgba(210,63,64,.12));border:1px solid rgba(210,63,64,.35);box-shadow:none}
.bk{border-radius:var(--r);padding:12px 14px}.bk b{font-size:15px}
.bar{background:rgba(255,255,255,.08);overflow:hidden}.bar i{background:linear-gradient(90deg,#E14A4B,#FF7A6B);transition:width .4s var(--ease)}
.n{background:var(--brs);color:#FF7A6B}
/* testlar */
.o{border-radius:16px;padding:15px 14px}
.qq{letter-spacing:-.2px}
/* pastki menyu */
.nav{height:calc(68px + env(safe-area-inset-bottom));background:rgba(11,11,15,.78);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-top:1px solid var(--ln)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;font-size:11px;font-weight:600;color:var(--mu);transition:color .2s}
.nav .ni{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:99px;transition:background .25s var(--ease)}
.nav .ni em{position:absolute;top:-4px;right:6px;font-size:10px;font-style:normal}
.nav .a{color:#FF6B6C;font-weight:800}.nav .a .ni{background:var(--brs)}
/* boshqa */
.chip{background:var(--brs);border-color:rgba(210,63,64,.6)}
.tot div{letter-spacing:-.6px}
.sheet>div{background:var(--s1);border-top:1px solid var(--ln2)}
.pad.enter{animation:fadein .28s var(--ease)}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pad.enter{animation:none}.bk,.pos,.pm,.lg,.o,.btn{transition:none}}

/* ===== Kuchli qatlam ===== */
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(90% 40% at 50% 0%,rgba(210,63,64,.16),transparent 70%),radial-gradient(60% 30% at 100% 60%,rgba(210,63,64,.07),transparent 70%)}
.top{background:linear-gradient(135deg,#E04748 0%,#C23536 55%,#9E2829 100%);border-radius:0 0 22px 22px;padding-bottom:2px;overflow:hidden;box-shadow:0 10px 30px rgba(194,53,54,.35)}
.top:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 85% -20%,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.top .ih{box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pl{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)}
/* hero: aylanuvchi nurli chegara */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.hero{border:0;padding:22px 18px 18px;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;border-radius:24px;padding:1.5px;background:conic-gradient(from var(--a),rgba(255,107,108,.0),#FF6B6C,rgba(255,107,108,.0) 30%,rgba(255,255,255,.35) 50%,rgba(255,107,108,0) 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;z-index:-1}
@keyframes spin{to{--a:360deg}}
.hk{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#FF8A8B;background:rgba(210,63,64,.18);border:1px solid rgba(255,107,108,.3);padding:5px 10px;border-radius:99px;margin-bottom:12px}
.hero h1{font-size:30px;letter-spacing:-.8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(180deg,#fff,#FFB3B3);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:11px;color:rgba(255,255,255,.65);font-weight:600}
/* yaltiroq tugma */
.btn.shine{position:relative;overflow:hidden}
.btn.shine:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:lkshine 3.2s ease-in-out infinite}
/* sarlavhalar */
h2{display:flex;align-items:center;gap:8px}
h2:before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#FF6B6C,#B83233)}
/* pozitsiya kartochkalari */
.pos{padding:14px 12px 12px;overflow:hidden}
.pos .pi{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;font-size:20px;margin-bottom:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.pos.on .pi{background:rgba(210,63,64,.25);border-color:rgba(255,107,108,.4)}
.pos .pr{display:inline-block;margin-top:10px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.07);font-size:12px}
.pos.on .pr{background:rgba(210,63,64,.25);color:#FFB3B3}
.pos.on:after{content:"";position:absolute;inset:auto -20px -40px auto;width:110px;height:110px;border-radius:50%;background:radial-gradient(rgba(255,107,108,.35),transparent 70%);pointer-events:none}
/* suzuvchi kapsula menyu */
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:64px;padding:0 6px;border-radius:22px;border:1px solid rgba(255,255,255,.10);background:rgba(22,22,27,.72);box-shadow:0 12px 34px rgba(0,0,0,.5)}
.nav button{padding:6px 0}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.lockcard{bottom:calc(86px + env(safe-area-inset-bottom))}
/* ketma-ket paydo bo'lish */
.pad.enter .grid>*,.pad.enter .bk,.pad.enter .card,.pad.enter .pm{animation:rise .45s var(--ease) both}
.pad.enter .grid>*:nth-child(2),.pad.enter .bk:nth-of-type(2){animation-delay:.04s}
.pad.enter .grid>*:nth-child(3),.pad.enter .bk:nth-of-type(3){animation-delay:.08s}

 (stop 2)"],["p","Addresses and appointment times — compare with the BOL and POD."],["h","Payment: $4,200 total"],["p","$4,000 freight pay + $200 driver assist. This is the invoice amount."]]]]},"6":{"k":"REAL DOCUMENT","t":"The bill of lading (BOL) — the key fields","r":[[[["note","Standard BOL form · logistics glossary, p. 59"]],[["h","Ship from / ship to"],["p","Shipper and receiver (consignee) names and addresses."],["h","BOL number, carrier, trailer, seal"],["p","Plus the PRO number used to track the freight."],["h","Pieces, weight, commodity"],["p","Must match the rate confirmation (e.g. 16 pieces)."],["h","Signatures at pickup"],["p","Shipper and driver sign when the truck is loaded."],["h","Receiving stamp at delivery"],["p","The receiver signs or stamps here — this copy becomes the POD."]]]]},"7":{"k":"REAL DOCUMENT","t":"From BOL to POD — what to check before invoicing","r":[[[["lab","HOW A POD IS MADE"]],[["p","Receiver checks the freight"],["p","Receiver signs, prints name, writes date and time on the BOL"],["p","Any damage or shortage is written on it (OS&D)"],["p","Driver sends a clear photo or scan"],["h","That signed copy = the POD"]],[["h","Check the POD before you invoice"]],[["p","Receiver’s signature and printed name"],["p","Delivery date and time"],["p","Pieces match the BOL and RC"],["p","No damage or shortage notes — or report them first"],["p","BOL or order number is visible"],["p","Clear and readable — brokers reject blurry scans"]]]]},"8":{"k":"SAMPLE DOCUMENT","t":"What an invoice looks like","r":[[[["h","INVOICE"],["note","Sample Carrier LLC\nInvoice # 1045 · Date 10/01/2025"],["note","Pickup: Dallas, TX · 09/29   Delivery: Atlanta, GA · 09/30"],["table",[["Description","Amount"],["Line haul","$1,800.00"],["Detention (2 hours, approved)","$100.00"],["Lumper fee (receipt attached)","$100.00"],["Total due","$2,000.00"]]],["note","Terms: Net 30   Remit to: Sample Carrier LLC (or its factoring company)\nAttached: Rate confirmation, BOL, signed POD, lumper receipt"]],[["note","Bill to: Sample Broker Inc.\nLoad / RC # 123456"]],[["lab","TRAINING SAMPLE"]],[["h","Every invoice needs"]],[["p","Invoice number and date"],["p","Bill to: the broker"],["p","The broker’s load / RC number"],["p","Pickup and delivery info"],["p","Line haul + each accessorial on its own line"],["p","Total = RC amount + approved extras"],["p","Payment terms and remit-to address"],["p","Attached: RC, BOL, POD, receipts"]]]]},"9":{"k":"INVOICING","t":"How an invoice is sent","r":[[[["h","The broker then pays according to the payment terms (next slide)."]],[["p","Delivery is completed"],["p","POD is received from the driver"],["p","Accounting prepares the invoice"],["p","Invoice + documents go to the broker"]],[["lab","EXAMPLE INVOICE PACKAGE"],["stat","$2,000"],["p","Load value"]],[["p","Invoice"],["p","Rate Confirmation"],["p","BOL"],["p","Signed POD"]]]]},"10":{"k":"REAL BROKER RULES","t":"What a real rate confirmation says about invoicing","r":[[[["stat","7 days"],["p","Send the invoice and all documents within 7 days of delivery."]],[["stat","$75"],["p","Late paperwork can mean a late fee, payment delays and losing accessorial pay."]],[["stat","90 days"],["p","Paperwork sent more than 90 days after delivery: the carrier loses the right to be paid."]]],[[["h","Also on the RC"],["p","The RC number must appear on the invoice.\nExtra charges are paid only if approved before they happen — through a revised RC.\nThe carrier may never ask the shipper or receiver for payment — only the broker."]]]]},"11":{"k":"PAYMENT TERMS","t":"How fast brokers pay","r":[[[["stat","Net 15"],["h","Broker pays within 15 days after receiving the invoice."]],[["stat","Net 30"],["h","Broker pays within 30 days after receiving the invoice."]],[["lab","FASTER OPTION"],["stat","Factoring"],["p","The carrier sells the unpaid invoice to a factoring company and gets most of the money right away — no waiting 30 or 60 days. Next slide: how it works."]]]]},"12":{"k":"FACTORING","t":"How factoring works — a $50,000 example","r":[[[["h","Deliver & invoice"],["p","Carrier delivers and sends a $50,000 invoice. The customer will pay in 60 days."],["h","Sell the invoice"],["p","Carrier sends the invoice to a factoring company."],["h","Cash now"],["p","Factoring company pays $45,000 right away."],["h","The rest later"],["p","Customer pays $50,000 after 60 days. Factoring sends the remaining $3,000 and keeps a $2,000 fee."]],[["lab","WHERE THE $50,000 GOES"],["stat","$45,000"],["stat","$3,000"],["stat","$2,000"],["p","Why: fuel, drivers and repairs must be paid now — trucks keep moving."]],[["p","paid to carrier now"],["p","paid to carrier later"],["p","factoring fee"]]]]},"13":{"k":"ACCESSORIAL CHARGES","t":"Extra money on top of the load rate","r":[[[["table",[["Charge","What it means","Example"],["Detention","Paid waiting time during a load","Driver waits longer than the free time (often 2 hours)"],["Lumper fee","Paid loading or unloading labor","Warehouse workers unload the trailer"],["Layover","Overnight or day-long delay","Receiver can only unload tomorrow"],["TONU","Truck Ordered, Not Used","Broker cancels after the truck is dispatched"]]]]],[[["h","Rule: every accessorial must be confirmed by the broker and added to the invoice — or the company loses that money."]]]]},"14":{"k":"BEYOND INVOICING","t":"What else accounting covers","r":[[[["h","Cost accounting"],["p","Calculate the cost of transportation, warehousing, packaging, customs."]],[["h","Expense tracking"],["p","Fuel, labor, maintenance, insurance, tolls."]],[["h","Revenue accounting"],["p","Income from freight, delivery charges and contracts."]]],[[["h","Budgeting & forecasting"],["p","Plan future costs and find ways to save money."]],[["h","Financial reporting"],["p","Reports that show profit by operation or route."]],[["h","Payroll & IFTA"],["p","Pay drivers (per mile, hour or %) and file the quarterly fuel tax report."]]],[[["h","Tools: QuickBooks, TMW, McLeod or other trucking accounting software — plus Excel and email every day."]]]]},"15":{"k":"FINANCIAL REPORTS","t":"P&L — is the company making money?","r":[[[["p","The P&L (Income Statement) shows, for a month, quarter or year:"],["h","Revenue"]],[["p","money the company earned"]],[["table",[["Freight revenue (money in)","$100,000"],["Fuel","– $30,000"],["Drivers’ salaries","– $20,000"],["Warehouse rent","– $15,000"],["Truck maintenance","– $10,000"],["Insurance & tolls","– $5,000"],["Total expenses","– $80,000"],["Net profit","$20,000"]]]]],[[["h","Expenses"]],[["p","money the company spent"]]],[[["h","Net profit"]],[["p","revenue minus expenses (or a loss)"]]],[[["note","Example month from the accounting handout"]]]]},"16":{"k":"FINANCIAL REPORTS","t":"Balance sheet vs. cash flow","r":[[[["lab","BALANCE SHEET"],["h","A snapshot on one date"],["p","What we own, what we owe, what is left."],["h","Assets"],["note","trucks, warehouse, cash, unpaid invoices"],["h","Liabilities"],["note","loans, unpaid bills, salaries to pay"],["h","Equity"],["note","assets – liabilities"]],[["h","$750,000"],["h","$350,000"],["h","$400,000"]],[["lab","CASH FLOW STATEMENT"],["h","Money in and out over a period"],["p","Operating · Investing · Financing activities"],["h","Cash in"],["note","customer payments"],["h","Cash out"],["note","fuel, salaries, maintenance"],["h","Net cash flow"],["note","in – out (August)"]],[["h","$120,000"],["h","$80,000"],["h","+$40,000"]]]]},"17":{"k":"WHAT GOES WRONG","t":"Common problems and beginner mistakes","r":[[[["p","Missing POD\nWrong invoice amount\nBroker pays late\nMissing documents"]],[["h","Typical problems"]],[["p","Sending an incomplete invoice package\nForgetting accessorial charges\nNot tracking which invoices are paid"]],[["h","Beginner mistakes"]]],[[["h","Result: even a small mistake can delay payment for weeks."]]]]},"18":{"k":"SCENARIO","t":"The POD has no receiver signature. What do you do?","r":[[[["stat","Sends the invoice anyway."]],[["lab","BAD SPECIALIST"]],[["stat","Contacts the dispatcher or driver first."]],[["lab","GOOD SPECIALIST"]]],[[["p","Broker rejects it → payment is delayed → the company waits for money."]],[["p","Gets a corrected, signed POD → sends a complete package → broker pays on time."]]]]},"19":{"k":"","t":"CHECK EVERYTHING BEFORE YOU SEND.","r":[[[["h","THE GOLDEN RULE OF ACCOUNTING"]]],[[["p","One missing signature or one forgotten charge can cost the company weeks of waiting."]]]]},"20":{"k":"INTERVIEW QUESTIONS (1/4)","t":"Core questions — model answers","r":[[[["p","Q1"]],[["h","What is a POD?"],["p","“POD means Proof of Delivery. It is a document signed by the receiver that confirms the load was delivered. Without it, we cannot send the invoice.”"]]],[[["p","Q2"]],[["h","Why is invoicing important?"],["p","“Because the invoice is how the company gets paid. If it is late or wrong, the money is late, and the company cannot pay drivers and expenses on time.”"]]],[[["p","Q3"]],[["h","What documents are required for invoicing?"],["p","“The invoice, the Rate Confirmation, the Bill of Lading and the signed POD — plus receipts for any accessorial charges.”"]]]]},"21":{"k":"INTERVIEW QUESTIONS (2/4)","t":"Core questions — model answers","r":[[[["p","Q4"]],[["h","What are accessorial charges?"],["p","“Extra charges on top of the load rate — like detention, lumper fees, layover or TONU. They must be confirmed by the broker and included in the invoice.”"]]],[[["p","Q5"]],[["h","What happens if the POD is missing?"],["p","“I do not send the invoice. I contact the dispatcher or the driver, get the correct signed POD, and then send the full package.”"]]],[[["p","Q6"]],[["h","What is factoring?"],["p","“The carrier sells an unpaid invoice to a factoring company and gets most of the money right away. When the customer pays, the factoring company sends the rest, minus a small fee.”"]]]]},"22":{"k":"INTERVIEW QUESTIONS (3/4)","t":"Situation and personal questions","r":[[[["p","Q7"]],[["h","A broker has not paid after 30 days. What do you do?"],["p","“I check the package was complete and received. Then I follow up with the broker by email and phone, record each contact, and tell my manager if it is still unpaid.”"]]],[[["p","Q8"]],[["h","How do you avoid mistakes?"],["p","“I use a checklist for every invoice: RC, BOL, signed POD, accessorials, correct amount. I compare the invoice amount with the Rate Confirmation before sending.”"]]],[[["p","Q9"]],[["h","Why do you want to work in accounting?"],["p","“I like working with numbers and details, and I understand that accurate invoicing keeps the company’s cash flow healthy. I want to grow in US logistics.” [add your own reason]"]]]]},"23":{"k":"INTERVIEW QUESTIONS (4/4)","t":"Finance questions — model answers","r":[[[["p","Q10"]],[["h","What is a P&L?"],["p","“A Profit and Loss statement. It shows revenue, expenses and net profit for a period. For example, $100,000 revenue minus $80,000 expenses is $20,000 profit.”"]]],[[["p","Q11"]],[["h","Balance sheet or cash flow — what is the difference?"],["p","“The balance sheet is a snapshot on one date: assets, liabilities and equity. The cash flow statement shows money coming in and going out during a period.”"]]],[[["p","Q12"]],[["h","How fast must an invoice be sent after delivery?"],["p","“As fast as possible — it depends on the broker’s rate confirmation. For example, one broker requires 7 days, may charge a late fee after that, and pays nothing if paperwork comes more than 90 days after delivery.”"]]]]},"24":{"k":"VOCABULARY","t":"Words to use in the interview","r":[[[["table",[["Term","Meaning"],["Carrier","Trucking company that moves the load"],["Broker","Middleman who gives loads and pays"],["RC","Rate Confirmation (price agreement)"],["BOL","Bill of Lading (cargo details)"],["POD","Proof of Delivery (signed)"],["Invoice","Request for payment"],["Line haul","Base rate for moving the load"],["FSC","Fuel surcharge added to the line haul"],["All-in rate","Line haul + FSC together"]]]],[["table",[["Term","Meaning"],["Net 30","Payment within 30 days"],["Factoring","Selling an invoice for fast cash"],["Accessorial","Extra charge on top of the rate"],["TONU","Truck Ordered, Not Used"],["IFTA","Fuel tax agreement, reported quarterly"],["P&L","Revenue – expenses = profit"],["Balance sheet","Assets, liabilities, equity on one date"],["Cash flow","Money coming in and going out"],["Quick Pay","Broker pays faster, usually for a fee"]]]]]]},"25":{"k":"CHECKLISTS","t":"Two checklists to remember","r":[[[["h","Before sending any invoice"]],[["p","Rate Confirmation attached"],["p","BOL attached"],["p","POD attached and signed"],["p","Accessorial charges included"],["p","Invoice amount is correct"]],[["h","Before your interview"]],[["p","Explain the money flow in 1 minute"],["p","Name the 4 documents"],["p","Answer Q1–Q12 out loud"],["p","60-second “Tell me about yourself”"],["p","2 questions to ask the interviewer"]]]]},"26":{"k":"REFERENCES","t":"See more real documents","r":[[[["h","In your course materials"],["p","Real rate confirmation — logistics glossary, p. 17\nStandard BOL form — logistics glossary, p. 59\nRate confirmation terms (7-day / 90-day rules) — glossary, p. 18\nFactoring, P&L, balance sheet, cash flow — accounting handout"]],[["h","Online"],["p","ShipBob — Proof of delivery: how it works\nSPS Commerce — What is proof of delivery?\nUpper — Proof of delivery templates\nLion — NMFTA updates bill of lading standards"]]]]},"27":{"k":"","t":"YOU ARE READY FOR THE INTERVIEW.","r":[[[["p","Booked → Delivered → POD → Invoice → Paid → Recorded. Check everything before you send."]]],[[["h","Next in the series: Updater (Track & Trace)"]]]]}},"dispatch":{"2":{"k":"THE ROLE","t":"The air traffic controller of trucking","r":[[[["p","Dispatchers don’t drive — they make sure everything moves smoothly. Three main jobs:"]]],[[["h","Find loads"],["p","Search load boards and brokers for freight that fits the truck."]],[["h","Negotiate"],["p","Get a fair rate from the broker — every extra dollar is profit."]],[["h","Keep trucks moving"],["p","Send load info to drivers, watch pickups and deliveries, solve problems."]]],[[["tip","Key idea: good dispatchers keep trucks moving and reduce empty miles."]]]]},"3":{"k":"LOGISTICS CHAIN","t":"How freight moves in the US","r":[[[["h","Shipper"],["note","Owns the cargo"]],[["h","Broker"],["note","Finds trucks"]],[["h","Carrier"],["note","Owns the truck"]],[["h","Dispatcher"],["note","Manages truck & driver"]],[["h","Driver"],["note","Moves the freight"]],[["h","Receiver"],["note","Gets the cargo"]]],[[["p","Example: a warehouse in Ohio sends products to New Jersey. The broker finds a carrier, the dispatcher accepts the load and sends the driver to pickup."]]]]},"4":{"k":"THE TRUCK","t":"What is a box truck?","r":[[[["stat","26 ft"],["h","Size"],["p","A straight truck with a cargo box — usually up to 26 feet long, about 8 feet wide and high."]],[["stat","10,000 lbs"],["h","Payload"],["p","Can carry up to about 10,000 lbs. Always check each truck’s real limit."]],[["stat","~12"],["h","Pallets"],["p","A 26-foot box fits about 12 standard pallets (two rows)."]]],[[["stat","≤ 26,000"],["h","No CDL (usually)"],["p","Most are rated up to 26,000 lbs GVWR, so many drivers don’t need a CDL."],["p","Specs from a typical 26-ft non-CDL rental box truck (Penske). Trucks vary — always check yours."]],[["stat","Liftgate"],["h","Liftgate"],["p","Many have a power liftgate to load and unload without a dock."]],[["stat","Partial"],["h","Typical loads"],["p","Partial and LTL loads, local and regional runs, expedited freight."]]]]},"5":{"k":"BOX TRUCK VS SEMI","t":"How a box truck is different from a semi","r":[[[["table",[["","Box truck (26 ft)","Semi with 53-ft dry van"],["Max cargo","Up to about 10,000 lbs","Up to about 46,000 lbs"],["Pallets","About 12","About 26"],["License","Usually no CDL","CDL Class A"],["Typical loads","Partial / LTL, local, expedited","Full truckload, long haul"],["Loading","Liftgate + pallet jack, docks too","Dock-high loading"],["Trailer swap","No — the box is part of the truck","Yes — drop & hook possible"]]]]],[[["p","Before booking, always ask: does this load fit MY truck — weight, pallets, liftgate, appointment?"]]]]},"6":{"k":"LOAD BOARDS","t":"Where dispatchers find freight","r":[[[["h","DAT"],["p","The biggest load board: loads, rates and market conditions by lane."],["h","Truckstop"],["p","Another major load board — filter by equipment type (box truck / straight truck)."],["h","Amazon Relay"],["p","Amazon’s own load board (mostly for semi trucks)."],["h","Brokers you know"],["p","Repeat brokers often call good carriers first."]],[["lab","EXAMPLE BOX TRUCK LOAD"],["h","Atlanta, GA → Charlotte, NC"],["p","245 miles · 6 pallets · 6,000 lbs · liftgate at delivery · rate $650"]],[["p","6 pallets — fits (about 12 max)"],["p","6,000 lbs — under the payload"],["p","Liftgate needed — truck has one?"],["p","Appointment time works?"]]]]},"7":{"k":"RATE PER MILE","t":"Rate per mile (RPM) — is the load profitable?","r":[[[["stat","$650"],["p","Total rate the broker pays."]],[["stat","245 miles"],["p","Loaded miles from pickup to delivery."]],[["stat","$2.65 / mile"],["p","$650 ÷ 245 miles = rate per mile."]]],[[["h","Formula: Rate ÷ Miles = Rate per mile. Then compare RPM with:"],["p","Fuel costs and tolls\nDriver pay\nEmpty miles to get to the pickup (deadhead) — next slide"]]]]},"8":{"k":"DEADHEAD","t":"The truck is 55 empty miles from pickup","r":[[[["h","Books the load right away without counting deadhead."]],[["lab","BAD SPECIALIST"]],[["h","Counts deadhead first, then asks: “Can you do $750?”"]],[["lab","GOOD SPECIALIST"]]],[[["p","245 + 55 = 300 total miles → $650 ÷ 300 = only $2.17 per mile."]],[["p","$750 ÷ 300 miles = $2.50 per mile — the load becomes profitable."]]]]},"9":{"k":"NEGOTIATION","t":"A real negotiation — dispatcher vs broker","r":[[[["note","Broker"],["p","This load from Houston to Atlanta is paying $1,800."]],[["note","Dispatcher"],["p","That’s about 790 miles — around $2.27 per mile. With fuel at $4/gal and 120 miles deadhead, we’d need at least $2,000. Can you meet me there?"]],[["h","Negotiate smart"],["p","Know the market rate (DAT) before you call.\nExplain WHY: fuel, deadhead, urgency.\nHighlight value: on time, tracking, good equipment.\nStay polite — never just say “too low”.\nAsk for extras: detention, return loads."]]],[[["note","Broker"],["p","Let me check. I can do $1,950."]],[["note","Dispatcher"],["p","If you can cover $1,950 and include detention pay, we’ll lock it in now."]]]]},"10":{"k":"RATES","t":"What makes a rate go up or down","r":[[[["h","Lane"],["p","Popular lanes may pay less; remote lanes pay more."]],[["h","Season"],["p","Holidays, produce and storm season → higher demand, higher rates."]],[["h","Fuel prices"],["p","Diesel goes up → carriers ask for more."]]],[[["h","Deadhead"],["p","Long empty miles to pickup → the rate should be higher."]],[["h","Urgency"],["p","Last-minute or time-critical loads pay more."]],[["h","Truck capacity"],["p","Few trucks in the area → carriers can ask for more."]]]]},"11":{"k":"DOCUMENTS","t":"The three documents in every load","r":[[[["h","Rate Confirmation"],["note","Broker → carrier: price & details"]],[["h","Pickup → BOL"],["note","Cargo details, signed"]],[["h","Delivery → POD"],["note","Receiver signs"]],[["h","Payment"],["note","Invoice + RC, BOL, POD"]]],[[["p","Without a signed POD, brokers may refuse to pay. The dispatcher makes sure the driver sends clear photos of every document."]]]]},"12":{"k":"ACCESSORIAL CHARGES","t":"Extra money the dispatcher must ask for","r":[[[["table",[["Charge","What it means","What the dispatcher does"],["Detention","Driver waits too long (usually after 2 hours)","Send check-in/out times, request detention pay"],["Layover","Driver must stay overnight","Ask the broker for layover pay"],["TONU","Load cancelled after the truck was dispatched","Request TONU — typically $150–$300"],["Lumper","Warehouse workers unload the freight","Get approval and the receipt"],["Driver assist","Driver helps load or unload","Confirm the extra pay on the RC"],["Liftgate","Driver uses the liftgate (no dock)","Ask if the broker pays extra — confirm on the RC"]]]]]]},"13":{"k":"LOAD TYPES","t":"Types of loads — and what changes for a box truck","r":[[[["h","Live load"],["p","Driver waits while the truck is loaded (or unloaded). Most box truck loads work this way."]],[["h","Drop & hook"],["p","Driver drops an empty trailer and takes a loaded one. Not possible with a box truck — the box is part of the truck."]],[["h","Preloaded trailer"],["p","Trailer is loaded before the driver arrives. Also a semi-trailer setup."]]],[[["p","Box truck tip: ask the broker about the dock — no dock means the liftgate and a pallet jack are needed."]]]]},"14":{"k":"CANCELLATIONS","t":"When a load is cancelled","r":[[[["stat","Before dispatch"],["p","No driver assigned yet → usually no penalty."]],[["stat","After dispatch"],["p","Truck is already on the way → TONU fee, typically $150–$300."]],[["stat","After pickup"],["p","Very rare. Freight may be returned or rebooked; costs are negotiated."]]],[[["h","Example"],["p","The driver is dispatched for a 10:00 AM pickup. At 8:30 AM the broker cancels.\nThe truck was already assigned and dispatched, so the carrier can charge TONU.\nGood dispatchers always have a backup load ready."]]]]},"15":{"k":"PROBLEMS ON THE ROAD","t":"Common dispatch problems — and what to do","r":[[[["table",[["Problem","What the dispatcher does"],["Truck breakdown","Tell the broker immediately and arrange the repair with Fleet"],["Driver not responding","Call the driver and check the GPS location"],["Wrong pickup address","Contact the broker and get the correct address"],["Overweight load","Driver stays at the facility until the weight issue is fixed"],["No dock at delivery","Use the liftgate and pallet jack — confirm before booking"],["Delay (traffic, weather)","Update the broker with a new ETA and reschedule if needed"]]]]]]},"16":{"k":"DISPATCH BOARD","t":"The dispatch board — the control center","r":[[[["h","What it shows"],["p","Which drivers are free · truck locations · pickup and delivery schedules · status (en route, at shipper, loaded, delivered)"]],[["h","Key functions"],["p","Assign loads by location and equipment · track progress in real time · communication hub · reroute when there is a problem"]]],[[["h","Types"],["p","Manual (whiteboard) · digital (McLeod, Samsara, DAT, TMS) · mobile apps for drivers"]],[["h","Why it matters"],["p","Keeps work organized, reduces empty miles and shows who has which load"]]]]},"17":{"k":"NEVER DO THIS","t":"Double brokering is illegal","r":[[[["stat","Blacklisted"],["p","Brokers stop working with the carrier."]],[["stat","Money lost"],["p","Unpaid loads and claims."]],[["stat","Legal trouble"],["p","Fines and lawsuits."]]],[[["h","What is double brokering?"],["p","A carrier gives a load to another carrier without the broker’s permission.\nThe rate confirmation says the carrier must haul the load itself — no third parties."]]]]},"18":{"k":"SCENARIO","t":"The driver has waited 4 hours at the warehouse","r":[[[["stat","Does nothing."]],[["lab","BAD SPECIALIST"]],[["stat","Contacts the broker and requests detention pay."]],[["lab","GOOD SPECIALIST"]]],[[["p","The company loses detention money it earned."]],[["p","Sends check-in and check-out times as proof — the company gets paid for the waiting time."]]]]},"19":{"k":"","t":"CALCULATE BEFORE YOU BOOK.","r":[[[["h","THE GOLDEN RULE OF DISPATCH"]]],[[["p","Count the deadhead, check the truck fits, know the market rate — then negotiate."]]]]},"20":{"k":"INTERVIEW QUESTIONS (1/4)","t":"Core questions — model answers","r":[[[["p","Q1"]],[["h","What is rate per mile?"],["p","“Rate divided by miles. For example, $650 for 245 miles is about $2.65 per mile. I include deadhead miles to see the real rate.”"]]],[[["p","Q2"]],[["h","What is deadhead?"],["p","“Empty miles without freight — for example, driving to the pickup. I always add them when I calculate the rate per mile.”"]]],[[["p","Q3"]],[["h","What is detention?"],["p","“Payment when the driver waits too long at pickup or delivery, usually after 2 hours. I request it with check-in and check-out times.”"]]]]},"21":{"k":"INTERVIEW QUESTIONS (2/4)","t":"Core questions — model answers","r":[[[["p","Q4"]],[["h","What is TONU?"],["p","“Truck Ordered, Not Used — a fee when the broker cancels after the truck was dispatched. Typically $150–$300.”"]]],[[["p","Q5"]],[["h","What are a BOL and a POD?"],["p","“The BOL is the document from pickup that describes the freight. The POD is signed by the receiver and proves delivery — we need it to get paid.”"]]],[[["p","Q6"]],[["h","What is drop and hook?"],["p","“The driver drops one trailer and hooks a loaded one. With a box truck that’s not possible — the box is part of the truck, so loads are live.”"]]]]},"22":{"k":"INTERVIEW QUESTIONS (3/4)","t":"Core questions — model answers","r":[[[["p","Q7"]],[["h","What is double brokering?"],["p","“Giving a load to another carrier without the broker’s permission. It’s illegal and leads to blacklisting, money loss and legal problems.”"]]],[[["p","Q8"]],[["h","How is a box truck different from a semi?"],["p","“A box truck is smaller: up to about 10,000 lbs and 12 pallets, usually no CDL, often a liftgate — good for partial, local and expedited loads.”"]]],[[["p","Q9"]],[["h","How do you negotiate with a broker?"],["p","“I check the market rate on DAT, count deadhead and fuel, explain why I need more, stay polite, and ask for extras like detention.”"]]]]},"23":{"k":"INTERVIEW QUESTIONS (4/4)","t":"Situation and personal questions","r":[[[["p","Q10"]],[["h","The truck breaks down on the way. What do you do?"],["p","“I make sure the driver is safe, tell the broker immediately with a new plan, and work with Fleet to arrange the repair.”"]]],[[["p","Q11"]],[["h","What do you check before booking a load?"],["p","“Pickup and delivery, weight and pallets for my truck, liftgate, rate per mile with deadhead, appointment times and broker reliability.”"]]],[[["p","Q12"]],[["h","Why do you want to be a dispatcher?"],["p","“I like solving problems and negotiating, and dispatch is the heart of a trucking company. I want to grow in US logistics.” [add your own reason]"]]]]},"24":{"k":"VOCABULARY","t":"Words to use in the interview","r":[[[["table",[["Term","Meaning"],["RPM","Rate per mile"],["Deadhead","Empty miles without freight"],["Load board","Website to find loads (DAT)"],["Broker","Middleman who finds trucks"],["Carrier","Company that owns the truck"],["Shipper / Receiver","Sends / gets the cargo"],["RC","Rate Confirmation"],["BOL","Bill of Lading"],["POD","Proof of Delivery"],["Lane","Route from city A to city B"]]]],[["table",[["Term","Meaning"],["Detention","Paid waiting time"],["Layover","Overnight stay"],["TONU","Truck Ordered, Not Used"],["Lumper","Paid unloading labor"],["Driver assist","Driver helps load/unload"],["Liftgate","Platform that lifts pallets"],["Live load","Driver waits while loading"],["Drop & hook","Swap trailers (semi only)"],["Double brokering","Illegal re-brokering"],["Partial / LTL","Load smaller than a full truck"]]]]]]},"25":{"k":"CHECKLISTS","t":"Two checklists to remember","r":[[[["h","Before booking a load"]],[["p","Pickup and delivery location"],["p","Weight and pallets fit the truck"],["p","Liftgate or dock needed?"],["p","Rate per mile with deadhead"],["p","Appointment times"],["p","Broker reliability"],["p","Accessorials on the RC"]],[["h","Before your interview"]],[["p","Calculate RPM with deadhead"],["p","Explain box truck vs semi"],["p","Practice the negotiation"],["p","Answer Q1–Q12 out loud"],["p","60-second “Tell me about yourself”"]]]]},"26":{"k":"","t":"YOU ARE READY FOR THE INTERVIEW.","r":[[[["p","Find → Calculate → Negotiate → Move. Calculate before you book."]]],[[["h","Next in the series: Fleet"]]]]}},"eld":{"2":{"k":"THE DEVICE","t":"What is an ELD?","r":[[[["h","Electronic Logging Device"],["p","Records driving time automatically — no paper logs."],["h","Connected to the engine"],["p","The device plugs into the truck’s ECM (engine computer)."],["h","Tablet or phone app"],["p","The driver’s app connects to the device by Bluetooth."],["h","Required by FMCSA"],["p","Federal rules require ELDs to track Hours of Service."]]],[[["note","ELD device · ELD service training material"]]]]},"3":{"k":"THE ROLE","t":"What an ELD specialist does","r":[[[["p","ELD specialists support drivers and carriers with their electronic logs, usually in shifts, 24/7. Three main jobs:"]]],[[["h","Answer requests"],["p","Take driver calls and texts and solve log questions fast."]],[["h","Check companies"],["p","Review the logbooks of every company on your list for errors and violations."]],[["h","Keep logs legal"],["p","Make sure every log matches what the driver really did."]]],[[["tip","Key idea: duty status must match activity — the log must show what really happened."]]]]},"4":{"k":"YOUR SHIFT","t":"An ELD specialist’s shift","r":[[[["h","Take the shift"],["note","From the previous specialist"]],[["h","Answer requests"],["note","Calls and texts first"]],[["h","Check your companies"],["note","When you are free"]],[["h","Keep doing requests"],["note","While checking"]],[["h","Finish checking"],["note","By end of shift"]],[["h","Pass the shift"],["note","To the next specialist"]]],[[["p","Driver requests always come first — a driver waiting on the road cannot drive until his log is right."]]]]},"5":{"k":"HOURS OF SERVICE","t":"The HOS numbers you must know","r":[[[["stat","11 hours"],["h","Driving limit"],["p","Maximum driving after 10 hours off duty."]],[["stat","14 hours"],["h","Shift (on-duty window)"],["p","No driving after the 14th hour on duty."]],[["stat","30 minutes"],["h","Break"],["p","Required after 8 hours of driving."]]],[[["stat","10 hours"],["h","New shift"],["p","Off duty needed before a new shift."],["p","Property-carrying drivers · FMCSA. After a new shift, the driver must do a pre-trip inspection (PTI) before driving."]],[["stat","70 hours"],["h","Cycle"],["p","Maximum on duty in 8 days."]],[["stat","34 hours"],["h","New cycle (restart)"],["p","Off duty needed to restart the 70-hour cycle."]]]]},"6":{"k":"DUTY STATUSES","t":"The duty statuses in every ELD","r":[[[["p","Top row: the 4 main statuses. Bottom row: special statuses and events."],["h","Off Duty"],["p","Driver is resting, not working"]],[["h","Sleeper Berth"],["p","Resting in the truck’s sleeper"]],[["h","Driving"],["p","Recorded automatically when the truck moves"]],[["h","On Duty – Not Driving"],["p","Working but not driving: fueling, loading, PTI"]]],[[["h","Personal Conveyance (PC)"],["p","Moving the truck off duty for personal reasons, e.g. to a safe place to rest"]],[["h","Yard Move (YM)"],["p","Moving the truck inside a yard — counts as on duty"]],[["h","Minor events"],["p","Certifications, login / logout, engine power up / shut down"]],[["h","Intermediate logs"],["p","Automatic location points while driving"]]]]},"7":{"k":"THE PLATFORM","t":"Reading a driver’s logbook","r":[[[["note","ELD platform logbook (TruckX) · ELD service training material"]],[["h","Driver and date"],["p","Whose log and which day you are looking at."],["h","The graph"],["p","Four lines: Off, Sleeper, Driving, On duty — the day hour by hour."],["h","Event list"],["p","Each status with time, location, odometer and notes."],["h","Hours available"],["p","Time left to drive, in the shift and in the cycle."]]]]},"8":{"k":"COMPLIANCE","t":"Other ELD rules to know","r":[[[["h","Daily certification"],["p","The driver certifies his log every day — that he checked it and it is true."]],[["h","Status must match activity"],["p","Every status must show what the driver really did. Fake logs are falsification — a serious violation."]],[["h","Edits"],["p","Edits fix real mistakes only. The original stays saved, a note explains why, and the driver must approve."]]],[[["h","ELD malfunction"],["p","The driver notes it, tells the carrier within 24 hours and keeps paper logs until it is fixed."]],[["h","Unassigned driving"],["p","Driving with no driver logged in must be checked and assigned to the right driver."]],[["h","Roadside inspection"],["p","The driver shows the log on screen or sends it to the officer (data transfer)."]]]]},"9":{"k":"REQUEST WORKFLOW","t":"How to handle a driver request","r":[[[["h","Answer fast"],["p","Use the script, or text “Hello sir, okay, checking.”"],["h","Multitask"],["p","While talking, already open the driver’s logbook."],["h","Understand and act fast"],["p","Get the request and work on it right away."],["h","Tell the driver it’s done"],["p","By text, an update in the app, or a call."],["h","Double-check and record"],["p","Check the logbook again and type the request into the Google table."]],[["lab","EXAMPLE CALL (SCRIPT)"],["h","“Hey boss, how are you?” — “Going great, how can I help you?” — “I need a new shift.” — “Got it, I’ll check your log and text you.”"]],[["p","Friendly"],["p","Short"],["p","Fast"]]]]},"10":{"k":"COMMON REQUESTS","t":"Typical driver requests — and the right reaction","r":[[[["table",[["Driver says","What the ELD specialist does"],["“I need a new shift.”","Check that he really had 10 hours off. If yes and the status is wrong, correct it with a note. If not, tell him how long is left."],["“Make me a 30-minute break.”","Check the log: if he really stopped 30 minutes, fix the status. If not, tell him to take the break now."],["“I just got pulled over.”","Stay calm, check his log is correct, help him show or send it to the officer."],["“My ELD isn’t working.”","Malfunction: note it, tell the carrier, and the driver uses paper logs until it is fixed."],["“How many hours do I have?”","Read drive, shift and cycle time left and tell him clearly."]]]]]]},"11":{"k":"SCENARIO","t":"The driver asks for a 30-minute break he didn’t take","r":[[[["stat","Edits the log to show a break that never happened."]],[["lab","BAD SPECIALIST"]],[["stat","Checks the log and tells the driver honestly."]],[["lab","GOOD SPECIALIST"]]],[[["p","That is log falsification: out-of-service orders, fines, CSA points — for the driver and the company."]],[["p","“I see you drove 8 hours without a break. Please stop now for 30 minutes — then you can drive 3 more hours.”"]]]]},"12":{"k":"SCENARIO","t":"The driver calls: “I just got pulled over”","r":[[[["stat","Panics or doesn’t answer."]],[["lab","BAD SPECIALIST"]],[["stat","Answers right away and checks the log is correct."]],[["lab","GOOD SPECIALIST"]]],[[["p","The driver can’t show his logs → violation and maybe out of service."]],[["p","Helps the driver show the log on screen or send it to the officer, then follows up after the inspection."]]]]},"13":{"k":"","t":"THE LOG MUST MATCH REALITY.","r":[[[["h","THE GOLDEN RULE OF ELD"]]],[[["p","Be fast, be friendly — and keep every log legal."]]]]},"14":{"k":"INTERVIEW QUESTIONS (1/3)","t":"Core questions — model answers","r":[[[["p","Q1"]],[["h","What is an ELD?"],["p","“An Electronic Logging Device. It connects to the truck’s engine and records driving time automatically. FMCSA requires it to track Hours of Service.”"]]],[[["p","Q2"]],[["h","What are the main HOS rules?"],["p","“11 hours driving, a 14-hour shift, a 30-minute break after 8 hours of driving, 10 hours off for a new shift, a 70-hour cycle and a 34-hour restart.”"]]],[[["p","Q3"]],[["h","What are the duty statuses?"],["p","“Off Duty, Sleeper Berth, Driving and On Duty – Not Driving. Special ones are Personal Conveyance and Yard Move.”"]]]]},"15":{"k":"INTERVIEW QUESTIONS (2/3)","t":"Core questions — model answers","r":[[[["p","Q4"]],[["h","What is Personal Conveyance?"],["p","“Moving the truck off duty for personal reasons — for example, to a safe place to rest. It can’t be used to move a load for the company.”"]]],[[["p","Q5"]],[["h","What do you do when a driver asks for a new shift?"],["p","“I check his log. If he had 10 hours off and only the status is wrong, I correct it with a note. If not, I tell him how long he still needs.”"]]],[[["p","Q6"]],[["h","What does a driver do if the ELD stops working?"],["p","“He notes the malfunction, tells the carrier within 24 hours, and uses paper logs until the ELD is fixed.”"]]]]},"16":{"k":"INTERVIEW QUESTIONS (3/3)","t":"Situation and personal questions","r":[[[["p","Q7"]],[["h","A driver calls while you are checking companies. What do you do?"],["p","“I answer right away — requests come first. I open his logbook while we talk, solve it, then go back to checking.”"]]],[[["p","Q8"]],[["h","A driver got pulled over. How do you help?"],["p","“I stay calm, check his log is correct, and help him show it on screen or send it to the officer.”"]]],[[["p","Q9"]],[["h","Why do you want to be an ELD specialist?"],["p","“I’m fast, organized and good at multitasking, and I like helping drivers. It’s a great way to start in US trucking.” [add your own reason]"]]]]},"17":{"k":"VOCABULARY","t":"Words to use in the interview","r":[[[["table",[["Term","Meaning"],["ELD","Electronic Logging Device"],["ECM","Engine computer the ELD plugs into"],["HOS","Hours of Service rules"],["Shift","14-hour on-duty window"],["Cycle","70 hours in 8 days"],["Restart","34 hours off — new cycle"],["PTI","Pre-trip inspection"],["Logbook","The driver’s daily log"],["Certification","Driver confirms his log is true"]]]],[["table",[["Term","Meaning"],["Off Duty","Resting, not working"],["Sleeper Berth","Resting in the sleeper"],["On Duty","Working, not driving"],["PC","Personal Conveyance"],["YM","Yard Move"],["Malfunction","ELD not working correctly"],["Unassigned driving","Driving with no driver logged in"],["Data transfer","Sending logs to an officer"],["Falsification","Fake log entries — illegal"]]]]]]},"18":{"k":"CHECKLISTS","t":"Two checklists to remember","r":[[[["h","Before closing a request"]],[["p","Request done and driver informed"],["p","Log matches what really happened"],["p","Edit has a note and driver approval"],["p","Logbook double-checked"],["p","Request typed into the Google table"]],[["h","Before your interview"]],[["p","Say the 6 HOS numbers"],["p","Name all the duty statuses"],["p","Practice the phone script"],["p","Answer Q1–Q9 out loud"],["p","60-second “Tell me about yourself”"]]]]},"19":{"k":"","t":"YOU ARE READY FOR THE INTERVIEW.","r":[[[["p","Answer fast → Check the log → Keep it legal. The log must match reality."]]],[[["h","Next in the series: Recruiting"]]]]}},"fleet":{"2":{"k":"THE ROLE","t":"What fleet management does","r":[[[["p","Fleet maintains trucks, trailers and equipment so they run safely and efficiently. Three main goals:"]]],[[["h","Keep trucks running"],["p","Trucks are operational, inspected and ready for loads."]],[["h","Plan maintenance"],["p","Oil changes, brakes, tires and repairs happen on schedule."]],[["h","Fix breakdowns fast"],["p","React quickly so downtime is short and loads are not lost."]]],[[["tip","Key idea: if trucks are not maintained, loads are delayed and the company loses money."]]]]},"3":{"k":"DAILY TASKS","t":"What fleet specialists do","r":[[[["h","Monitor truck condition"],["p","Follow reports from drivers and inspections."]],[["h","Schedule preventive maintenance"],["p","Oil, brakes, tires, engine checks — before problems start."]],[["h","Handle breakdowns"],["p","Find help fast and get the truck back on the road."]]],[[["h","Work with repair shops"],["p","Get quotes, approve repairs, track progress."]],[["h","Track equipment"],["p","Trucks, trailers, GPS and ELD devices; registrations and permits."]],[["h","Monitor fuel"],["p","Fuel use, fuel cards and wasteful driving."]]]]},"4":{"k":"WORKFLOW","t":"From a problem to back in service","r":[[[["h","Driver reports an issue"],["note","Call, message, DVIR"]],[["h","Fleet evaluates"],["note","How serious? Safe to drive?"]],[["h","Contact repair shop"],["note","Nearest, approved"]],[["h","Truck is repaired"],["note","Track time & cost"]],[["h","Back in service"],["note","Dispatch informed"]]],[[["p","Fleet works closely with dispatch and drivers — every hour a truck is down, it is not earning money."]]]]},"5":{"k":"PREVENTIVE MAINTENANCE","t":"Fix it before it breaks","r":[[[["stat","Oil changes"],["p","Regular oil and filter service keeps the engine healthy."]],[["stat","Brakes & tires"],["p","Brake inspections and tire checks prevent the most common failures."]],[["stat","Engine diagnostics"],["p","Find small problems before they become big repairs."]]],[[["h","Why it matters"],["p","Prevents major breakdowns and makes trucks last longer.\nPreventive maintenance is always cheaper than major repairs.\nFleet measures: maintenance cost per mile · fuel consumption · equipment downtime."]]]]},"6":{"k":"PRE-TRIP INSPECTION","t":"What the driver checks before driving","r":[[[["h","Lights & reflectors"],["p","Headlights, turn signals, brake and clearance lights"]],[["h","Brakes"],["p","Air pressure, brake chambers, hoses, slack adjusters"]],[["h","Steering"],["p","Steering wheel play, power steering fluid, hoses"]],[["h","Suspension"],["p","Leaf springs, shocks, airbags"]]],[[["h","Tires & wheels"],["p","Tread depth, inflation, condition, lug nuts"]],[["h","Coupling"],["p","Fifth wheel, kingpin, locking jaws, air lines"]],[["h","Emergency equipment"],["p","Fire extinguisher, reflective triangles, spare fuses"]],[["h","Post-trip: DVIR"],["p","Driver writes a DVIR when defects are found"]]]]},"7":{"k":"BREAKDOWNS","t":"What causes most truck breakdowns","r":[[[["stat","≈ 50%"],["p","of roadside breakdowns are tire-related: under/over-inflation, worn tread, blowouts."]],[["stat","30–35%"],["p","are electrical and brake problems: dead batteries, alternators, air leaks, worn brakes."]],[["stat","The rest"],["p","cooling, engine, fuel system and transmission problems."]]],[[["h","What this means for fleet"],["p","Check tires and brakes most often — that prevents most breakdowns.\nWatch warning signs: strange noises, low air pressure, coolant or oil leaks."]]]]},"8":{"k":"BREAKDOWN MANAGEMENT","t":"A truck broke down — what fleet does","r":[[[["h","Driver reports the breakdown"],["p","Make sure the driver is safe first."],["h","Collect location and problem details"],["p","Where exactly? What happened? Photos, warning lights."],["h","Find a nearby repair shop or roadside service"],["p","Choose a shop that can fix it fast."],["h","Schedule the repair"],["p","Approve the work, track time and cost."],["h","Dispatcher adjusts the delivery plan"],["p","Tell the broker, reschedule or move the load."]],[["lab","INFO TO GIVE THE REPAIR SHOP"]],[["p","Driver name and phone"],["p","Truck number (plate)"],["p","Trailer number"],["p","Exact location"],["p","What is wrong"]]]]},"9":{"k":"FINDING HELP","t":"Where fleet finds a tow truck or repair shop","r":[[[["h","Tow411"],["p","Online tow truck directory."]],[["h","Google Maps"],["p","Search “tow truck near me” or “truck repair near me”."]],[["h","Trucker Path"],["p","Truck stop and service app."]]],[[["h","Pilot Flying J"],["p","Truck stop network with services."]],[["h","Love’s Connect"],["p","Love’s truck stop app."]],[["h","Roadside assistance"],["p","Preferred vendor list or a roadside number (e.g. TA, Penske, FleetNet)."]]],[[["p","Delays in response increase downtime and costs — keep a list of trusted shops ready."]]]]},"10":{"k":"EQUIPMENT TRACKING","t":"Fleet knows where every piece of equipment is","r":[[[["p","Top row: what fleet tracks. Bottom row: the four equipment statuses used in the system."],["h","Trucks"],["p","Assigned or available?"]],[["h","Trailers"],["p","Location and condition"]],[["h","GPS devices"],["p","Working and reporting?"]],[["h","ELD systems"],["p","Logging correctly?"]]],[[["h","In use"],["p","On a load"]],[["h","Empty"],["p","Ready for a load"]],[["h","At yard"],["p","Parked at the yard"]],[["h","In repair"],["p","At the shop"]]]]},"11":{"k":"FUEL MANAGEMENT","t":"Fuel — one of the biggest costs in trucking","r":[[[["stat","Fuel use"],["p","Monitor fuel consumption for every truck."]],[["stat","Fuel cards"],["p","Check fuel card use — right truck, right amount."]],[["stat","Driving habits"],["p","Spot wasteful driving patterns and coach drivers."]]],[[["h","IFTA — fuel tax"],["p","IFTA lets carriers report fuel tax for all states with one license, through their base state.\nFuel and miles are reported by state every quarter; every truck needs an IFTA sticker."]]]]},"12":{"k":"WHAT GOES WRONG","t":"Common problems and beginner mistakes","r":[[[["p","Engine failure\nTire damage\nBrake problems\nTrailer defects"]],[["h","Common fleet problems"]],[["p","Ignoring early warning signs\nDelaying maintenance\nPoor communication with drivers"]],[["h","Beginner mistakes"]]],[[["p","Preventive maintenance is always cheaper than major repairs."]]]]},"13":{"k":"SCENARIO","t":"The driver reports an unusual engine noise","r":[[[["stat","Tells the driver to keep driving."]],[["lab","BAD SPECIALIST"]],[["stat","Stops the truck and schedules an inspection."]],[["lab","GOOD SPECIALIST"]]],[[["p","The engine fails on the highway → expensive repair, lost load, angry broker."]],[["p","A small problem is fixed early — engine failure prevented."]]]]},"14":{"k":"","t":"FIX IT BEFORE IT BREAKS.","r":[[[["h","THE GOLDEN RULE OF FLEET"]]],[[["p","Good fleet management keeps trucks running safely and efficiently."]]]]},"15":{"k":"INTERVIEW QUESTIONS (1/3)","t":"Core questions — model answers","r":[[[["p","Q1"]],[["h","What is fleet management?"],["p","“Taking care of trucks, trailers and equipment — maintenance, repairs, tracking and fuel — so they are safe and earning money.”"]]],[[["p","Q2"]],[["h","Why is preventive maintenance important?"],["p","“It fixes small problems before they become breakdowns. It is always cheaper than major repairs and keeps trucks on the road.”"]]],[[["p","Q3"]],[["h","What do you do if a truck breaks down?"],["p","“Make sure the driver is safe, get the location and problem details, find a nearby shop, schedule the repair, and tell dispatch.”"]]]]},"16":{"k":"INTERVIEW QUESTIONS (2/3)","t":"Core questions — model answers","r":[[[["p","Q4"]],[["h","Why is fuel management important?"],["p","“Fuel is one of the biggest costs. Watching fuel use, fuel cards and driving habits saves the company a lot of money.”"]]],[[["p","Q5"]],[["h","What is a DVIR?"],["p","“Driver Vehicle Inspection Report. The driver writes it when he finds a defect, and fleet must fix it before the truck goes out again.”"]]],[[["p","Q6"]],[["h","What causes most breakdowns?"],["p","“Tires — about half of roadside breakdowns. Electrical and brake problems are next. So we check tires and brakes most often.”"]]]]},"17":{"k":"INTERVIEW QUESTIONS (3/3)","t":"Situation and personal questions","r":[[[["p","Q7"]],[["h","A driver hears a strange engine noise. What do you do?"],["p","“I tell him to stop safely and schedule an inspection right away. Driving on could destroy the engine.”"]]],[[["p","Q8"]],[["h","What information do you give a repair shop?"],["p","“Driver name and phone, truck and trailer numbers, exact location, and a clear description of the problem.”"]]],[[["p","Q9"]],[["h","Why do you want to work in fleet?"],["p","“I like solving technical problems and planning ahead. Fleet keeps the whole company moving.” [add your own reason]"]]]]},"18":{"k":"VOCABULARY","t":"Words to use in the interview","r":[[[["table",[["Term","Meaning"],["PM","Preventive maintenance"],["DVIR","Driver Vehicle Inspection Report"],["Pre-trip","Inspection before driving"],["Downtime","Time a truck can’t work"],["Roadside assistance","Help on the road"],["Fifth wheel","Coupling plate on the truck"],["Kingpin","Pin on the trailer that locks in"],["Slack adjuster","Part that adjusts the brakes"],["Tread depth","How deep tire grooves are"]]]],[["table",[["Term","Meaning"],["Fuel card","Card drivers use to buy fuel"],["IFTA","Fuel tax agreement (quarterly)"],["IRP","Registration for many states"],["ELD","Electronic Logging Device"],["GPS","Location tracking"],["Telematics","Data from the truck’s systems"],["Out of service","Not allowed to drive until fixed"],["Cost per mile","Cost divided by miles driven"],["Blowout","Sudden tire failure"]]]]]]},"19":{"k":"CHECKLISTS","t":"Two checklists to remember","r":[[[["h","Before a truck goes out"]],[["p","Maintenance schedule updated"],["p","No unresolved mechanical issues"],["p","Equipment inspection completed"],["p","Driver notified of any issues"]],[["h","Before your interview"]],[["p","Explain preventive maintenance"],["p","Walk through a breakdown call"],["p","Name the pre-trip check areas"],["p","Answer Q1–Q9 out loud"],["p","60-second “Tell me about yourself”"]]]]},"20":{"k":"","t":"YOU ARE READY FOR THE INTERVIEW.","r":[[[["p","Inspect → Maintain → Repair fast. Fix it before it breaks."]]],[[["h","Next in the series: Recruiting"]]]]}},"recruiting":{"2":{"k":"THE ROLE","t":"What the recruiting department does","r":[[[["p","Recruiters find and hire drivers and office staff. Without drivers, trucks cannot move freight. Three main jobs:"]]],[[["h","Find drivers"],["p","Search job boards, social media and referrals for good candidates."]],[["h","Check them"],["p","Verify documents and safety history before hiring."]],[["h","Keep them"],["p","Stay in touch so good drivers stay — and bring friends."]]],[[["tip","Key idea: driver turnover in the US is very high (60–90% per year in the course material), so recruiting never stops."]]]]},"3":{"k":"RECRUITING = SALES","t":"Recruiting works like a sales process","r":[[[["h","The product: the company"],["p","Competitive pay, benefits (fuel cards, bonuses, miles), reputation, culture and working conditions."]],[["h","The clients: drivers"],["p","They want fair treatment, clear communication, reliable equipment and good routes."]],[["h","The offer"],["p","Tailored to the driver: highlight pay and benefits, new equipment, consistent loads, flexible schedules."]]]]},"4":{"k":"RECRUITMENT FUNNEL","t":"Moving a driver from first contact to hired","r":[[[["h","Awareness"],["note","Ads and outreach get attention"]],[["h","Interest"],["note","Explain the company’s benefits"]],[["h","Consideration"],["note","Answer questions, check credentials"]],[["h","Conversion"],["note","Driver accepts and onboards"]],[["h","Retention"],["note","Keep in touch, get referrals"]]],[[["p","A satisfied driver is likely to refer others — that reduces future recruiting costs."]]]]},"5":{"k":"HIRING WORKFLOW","t":"The hiring process step by step","r":[[[["h","Recruiter finds candidate"],["note","Job boards, referrals"]],[["h","Interview"],["note","Experience, equipment, record"]],[["h","Documents & checks"],["note","PSP, MVR, drug test"]],[["h","Approved"],["note","With Safety"]],[["h","Onboarding"],["note","Orientation, first load"]]],[[["p","The recruiter collects documents, adds the driver to the CRM and works with Safety to check the background."]]]]},"6":{"k":"WHO RECRUITERS HIRE","t":"Three types of drivers","r":[[[["h","Company driver"],["p","Has a CDL but no truck. Paid a fixed rate, for example $0.65 per mile or 30% of the gross. The company provides the truck and pays fuel and maintenance."]],[["h","Lease operator"],["p","Has a CDL, wants to become an owner-operator. Leases a truck from the company, pays weekly rent and all truck costs. Higher dispatch fee — around 18%."]],[["h","Owner-operator"],["p","Owns the truck, maybe has an own MC. Under the company’s MC pays a dispatch fee — market rate about 12%. Pays fuel and maintenance; company gives insurance and devices."]]],[[["p","Pay numbers are examples from the course material — every company is different."]]]]},"7":{"k":"SOURCES","t":"Where recruiters find drivers","r":[[[["h","Indeed"],["p","Free or paid job posts"]],[["h","Facebook"],["p","Ads and free posts in driver groups"]],[["h","Instagram"],["p","Ads to get leads"]],[["h","LinkedIn"],["p","Professional profiles"]]],[[["h","Referral program"],["p","Drivers bring drivers for a bonus"]],[["h","YouTube & influencers"],["p","Bloggers and brand ambassadors"]],[["h","Driver job websites"],["p","Paid subscriptions with leads"]],[["h","Recruiting agencies"],["p","Bring ready-to-go drivers"]]]]},"8":{"k":"APPLICATION PACKAGE","t":"Documents a driver must give before hiring","r":[[[["h","CDL"],["p","Commercial Driver’s License — valid, right class and endorsements."]],[["h","Medical card"],["p","DOT medical certificate — not expired."]],[["h","Application form"],["p","The company’s driver application."]]],[[["h","Employment history"],["p","Previous jobs and driving experience."]],[["h","Drug test results"],["p","Pre-employment drug test."]],[["h","Then: checks"],["p","PSP, MVR and the drug & alcohol checks — next slide."]]]]},"9":{"k":"BACKGROUND CHECKS","t":"The three checks before hiring","r":[[[["stat","PSP"],["h","Pre-Employment Screening Program"],["p","From FMCSA: crashes from the last 5 years and roadside inspections from the last 3 years. Drivers can order their own for about $10."]],[["stat","MVR"],["h","Motor Vehicle Record"],["p","Shows license status and traffic violations."]],[["stat","Test"],["h","Drug & alcohol"],["p","Pre-employment test — makes sure the driver follows safety rules."]]],[[["p","A clean PSP helps drivers get better jobs; repeated violations hurt their chances."]]]]},"10":{"k":"DRIVER INTERVIEW","t":"Talking to a driver candidate","r":[[[["h","Driving experience"],["p","How many years? What kind of routes?"],["h","Equipment type"],["p","Dry van, reefer, flatbed, box truck?"],["h","Accident history"],["p","Any accidents or violations?"],["h","HOS knowledge"],["p","Does the driver know the Hours of Service rules?"]],[["lab","EXAMPLE OPENING"],["h","“Hello, my name is Alex from ABC Logistics. I saw your profile and wanted to ask about your driving experience.”"]],[["p","Clear"],["p","Friendly and professional"],["p","Builds trust"]]]]},"11":{"k":"WHAT GOES WRONG","t":"Common problems and beginner mistakes","r":[[[["p","Incomplete driver applications\nCandidates with poor driving history\nDrivers not answering calls\nCandidates failing drug tests"]],[["h","Common recruiting problems"]],[["p","Hiring drivers too quickly\nNot verifying documents\nIgnoring safety history"]],[["h","Beginner mistakes"]]],[[["p","Hiring the wrong driver can create safety and legal problems."]]]]},"12":{"k":"SCENARIO","t":"A candidate has many safety violations","r":[[[["stat","Hires him right away to fill the truck."]],[["lab","BAD SPECIALIST"]],[["h","Reviews the safety record and rejects the candidate."]],[["lab","GOOD SPECIALIST"]]],[[["p","Accidents, higher insurance and legal risk for the company."]],[["p","Protects the company’s safety — and keeps looking for a better driver."]]]]},"13":{"k":"RETENTION","t":"Keeping good drivers","r":[[[["stat","60–90%"],["p","Average yearly driver turnover in US trucking (course material)."]],[["stat","Referrals"],["p","Happy drivers bring new drivers — pay a referral bonus."]],[["stat","Home time"],["p","Bonuses and home-time policies help drivers stay."]]],[[["h","Just like in sales"],["p","Know all your drivers and stay in touch after hiring.\nHelp solve problems while the driver works for the company.\nEvery driver who stays saves the cost of hiring a new one."]]]]},"14":{"k":"","t":"HIRE SAFE, NOT FAST.","r":[[[["h","THE GOLDEN RULE OF RECRUITING"]]],[[["p","Proper recruiting brings safe and reliable drivers."]]]]},"15":{"k":"INTERVIEW QUESTIONS (1/3)","t":"Core questions — model answers","r":[[[["p","Q1"]],[["h","What documents are required to hire a driver?"],["p","“CDL, medical card, the application form, employment history and drug test results. Then we check PSP and MVR.”"]]],[[["p","Q2"]],[["h","What is PSP?"],["p","“Pre-Employment Screening Program from FMCSA. It shows a driver’s crashes from the last 5 years and inspections from the last 3 years.”"]]],[[["p","Q3"]],[["h","Why is the MVR important?"],["p","“The Motor Vehicle Record shows if the license is valid and what violations the driver has — it tells us if the driver is safe.”"]]]]},"16":{"k":"INTERVIEW QUESTIONS (2/3)","t":"Core questions — model answers","r":[[[["p","Q4"]],[["h","Why do companies perform drug tests?"],["p","“Federal rules require them, and they make sure drivers are safe. A driver who fails cannot drive for us.”"]]],[[["p","Q5"]],[["h","What makes a good driver candidate?"],["p","“A valid CDL and medical card, a clean PSP and MVR, a passed drug test, real experience with our equipment, and good communication.”"]]],[[["p","Q6"]],[["h","Company driver vs owner-operator?"],["p","“A company driver uses the company’s truck and gets per-mile or percentage pay. An owner-operator owns the truck, pays its costs and pays a dispatch fee.”"]]]]},"17":{"k":"INTERVIEW QUESTIONS (3/3)","t":"Situation and personal questions","r":[[[["p","Q7"]],[["h","Where do you find drivers?"],["p","“Indeed, Facebook groups and ads, LinkedIn, driver job boards, agencies — and referrals from our own drivers, which are often the best.”"]]],[[["p","Q8"]],[["h","How do you keep drivers from leaving?"],["p","“Stay in touch, solve their problems fast, be honest about pay and home time, and use referral and bonus programs.”"]]],[[["p","Q9"]],[["h","Why do you want to work in recruiting?"],["p","“I like talking to people and I’m good at building trust. Recruiting is like sales — and drivers are the heart of trucking.” [add your own reason]"]]]]},"18":{"k":"VOCABULARY","t":"Words to use in the interview","r":[[[["table",[["Term","Meaning"],["CDL","Commercial Driver’s License"],["Class A","CDL for tractor-trailers"],["Endorsement","Extra permission on a CDL"],["Medical card","DOT medical certificate"],["MVR","Motor Vehicle Record"],["PSP","Driver crash & inspection history"],["Clearinghouse","Drug & alcohol violation database"],["DQ file","Driver Qualification file"],["Onboarding","Getting a new driver started"],["Orientation","First training for new drivers"]]]],[["table",[["Term","Meaning"],["Company driver","Drives the company’s truck"],["Lease operator","Leases a truck from the company"],["Owner-operator","Owns the truck"],["MC number","Motor carrier authority number"],["Gross","Total money a load pays"],["Dispatch fee","% of gross paid for dispatch"],["Referral","Driver recommends a driver"],["Turnover","Drivers leaving the company"],["Retention","Keeping drivers"],["CRM","System to track candidates"]]]]]]},"19":{"k":"CHECKLISTS","t":"Two checklists to remember","r":[[[["h","Before hiring a driver"]],[["p","CDL verified"],["p","Medical card valid"],["p","PSP reviewed"],["p","MVR checked"],["p","Drug test completed"]],[["h","Before your interview"]],[["p","Name the 5 hiring documents"],["p","Explain PSP and MVR"],["p","Compare the 3 driver types"],["p","Answer Q1–Q9 out loud"],["p","60-second “Tell me about yourself”"]]]]},"20":{"k":"","t":"YOU ARE READY FOR THE INTERVIEW.","r":[[[["p","Find → Check → Keep. Hire safe, not fast."]]],[[["h","Next in the series: Mock interview day"]]]]}},"safety":{"2":{"k":"THE ROLE","t":"What the safety department does","r":[[[["p","Safety protects drivers, cargo and the company from legal and financial risks. Three main goals:"]]],[[["h","Prevent accidents"],["p","Monitor driver behavior, fatigue and equipment before something goes wrong."]],[["h","Reduce violations"],["p","Follow FMCSA rules: Hours of Service, inspections, driver qualifications."]],[["h","Protect the company"],["p","Avoid fines, high insurance costs and lost broker trust."]]],[[["tip","Key idea: zero accidents, minimal violations and a strong safety culture."]]]]},"3":{"k":"DAILY TASKS","t":"What safety specialists do","r":[[[["h","Monitor HOS"],["p","Check driver hours every day in the ELD system."]],[["h","Review DOT inspections"],["p","Read every roadside inspection report and record violations."]],[["h","Track violations & CSA"],["p","Watch the company’s CSA scores and fix problem areas."]]],[[["h","Keep driver files"],["p","Driver Qualification (DQ) files: CDL, medical card, records."]],[["h","Investigate accidents"],["p","Collect facts, report to insurance, find the cause."]],[["h","Drug & alcohol tests"],["p","Run the testing program and train drivers on safety rules."]]]]},"4":{"k":"WORKFLOW","t":"What happens after a DOT inspection","r":[[[["h","Driver gets inspected"],["note","Roadside"]],[["h","Safety reviews the report"],["note","Same day"]],[["h","Violations recorded"],["note","In the system"]],[["h","Corrective action"],["note","Coaching, training, repair"]],[["h","Records updated"],["note","Ready for audits"]]],[[["p","Small violations today become a high CSA score tomorrow — never skip a report."]]]]},"5":{"k":"HOURS OF SERVICE","t":"HOS limits every safety specialist must know","r":[[[["stat","11 hours"],["h","Driving limit"],["p","Maximum driving after 10 hours off duty."]],[["stat","14 hours"],["h","On-duty window"],["p","No driving after the 14th hour on duty."]],[["stat","30 minutes"],["h","Break"],["p","Required after 8 hours of driving."]]],[[["stat","10 hours"],["h","Off duty"],["p","Off-duty time before a new shift."],["p","Rules for property-carrying drivers · Source: FMCSA summary of Hours of Service regulations"]],[["stat","60 / 70 hrs"],["h","Weekly limit"],["p","On duty in 7 or 8 days — then no driving."]],[["stat","34 hours"],["h","Restart"],["p","Off duty to reset the weekly limit."]]]]},"6":{"k":"ELD MONITORING","t":"Why safety checks ELD logs every day","r":[[[["h","Catch violations early"],["p","For example, driving over the 11-hour limit or missing the 30-minute break."],["h","Prevent fatigued driving"],["p","Tired drivers are a top cause of accidents."],["h","Be ready for DOT audits"],["p","Clean, complete logs pass audits."],["h","Avoid penalties"],["p","Violations can mean citations, fines or even a company shutdown."]],[["lab","COMMON HOS VIOLATIONS"]],[["p","Driving beyond the 11 / 14-hour limits"],["p","Missed 30-minute break"],["p","Log falsification or ELD manipulation"],["p","Driving over the 60 / 70-hour limit"]]]]},"7":{"k":"DOT INSPECTIONS","t":"The three main DOT inspection levels","r":[[[["stat","Level I"],["h","Full inspection"],["p","The most thorough. Driver: CDL, medical card, HOS logs, drug/alcohol status, seatbelt. Vehicle: brakes, tires, lights, suspension, coupling, cargo securement and more."]],[["stat","Level II"],["h","Walk-around"],["p","Inspector walks around the truck for visible defects and checks the driver’s documents. Usually no crawling under the truck."]],[["stat","Level III"],["h","Driver-only"],["p","Only the driver: CDL, endorsements, medical card, ELD logs, seatbelt, BOL and hazmat papers."]]],[[["p","Inspections are done by FMCSA and state inspectors. Safety reviews every report — clean inspections help the CSA score."]]]]},"8":{"k":"CSA SCORE","t":"CSA — how the government measures safety","r":[[[["p","CSA = Compliance, Safety, Accountability. FMCSA groups violations into 7 categories called BASICs:"],["h","Unsafe Driving"],["p","Speeding, phone use"]],[["h","HOS Compliance"],["p","Hours of Service"]],[["h","Driver Fitness"],["p","CDL, medical card"]],[["h","Drugs & Alcohol"],["p","Controlled substances"]]],[[["h","Vehicle Maintenance"],["p","Brakes, tires, lights"]],[["h","Hazmat Compliance"],["p","Dangerous goods"]],[["h","Crash Indicator"],["p","Crash history"]],[["h","High score = bad"],["p","More inspections, higher insurance, brokers lose trust"]]]]},"9":{"k":"VIOLATION ANALYSIS","t":"Common violations by category","r":[[[["table",[["Category","Common violations"],["Hours of Service","Driving beyond 11 / 14-hour limits · missed 30-minute break · log falsification"],["Vehicle maintenance","Brake defects · tire problems (flat, low tread) · broken lights · missing safety equipment"],["Driver fitness","No valid CDL · expired medical card · suspended license"],["Drugs & alcohol","Positive test · refusal to test (counts as positive) · Clearinghouse violations"],["Unsafe driving","Speeding 15+ mph over · following too close · hand-held phone or texting"],["Hazardous materials","Missing placards · bad cargo securement · wrong shipping papers"]]]]]]},"10":{"k":"DRIVER DOCUMENTS","t":"Documents a driver must have in the truck","r":[[[["h","CDL"],["p","Commercial Driver’s License"]],[["h","DOT medical card"],["p","Proves the driver is fit"]],[["h","ELD logs"],["p","Hours of Service records"]],[["h","Proof of insurance"],["p","Truck insurance papers"]],[["h","Registration & lease"],["p","Truck registration, lease agreement"]]],[[["h","BOL"],["p","Bill of Lading for the load"]],[["h","IFTA license & decals"],["p","Fuel tax sticker"]],[["h","IRP cab card"],["p","Apportioned registration"]],[["h","Permit book"],["p","Special permits"]],[["h","Personal ID"],["p","Driver identification"]]]]},"11":{"k":"DRUG & ALCOHOL TESTING","t":"When drivers must be tested","r":[[[["p","Pre-employment — before the first trip"],["p","Random — drugs and alcohol, unannounced"],["p","Post-accident — when FMCSA criteria are met"],["p","Reasonable suspicion — signs of drug or alcohol use"],["p","Return-to-duty and follow-up — after a violation"]],[["lab","RULES TO REMEMBER"]],[["p","Refusing a test = a positive test"],["p","Violations go to the Clearinghouse"],["p","After an accident the driver cannot drive himself to the clinic"],["p","Alcohol test within 2–8 hours, depending on the case"],["p","Keep chain-of-custody forms ready"]]]]},"12":{"k":"ACCIDENT MANAGEMENT","t":"What safety does after an accident","r":[[[["h","Collect information"],["note","Time, place, photos"]],[["h","Contact the driver"],["note","Calm instructions"]],[["h","Document it"],["note","Accident report"]],[["h","Report to insurance"],["note","Same day"]],[["h","Find the cause"],["note","Prevent it again"]]],[[["p","Driver at the scene: warning triangles and flashers → call 911 if needed → tell dispatch and safety → photos and witness info. Keep accident records for 3 years."]]]]},"13":{"k":"POST-ACCIDENT TESTING","t":"When a post-accident drug & alcohol test is required","r":[[[["stat","Fatality"],["p","Someone died — always test the driver."]],[["stat","Injury + citation"],["p","Someone needed medical treatment and the driver got a ticket."]],[["stat","Tow + citation"],["p","A vehicle was towed away and the driver got a ticket."]]],[[["h","Root cause analysis after an accident"],["p","Find the cause: driver error, equipment, weather or another party.\nFix it: retraining, maintenance, route changes, safety meeting.\nUpdate policies so it does not happen again."]]]]},"14":{"k":"FMCSA AUDITS","t":"Audits — and what FMCSA checks","r":[[[["h","New entrant audit"],["p","Within 12 months of starting operations."]],[["h","Compliance review"],["p","After crashes, high CSA scores, or random selection."]],[["h","Focused audit"],["p","One area only, like HOS or drug testing."]]],[[["h","DQ files"],["p","Driver qualification files"]],[["h","HOS & maintenance"],["p","Logs, inspections, repairs"]],[["h","Drug & alcohol, accidents, insurance"],["p","Testing program, accident register, records"]]]]},"15":{"k":"WHAT GOES WRONG","t":"Common problems and beginner mistakes","r":[[[["p","Driver exceeding HOS limits\nVehicle equipment violations\nImproper cargo securement\nDriver fatigue"]],[["h","Typical safety problems"]],[["p","Ignoring small violations\nNot reviewing inspection reports carefully\nPoor communication with drivers"]],[["h","Beginner mistakes"]]],[[["p","Even small safety issues can create large problems for the company."]]]]},"16":{"k":"SCENARIO","t":"A minor inspection violation — what do you do?","r":[[[["stat","Ignores it and does not record it."]],[["lab","BAD SPECIALIST"]],[["stat","Reviews it, documents it and educates the driver."]],[["lab","GOOD SPECIALIST"]]],[[["p","Violations add up → CSA score rises → more inspections and higher insurance."]],[["p","The driver learns, the record is complete, the same violation does not happen again."]]]]},"17":{"k":"","t":"NO VIOLATION IS TOO SMALL.","r":[[[["h","THE GOLDEN RULE OF SAFETY"]]],[[["p","Record it, fix it, teach it — strong safety management protects the company and the drivers."]]]]},"18":{"k":"INTERVIEW QUESTIONS (1/3)","t":"Core questions — model answers","r":[[[["p","Q1"]],[["h","What is HOS?"],["p","“Hours of Service — FMCSA rules that limit driving time to prevent fatigue: 11 hours driving, a 14-hour window, a 30-minute break after 8 hours, and 10 hours off.”"]]],[[["p","Q2"]],[["h","Why are DOT inspections important?"],["p","“They check that the driver and truck are safe and legal. Every violation affects our CSA score, so safety reviews every report.”"]]],[[["p","Q3"]],[["h","What is a CSA score?"],["p","“Compliance, Safety, Accountability — FMCSA’s system that measures how safe a carrier is. A high score means more inspections and higher insurance.”"]]]]},"19":{"k":"INTERVIEW QUESTIONS (2/3)","t":"Core questions — model answers","r":[[[["p","Q4"]],[["h","Why does safety compliance matter?"],["p","“It prevents accidents and protects drivers. It also protects the company from fines, high insurance costs and losing brokers.”"]]],[[["p","Q5"]],[["h","A driver violates HOS. What do you do?"],["p","“I contact the driver and make sure he stops and rests legally, record the violation, coach him, and check with dispatch if the plan caused it.”"]]],[[["p","Q6"]],[["h","What are the DOT inspection levels?"],["p","“Level I is a full inspection of driver and truck, Level II is a walk-around, and Level III checks only the driver and documents.”"]]]]},"20":{"k":"INTERVIEW QUESTIONS (3/3)","t":"Situation and personal questions","r":[[[["p","Q7"]],[["h","What do you do after an accident?"],["p","“Make sure everyone is safe, collect the facts and photos, document everything, report to insurance the same day, arrange testing if required
